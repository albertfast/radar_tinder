<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
  <title>3D Speedometer — Animated Gauge</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #050510;
    }
    canvas { display: block; width: 100vw; height: 100vh; }

    /* Speed digital display */
    #speed-display {
      position: fixed;
      bottom: 18%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      text-align: center;
      pointer-events: none;
    }
    #speed-value {
      font-family: 'Courier New', monospace;
      font-size: 52px;
      font-weight: bold;
      color: #00d4ff;
      text-shadow: 0 0 20px rgba(0, 212, 255, 0.6), 0 0 40px rgba(0, 212, 255, 0.3);
      letter-spacing: 4px;
    }
    #speed-unit {
      font-family: 'Segoe UI', sans-serif;
      font-size: 14px;
      color: rgba(0, 212, 255, 0.5);
      letter-spacing: 6px;
      text-transform: uppercase;
      margin-top: -4px;
    }

    /* Controls for demo */
    #controls {
      position: fixed;
      bottom: 4%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    #controls button {
      background: rgba(0, 212, 255, 0.15);
      border: 1px solid rgba(0, 212, 255, 0.3);
      color: #00d4ff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      letter-spacing: 2px;
      transition: all 0.3s;
    }
    #controls button:hover {
      background: rgba(0, 212, 255, 0.25);
      border-color: rgba(0, 212, 255, 0.6);
    }
    #controls button.active {
      background: rgba(0, 212, 255, 0.35);
      border-color: #00d4ff;
      box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
    }
    #speed-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 200px;
      height: 4px;
      background: rgba(0, 212, 255, 0.2);
      border-radius: 2px;
      outline: none;
    }
    #speed-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #00d4ff;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
    }

    /* HUD corners */
    .hud-corner {
      position: fixed;
      width: 30px;
      height: 30px;
      border-color: rgba(0, 212, 255, 0.2);
      border-style: solid;
      border-width: 0;
      z-index: 10;
      pointer-events: none;
    }
    .hud-corner.tl { top: 10px; left: 10px; border-top-width: 1px; border-left-width: 1px; }
    .hud-corner.tr { top: 10px; right: 10px; border-top-width: 1px; border-right-width: 1px; }
    .hud-corner.bl { bottom: 10px; left: 10px; border-bottom-width: 1px; border-left-width: 1px; }
    .hud-corner.br { bottom: 10px; right: 10px; border-bottom-width: 1px; border-right-width: 1px; }
  </style>
</head>
<body>
  <div class="hud-corner tl"></div>
  <div class="hud-corner tr"></div>
  <div class="hud-corner bl"></div>
  <div class="hud-corner br"></div>

  <div id="speed-display">
    <div id="speed-value">0</div>
    <div id="speed-unit">km/h</div>
  </div>

  <div id="controls">
    <button id="btn-sim" class="active">SIM</button>
    <button id="btn-manual">MANUAL</button>
    <input type="range" id="speed-slider" min="0" max="240" value="0" style="display:none;" />
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // ═══════════════════════════════════════════════════════════
    //  CONFIGURATION
    // ═══════════════════════════════════════════════════════════
    const MAX_SPEED = 240;
    const DANGER_ZONE = 160;    // speed where color shifts to red
    const REDLINE = 200;        // speed where it gets intense
    const GAUGE_ARC = Math.PI * 1.5; // 270 degrees
    const GAUGE_START = Math.PI * 0.75; // start angle (bottom-left)

    // Current speed state
    let currentSpeed = 0;
    let targetSpeed = 0;
    let mode = 'sim'; // 'sim' or 'manual'

    // ═══════════════════════════════════════════════════════════
    //  SCENE SETUP
    // ═══════════════════════════════════════════════════════════
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050510, 0.02);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(0, 6, 7);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    document.body.appendChild(renderer.domElement);

    // ═══════════════════════════════════════════════════════════
    //  LIGHTING
    // ═══════════════════════════════════════════════════════════
    scene.add(new THREE.AmbientLight(0x1a1a3e, 0.4));

    const coreGlow = new THREE.PointLight(0x00d4ff, 2, 12);
    coreGlow.position.set(0, 0, 0);
    scene.add(coreGlow);

    const dangerLight = new THREE.PointLight(0xff2d7b, 0, 8);
    dangerLight.position.set(0, 0, 0);
    scene.add(dangerLight);

    const rimLight = new THREE.PointLight(0x8b5cf6, 1, 15);
    rimLight.position.set(0, 3, -4);
    scene.add(rimLight);

    // ═══════════════════════════════════════════════════════════
    //  1. GAUGE FACE — Tilted Disc
    // ═══════════════════════════════════════════════════════════
    const gaugeGroup = new THREE.Group();
    gaugeGroup.rotation.x = -Math.PI * 0.35; // tilt toward camera
    scene.add(gaugeGroup);

    // Main disc background
    const discGeo = new THREE.CylinderGeometry(4.2, 4.2, 0.15, 64);
    const discMat = new THREE.MeshPhysicalMaterial({
      color: 0x0a0a1a,
      emissive: 0x050510,
      emissiveIntensity: 0.2,
      roughness: 0.6,
      metalness: 0.8,
      transparent: true,
      opacity: 0.95,
    });
    const disc = new THREE.Mesh(discGeo, discMat);
    disc.rotation.x = Math.PI / 2;
    gaugeGroup.add(disc);

    // Outer ring (bezel)
    const bezelGeo = new THREE.TorusGeometry(4.3, 0.12, 16, 128);
    const bezelMat = new THREE.MeshPhysicalMaterial({
      color: 0x1a1a3e,
      emissive: 0x0a0a2e,
      emissiveIntensity: 0.3,
      roughness: 0.2,
      metalness: 1.0,
      clearcoat: 1.0,
    });
    const bezel = new THREE.Mesh(bezelGeo, bezelMat);
    gaugeGroup.add(bezel);

    // Inner decorative ring
    const innerRingGeo = new THREE.TorusGeometry(3.6, 0.03, 8, 128);
    const innerRingMat = new THREE.MeshBasicMaterial({
      color: 0x00d4ff,
      transparent: true,
      opacity: 0.2,
    });
    gaugeGroup.add(new THREE.Mesh(innerRingGeo, innerRingMat));

    // ═══════════════════════════════════════════════════════════
    //  2. SPEED MARKINGS — Tick marks & Numbers
    // ═══════════════════════════════════════════════════════════
    const tickGroup = new THREE.Group();

    // Create tick marks around the arc
    for (let speed = 0; speed <= MAX_SPEED; speed += 10) {
      const fraction = speed / MAX_SPEED;
      const angle = GAUGE_START - fraction * GAUGE_ARC;
      const isMajor = speed % 20 === 0;
      const isRedline = speed >= REDLINE;

      const tickLength = isMajor ? 0.45 : 0.2;
      const innerR = 3.4;
      const outerR = innerR + tickLength;

      const x1 = Math.cos(angle) * innerR;
      const y1 = Math.sin(angle) * innerR;
      const x2 = Math.cos(angle) * outerR;
      const y2 = Math.sin(angle) * outerR;

      const points = [new THREE.Vector3(x1, y1, 0.1), new THREE.Vector3(x2, y2, 0.1)];
      const lineGeo = new THREE.BufferGeometry().setFromPoints(points);

      let tickColor;
      if (isRedline) tickColor = 0xff2d7b;
      else if (speed >= DANGER_ZONE) tickColor = 0xff8c00;
      else tickColor = 0x00d4ff;

      const lineMat = new THREE.LineBasicMaterial({
        color: tickColor,
        transparent: true,
        opacity: isMajor ? 0.9 : 0.4,
        linewidth: isMajor ? 2 : 1,
      });
      tickGroup.add(new THREE.Line(lineGeo, lineMat));

      // Number labels for major ticks
      if (isMajor) {
        const labelR = innerR - 0.35;
        const lx = Math.cos(angle) * labelR;
        const ly = Math.sin(angle) * labelR;

        // Use small plane with canvas texture for numbers
        const canvas = document.createElement('canvas');
        canvas.width = 64;
        canvas.height = 32;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = isRedline ? '#ff2d7b' : (speed >= DANGER_ZONE ? '#ff8c00' : '#00d4ff');
        ctx.font = 'bold 22px Courier New';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(speed.toString(), 32, 16);

        const texture = new THREE.CanvasTexture(canvas);
        texture.needsUpdate = true;
        const spriteMat = new THREE.SpriteMaterial({
          map: texture,
          transparent: true,
          opacity: 0.85,
        });
        const sprite = new THREE.Sprite(spriteMat);
        sprite.position.set(lx, ly, 0.12);
        sprite.scale.set(0.7, 0.35, 1);
        tickGroup.add(sprite);
      }
    }
    gaugeGroup.add(tickGroup);

    // ═══════════════════════════════════════════════════════════
    //  3. COLORED ARC — Dynamic gradient arc
    // ═══════════════════════════════════════════════════════════
    const arcGroup = new THREE.Group();
    const ARC_SEGMENTS = 120;

    const arcSegments = [];
    for (let i = 0; i < ARC_SEGMENTS; i++) {
      const fraction = i / ARC_SEGMENTS;
      const nextFraction = (i + 1) / ARC_SEGMENTS;
      const angle1 = GAUGE_START - fraction * GAUGE_ARC;
      const angle2 = GAUGE_START - nextFraction * GAUGE_ARC;
      const arcR = 3.75;

      const points = [
        new THREE.Vector3(Math.cos(angle1) * arcR, Math.sin(angle1) * arcR, 0.08),
        new THREE.Vector3(Math.cos(angle2) * arcR, Math.sin(angle2) * arcR, 0.08),
      ];

      const segGeo = new THREE.BufferGeometry().setFromPoints(points);

      // Color based on position
      const speedAtSeg = fraction * MAX_SPEED;
      let segColor;
      if (speedAtSeg >= REDLINE) segColor = 0xff2d7b;
      else if (speedAtSeg >= DANGER_ZONE) segColor = 0xff8c00;
      else segColor = 0x00d4ff;

      const segMat = new THREE.LineBasicMaterial({
        color: segColor,
        transparent: true,
        opacity: 0.15, // dim by default, will light up based on speed
      });

      const seg = new THREE.Line(segGeo, segMat);
      seg.userData = { index: i, baseOpacity: 0.15, speedAtSeg };
      arcSegments.push(seg);
      arcGroup.add(seg);
    }
    gaugeGroup.add(arcGroup);

    // Glowing arc overlay (wider, more diffuse)
    const glowArcGroup = new THREE.Group();
    const glowArcSegments = [];

    for (let i = 0; i < ARC_SEGMENTS; i++) {
      const fraction = i / ARC_SEGMENTS;
      const nextFraction = (i + 1) / ARC_SEGMENTS;
      const angle1 = GAUGE_START - fraction * GAUGE_ARC;
      const angle2 = GAUGE_START - nextFraction * GAUGE_ARC;
      const arcR = 3.75;

      const points = [
        new THREE.Vector3(Math.cos(angle1) * arcR, Math.sin(angle1) * arcR, 0.05),
        new THREE.Vector3(Math.cos(angle2) * arcR, Math.sin(angle2) * arcR, 0.05),
      ];

      const segGeo = new THREE.BufferGeometry().setFromPoints(points);

      const speedAtSeg = fraction * MAX_SPEED;
      let segColor;
      if (speedAtSeg >= REDLINE) segColor = 0xff2d7b;
      else if (speedAtSeg >= DANGER_ZONE) segColor = 0xff8c00;
      else segColor = 0x00d4ff;

      const segMat = new THREE.LineBasicMaterial({
        color: segColor,
        transparent: true,
        opacity: 0,
        linewidth: 3,
      });

      const seg = new THREE.Line(segGeo, segMat);
      seg.userData = { index: i, speedAtSeg };
      glowArcSegments.push(seg);
      glowArcGroup.add(seg);
    }
    gaugeGroup.add(glowArcGroup);

    // ═══════════════════════════════════════════════════════════
    //  4. NEEDLE — 3D Animated Pointer
    // ═══════════════════════════════════════════════════════════
    const needleGroup = new THREE.Group();

    // Needle body (elongated cone)
    const needleGeo = new THREE.ConeGeometry(0.08, 3.3, 4);
    const needleMat = new THREE.MeshPhysicalMaterial({
      color: 0xff2d7b,
      emissive: 0xff2d7b,
      emissiveIntensity: 0.6,
      roughness: 0.1,
      metalness: 0.9,
    });
    const needle = new THREE.Mesh(needleGeo, needleMat);
    needle.rotation.z = Math.PI; // point upward
    needle.position.y = 1.65; // offset to rotate from base
    needleGroup.add(needle);

    // Needle glow trail (wider, semi-transparent)
    const trailGeo = new THREE.ConeGeometry(0.15, 3.0, 4);
    const trailMat = new THREE.MeshBasicMaterial({
      color: 0xff2d7b,
      transparent: true,
      opacity: 0.15,
    });
    const trail = new THREE.Mesh(trailGeo, trailMat);
    trail.rotation.z = Math.PI;
    trail.position.y = 1.5;
    needleGroup.add(trail);

    // Center cap
    const capGeo = new THREE.SphereGeometry(0.25, 16, 16);
    const capMat = new THREE.MeshPhysicalMaterial({
      color: 0x1a1a3e,
      emissive: 0x00d4ff,
      emissiveIntensity: 0.5,
      roughness: 0.0,
      metalness: 1.0,
      clearcoat: 1.0,
    });
    const cap = new THREE.Mesh(capGeo, capMat);
    needleGroup.add(cap);

    // Cap inner glow
    const capGlowGeo = new THREE.SphereGeometry(0.15, 12, 12);
    const capGlowMat = new THREE.MeshBasicMaterial({
      color: 0x00d4ff,
      transparent: true,
      opacity: 0.5,
    });
    needleGroup.add(new THREE.Mesh(capGlowGeo, capGlowMat));

    needleGroup.position.z = 0.2;
    gaugeGroup.add(needleGroup);

    // ═══════════════════════════════════════════════════════════
    //  5. PARTICLE SYSTEMS
    // ═══════════════════════════════════════════════════════════

    // Orbiting energy particles around gauge
    const orbitParticles = [];
    const orbitGroup = new THREE.Group();

    for (let i = 0; i < 50; i++) {
      const size = 0.02 + Math.random() * 0.04;
      const geo = new THREE.SphereGeometry(size, 6, 6);
      const color = [0x00d4ff, 0x8b5cf6, 0xff2d7b, 0xffd700][Math.floor(Math.random() * 4)];
      const mat = new THREE.MeshBasicMaterial({
        color: color,
        transparent: true,
        opacity: 0.6 + Math.random() * 0.4,
      });
      const p = new THREE.Mesh(geo, mat);

      const radius = 4.5 + Math.random() * 1.5;
      const angle = Math.random() * Math.PI * 2;
      const yOffset = (Math.random() - 0.5) * 1.5;

      p.position.set(Math.cos(angle) * radius, yOffset, Math.sin(angle) * radius);
      p.userData = {
        speed: 0.005 + Math.random() * 0.015,
        angle: angle,
        radius: radius,
        baseY: yOffset,
      };

      orbitParticles.push(p);
      orbitGroup.add(p);
    }
    gaugeGroup.add(orbitGroup);

    // Speed-reactive burst particles (appear at high speed)
    const burstGroup = new THREE.Group();
    const burstParticles = [];
    const BURST_COUNT = 30;

    for (let i = 0; i < BURST_COUNT; i++) {
      const size = 0.03 + Math.random() * 0.05;
      const geo = new THREE.SphereGeometry(size, 6, 6);
      const mat = new THREE.MeshBasicMaterial({
        color: 0xff2d7b,
        transparent: true,
        opacity: 0,
      });
      const p = new THREE.Mesh(geo, mat);
      p.userData = {
        active: false,
        velocity: { x: 0, y: 0, z: 0 },
        life: 0,
        maxLife: 0,
      };
      burstParticles.push(p);
      burstGroup.add(p);
    }
    gaugeGroup.add(burstGroup);

    // ═══════════════════════════════════════════════════════════
    //  6. SHOCKWAVE RINGS (on high speed)
    // ═══════════════════════════════════════════════════════════
    const shockwaves = [];

    function createShockwave() {
      const geo = new THREE.RingGeometry(0.5, 0.55, 64);
      const mat = new THREE.MeshBasicMaterial({
        color: 0xff2d7b,
        transparent: true,
        opacity: 0.6,
        side: THREE.DoubleSide,
      });
      const ring = new THREE.Mesh(geo, mat);
      ring.userData = { age: 0, maxAge: 2000 };
      gaugeGroup.add(ring);
      shockwaves.push(ring);
    }

    // ═══════════════════════════════════════════════════════════
    //  7. BACKGROUND STARS
    // ═══════════════════════════════════════════════════════════
    const starsGroup = new THREE.Group();
    for (let i = 0; i < 300; i++) {
      const size = 0.01 + Math.random() * 0.025;
      const geo = new THREE.SphereGeometry(size, 4, 4);
      const mat = new THREE.MeshBasicMaterial({
        color: Math.random() > 0.85 ? 0x00d4ff : 0xffffff,
        transparent: true,
        opacity: 0.2 + Math.random() * 0.5,
      });
      const star = new THREE.Mesh(geo, mat);
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      const dist = 25 + Math.random() * 40;
      star.position.set(
        dist * Math.sin(phi) * Math.cos(theta),
        dist * Math.sin(phi) * Math.sin(theta),
        dist * Math.cos(phi)
      );
      starsGroup.add(star);
    }
    scene.add(starsGroup);

    // ═══════════════════════════════════════════════════════════
    //  8. DECORATIVE FLOATING RINGS
    // ═══════════════════════════════════════════════════════════
    const decoGroup = new THREE.Group();

    const decoRing1 = new THREE.Mesh(
      new THREE.TorusGeometry(5.5, 0.015, 8, 128),
      new THREE.MeshBasicMaterial({ color: 0x8b5cf6, transparent: true, opacity: 0.15 })
    );
    decoRing1.rotation.x = Math.PI * 0.3;
    decoRing1.rotation.y = Math.PI * 0.2;
    decoGroup.add(decoRing1);

    const decoRing2 = new THREE.Mesh(
      new THREE.TorusGeometry(6.0, 0.01, 8, 128),
      new THREE.MeshBasicMaterial({ color: 0x00d4ff, transparent: true, opacity: 0.1 })
    );
    decoRing2.rotation.x = Math.PI * 0.5;
    decoRing2.rotation.z = Math.PI * 0.15;
    decoGroup.add(decoRing2);

    scene.add(decoGroup);

    // ═══════════════════════════════════════════════════════════
    //  9. REDLINE WARNING FLASH OVERLAY
    // ═══════════════════════════════════════════════════════════
    const warningGeo = new THREE.RingGeometry(3.0, 4.2, 64, 1, 0, GAUGE_ARC);
    const warningMat = new THREE.MeshBasicMaterial({
      color: 0xff2d7b,
      transparent: true,
      opacity: 0,
      side: THREE.DoubleSide,
    });
    const warningOverlay = new THREE.Mesh(warningGeo, warningMat);
    warningOverlay.rotation.z = -(GAUGE_START - GAUGE_ARC) + Math.PI;
    warningOverlay.position.z = 0.05;
    gaugeGroup.add(warningOverlay);

    // ═══════════════════════════════════════════════════════════
    //  SPEED SIMULATION (demo mode)
    // ═══════════════════════════════════════════════════════════
    let simTime = 0;
    let simPhase = 0;

    function simulateSpeed(dt) {
      simTime += dt;

      // Create a realistic-ish speed pattern
      const phase1 = Math.sin(simTime * 0.0008) * 0.5 + 0.5; // slow acceleration
      const phase2 = Math.sin(simTime * 0.002) * 0.3;  // variation
      const phase3 = Math.sin(simTime * 0.0003) * 0.2; // long waves

      let raw = (phase1 + phase2 + phase3) * MAX_SPEED;
      targetSpeed = Math.max(0, Math.min(MAX_SPEED, raw));
    }

    // ═══════════════════════════════════════════════════════════
    //  BURST PARTICLE SYSTEM
    // ═══════════════════════════════════════════════════════════
    let lastBurstTime = 0;

    function triggerBurst() {
      const needleAngle = GAUGE_START - (currentSpeed / MAX_SPEED) * GAUGE_ARC;
      const needleTipX = Math.cos(needleAngle) * 3.2;
      const needleTipY = Math.sin(needleAngle) * 3.2;

      burstParticles.forEach(p => {
        if (!p.userData.active) {
          p.userData.active = true;
          p.userData.life = 0;
          p.userData.maxLife = 500 + Math.random() * 1000;
          p.position.set(needleTipX, needleTipY, 0.2);

          const spread = 0.02 + (currentSpeed / MAX_SPEED) * 0.06;
          p.userData.velocity = {
            x: (Math.random() - 0.5) * spread + Math.cos(needleAngle) * 0.03,
            y: (Math.random() - 0.5) * spread + Math.sin(needleAngle) * 0.03,
            z: Math.random() * 0.02,
          };
          p.material.opacity = 0.8;
          p.material.color.setHex(currentSpeed >= REDLINE ? 0xff2d7b : 0x00d4ff);
        }
      });
    }

    // ═══════════════════════════════════════════════════════════
    //  CONTROLS
    // ═══════════════════════════════════════════════════════════
    const btnSim = document.getElementById('btn-sim');
    const btnManual = document.getElementById('btn-manual');
    const slider = document.getElementById('speed-slider');

    btnSim.addEventListener('click', () => {
      mode = 'sim';
      btnSim.classList.add('active');
      btnManual.classList.remove('active');
      slider.style.display = 'none';
    });

    btnManual.addEventListener('click', () => {
      mode = 'manual';
      btnManual.classList.add('active');
      btnSim.classList.remove('active');
      slider.style.display = 'block';
    });

    slider.addEventListener('input', (e) => {
      targetSpeed = parseInt(e.target.value);
    });

    // ═══════════════════════════════════════════════════════════
    //  ANIMATION LOOP
    // ═══════════════════════════════════════════════════════════
    const clock = new THREE.Clock();
    let prevTime = Date.now();

    function animate() {
      requestAnimationFrame(animate);
      const now = Date.now();
      const dt = now - prevTime;
      prevTime = now;
      const t = now;
      const elapsed = clock.getElapsedTime();

      // ── Speed update ──
      if (mode === 'sim') {
        simulateSpeed(dt);
      }

      // Smooth needle movement with spring-like easing
      const speedDiff = targetSpeed - currentSpeed;
      currentSpeed += speedDiff * 0.04; // smooth interpolation
      currentSpeed = Math.max(0, Math.min(MAX_SPEED, currentSpeed));

      const speedFraction = currentSpeed / MAX_SPEED;

      // ── Needle rotation ──
      const needleAngle = GAUGE_START - speedFraction * GAUGE_ARC;
      needleGroup.rotation.z = needleAngle - Math.PI / 2;

      // Needle color shift based on speed
      if (currentSpeed >= REDLINE) {
        needleMat.color.setHex(0xff2d7b);
        needleMat.emissive.setHex(0xff2d7b);
        needleMat.emissiveIntensity = 0.8 + Math.sin(t * 0.01) * 0.3;
        trailMat.color.setHex(0xff2d7b);
        trailMat.opacity = 0.3 + Math.sin(t * 0.01) * 0.15;
        capGlowMat.color.setHex(0xff2d7b);
      } else if (currentSpeed >= DANGER_ZONE) {
        needleMat.color.setHex(0xff8c00);
        needleMat.emissive.setHex(0xff8c00);
        needleMat.emissiveIntensity = 0.6;
        trailMat.color.setHex(0xff8c00);
        trailMat.opacity = 0.2;
        capGlowMat.color.setHex(0xff8c00);
      } else {
        needleMat.color.setHex(0x00d4ff);
        needleMat.emissive.setHex(0x00d4ff);
        needleMat.emissiveIntensity = 0.4;
        trailMat.color.setHex(0x00d4ff);
        trailMat.opacity = 0.1;
        capGlowMat.color.setHex(0x00d4ff);
      }

      // Needle shake at high speed
      if (currentSpeed >= DANGER_ZONE) {
        const shakeAmount = (currentSpeed - DANGER_ZONE) / (MAX_SPEED - DANGER_ZONE) * 0.015;
        needleGroup.position.x = (Math.random() - 0.5) * shakeAmount;
        needleGroup.position.y = (Math.random() - 0.5) * shakeAmount;
      } else {
        needleGroup.position.x = 0;
        needleGroup.position.y = 0;
      }

      // ── Arc lighting ──
      const litFraction = speedFraction;
      arcSegments.forEach(seg => {
        const segFraction = seg.userData.index / ARC_SEGMENTS;
        if (segFraction <= litFraction) {
          // Lit up segments
          const proximity = 1 - Math.abs(segFraction - litFraction) * 5;
          seg.material.opacity = 0.7 + Math.max(0, proximity) * 0.3;
        } else {
          seg.material.opacity = 0.08;
        }
      });

      // Glow arc (only near needle tip)
      glowArcSegments.forEach(seg => {
        const segFraction = seg.userData.index / ARC_SEGMENTS;
        const dist = Math.abs(segFraction - litFraction);
        if (dist < 0.08 && segFraction <= litFraction) {
          seg.material.opacity = (1 - dist / 0.08) * 0.5;
        } else {
          seg.material.opacity = 0;
        }
      });

      // ── Core glow intensity based on speed ──
      coreGlow.intensity = 1.5 + speedFraction * 3;
      if (currentSpeed >= REDLINE) {
        coreGlow.color.setHex(0xff2d7b);
      } else if (currentSpeed >= DANGER_ZONE) {
        coreGlow.color.setHex(0xff8c00);
      } else {
        coreGlow.color.setHex(0x00d4ff);
      }

      // ── Danger light ──
      if (currentSpeed >= DANGER_ZONE) {
        const dangerIntensity = (currentSpeed - DANGER_ZONE) / (MAX_SPEED - DANGER_ZONE);
        dangerLight.intensity = dangerIntensity * 2;
        dangerLight.color.setHex(currentSpeed >= REDLINE ? 0xff2d7b : 0xff8c00);
      } else {
        dangerLight.intensity = 0;
      }

      // ── Warning overlay flash ──
      if (currentSpeed >= REDLINE) {
        warningMat.opacity = 0.05 + Math.sin(t * 0.008) * 0.05;
      } else if (currentSpeed >= DANGER_ZONE) {
        warningMat.opacity = 0.02;
        warningMat.color.setHex(0xff8c00);
      } else {
        warningMat.opacity = 0;
      }

      // ── Bezel color shift ──
      if (currentSpeed >= REDLINE) {
        bezelMat.emissive.setHex(0xff2d7b);
        bezelMat.emissiveIntensity = 0.4 + Math.sin(t * 0.008) * 0.2;
      } else {
        bezelMat.emissive.setHex(0x0a0a2e);
        bezelMat.emissiveIntensity = 0.3;
      }

      // ── Orbiting particles ──
      const particleSpeedMultiplier = 1 + speedFraction * 3;
      orbitParticles.forEach(p => {
        const d = p.userData;
        d.angle += d.speed * particleSpeedMultiplier;
        p.position.x = Math.cos(d.angle) * d.radius;
        p.position.z = Math.sin(d.angle) * d.radius;
        p.position.y = d.baseY + Math.sin(t * 0.002 + d.angle) * 0.3;

        // Speed-reactive opacity
        p.material.opacity = (0.3 + speedFraction * 0.7) * (0.5 + Math.sin(t * 0.005 + d.angle * 3) * 0.5);
      });

      // ── Burst particles at high speed ──
      if (currentSpeed >= DANGER_ZONE && t - lastBurstTime > 200) {
        triggerBurst();
        lastBurstTime = t;
      }

      burstParticles.forEach(p => {
        if (p.userData.active) {
          p.userData.life += dt;
          const progress = p.userData.life / p.userData.maxLife;

          if (progress >= 1) {
            p.userData.active = false;
            p.material.opacity = 0;
            return;
          }

          p.position.x += p.userData.velocity.x;
          p.position.y += p.userData.velocity.y;
          p.position.z += p.userData.velocity.z;
          p.material.opacity = 0.8 * (1 - progress);
          p.scale.setScalar(1 - progress * 0.5);
        }
      });

      // ── Shockwave at redline ──
      if (currentSpeed >= REDLINE && Math.random() < 0.02) {
        createShockwave();
      }

      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        sw.userData.age += dt;
        const progress = sw.userData.age / sw.userData.maxAge;

        if (progress >= 1) {
          gaugeGroup.remove(sw);
          sw.geometry.dispose();
          sw.material.dispose();
          shockwaves.splice(i, 1);
          continue;
        }

        const scale = 1 + progress * 3;
        sw.scale.set(scale, scale, scale);
        sw.material.opacity = 0.4 * (1 - progress);
      }

      // ── Decorative rings rotation ──
      decoRing1.rotation.z += 0.002 * particleSpeedMultiplier;
      decoRing2.rotation.z -= 0.0015 * particleSpeedMultiplier;

      // ── Disc subtle rotation for 3D feel ──
      gaugeGroup.rotation.y = Math.sin(elapsed * 0.3) * 0.05;

      // ── Camera breathing ──
      camera.position.y = 6 + Math.sin(elapsed * 0.4) * 0.15;

      // ── Stars ──
      starsGroup.rotation.y += 0.0001;

      // ── Digital speed display ──
      document.getElementById('speed-value').textContent = Math.round(currentSpeed);

      // Speed display color
      const speedEl = document.getElementById('speed-value');
      if (currentSpeed >= REDLINE) {
        speedEl.style.color = '#ff2d7b';
        speedEl.style.textShadow = '0 0 20px rgba(255,45,123,0.6), 0 0 40px rgba(255,45,123,0.3)';
      } else if (currentSpeed >= DANGER_ZONE) {
        speedEl.style.color = '#ff8c00';
        speedEl.style.textShadow = '0 0 20px rgba(255,140,0,0.6), 0 0 40px rgba(255,140,0,0.3)';
      } else {
        speedEl.style.color = '#00d4ff';
        speedEl.style.textShadow = '0 0 20px rgba(0,212,255,0.6), 0 0 40px rgba(0,212,255,0.3)';
      }

      // Update slider in sim mode
      if (mode === 'sim') {
        slider.value = Math.round(currentSpeed);
      }

      renderer.render(scene, camera);
    }

    animate();

    // ═══════════════════════════════════════════════════════════
    //  RESIZE
    // ═══════════════════════════════════════════════════════════
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ═══════════════════════════════════════════════════════════
    //  EXTERNAL API — setSpeed() for mobile app integration
    // ═══════════════════════════════════════════════════════════
    // Usage from React Native WebView:
    // webViewRef.current.injectJavaScript('setSpeed(120);')
    window.setSpeed = function(speed) {
      targetSpeed = Math.max(0, Math.min(MAX_SPEED, speed));
    };

    window.getMaxSpeed = function() {
      return MAX_SPEED;
    };
  </script>
</body>
</html>
