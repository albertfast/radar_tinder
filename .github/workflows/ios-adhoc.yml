name: Build iOS AdHoc

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build-ios:
    runs-on: macos-15
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List available Xcode versions
        run: ls -la /Applications/ | grep Xcode

      - name: Select Xcode 26.0.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0.1"

      - name: Install iOS platform (required for generic iOS device archive)
        run: |
            sudo xcodebuild -runFirstLaunch
            xcrun simctl list >/dev/null
            xcodebuild -downloadPlatform iOS

            xcodebuild -version
            xcodebuild -showsdks

      - name: Show Xcode and SDK version
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcrun --sdk iphoneos --show-sdk-path || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install EAS CLI and Login
        run: |
          npm install -g eas-cli
          eas whoami

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods -v 1.16.2
          pod --version

      - name: Install dependencies (fresh)
        run: |
          rm -f pnpm-lock.yaml
          pnpm install

      - name: Setup credentials from secrets
        env:
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          mkdir -p credentials/ios
          echo "$IOS_DIST_P12_BASE64" | base64 -D > credentials/ios/dist-cert.p12
          echo "$IOS_PROFILE_BASE64" | base64 -D > credentials/ios/profile.mobileprovision
          ls -la credentials/ios

      - name: Generate iOS native code
        run: |
          rm -rf ios
          npx expo prebuild --platform ios --clean         
          
          cd ios
          pod install --repo-update
          cd ..

      - name: Create credentials.json
        env:
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          cat > credentials.json <<EOF
          {
            "ios": {
              "provisioningProfilePath": "credentials/ios/profile.mobileprovision",
              "distributionCertificate": {
                "path": "credentials/ios/dist-cert.p12",
                "password": "$IOS_DIST_P12_PASSWORD"
              }
            }
          }
          EOF

      - name: Build IPA
        run: |
          eas build --platform ios --profile adhoc --local --non-interactive --output=./RadarTinder.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RadarTinder-adhoc
          path: ./RadarTinder.ipa
