name: Build iOS AdHoc

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build-ios:
    runs-on: macos-15
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      RCT_NEW_ARCH_ENABLED: "1"
      IPHONEOS_DEPLOYMENT_TARGET: "16.1"
      EAS_NO_VCS: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List available Xcode versions
        run: ls -la /Applications/ | grep Xcode

      - name: Select Xcode 26.0.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0.1"

      - name: Install iOS platform (required for generic iOS device archive)
        run: |
            sudo xcodebuild -runFirstLaunch
            xcrun simctl list >/dev/null
            xcodebuild -downloadPlatform iOS

            xcodebuild -version
            xcodebuild -showsdks

      - name: Show Xcode and SDK version
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcrun --sdk iphoneos --show-sdk-path || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install EAS CLI and Login
        run: |
          npm install -g eas-cli
          eas whoami

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods -v 1.16.2
          pod --version

      - name: Install dependencies (fresh)
        run: |
          rm -f pnpm-lock.yaml
          pnpm install

      - name: Apply dependency patches
        run: |
          node scripts/prepare-patches.js
          node - <<'NODE'
          const fs = require('fs');
          const checks = [
            ['node_modules/react-native-maps/ios/AirGoogleMaps/AIRGoogleMapMarkerManager.h', '#import "AIRMapCalloutManager.h"'],
            ['node_modules/react-native-maps/ios/AirGoogleMaps/AIRGMSMarker.h', '#import "AIRMap.h"'],
            ['node_modules/react-native-maps/ios/AirGoogleMaps/AIRGMSPolyline.h', '#import "AIRMap.h"'],
            ['node_modules/react-native-maps/ios/AirGoogleMaps/AIRGMSPolygon.h', '#import "AIRMap.h"'],
          ];
          for (const [filePath, expected] of checks) {
            if (!fs.existsSync(filePath)) continue;
            const content = fs.readFileSync(filePath, 'utf8');
            if (!content.includes(expected)) {
              throw new Error(`react-native-maps patch missing: ${filePath} does not include ${expected}`);
            }
          }

          const polylinePath = 'node_modules/react-native-maps/ios/AirGoogleMaps/AIRGoogleMapPolyline.m';
          if (fs.existsSync(polylinePath)) {
            const polylineContent = fs.readFileSync(polylinePath, 'utf8');
            if (polylineContent.includes('#import "AIRGoogleMapMarkerManager.h"')) {
              throw new Error('react-native-maps patch missing: AIRGoogleMapPolyline.m still imports AIRGoogleMapMarkerManager.h');
            }
          }
          console.log('react-native-maps patch verification passed');
          NODE

      - name: Ensure Expo gitignore
        run: |
          touch .gitignore
          if ! grep -qxF ".expo/" .gitignore; then
            echo ".expo/" >> .gitignore
          fi

      - name: Setup credentials from secrets
        env:
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          mkdir -p credentials/ios
          echo "$IOS_DIST_P12_BASE64" | base64 -D > credentials/ios/dist-cert.p12
          echo "$IOS_PROFILE_BASE64" | base64 -D > credentials/ios/profile.mobileprovision
          ls -la credentials/ios

      - name: Generate iOS native code
        run: |
          npx expo prebuild --platform ios --clean

          node - <<'NODE'
          const fs = require('fs');
          const path = 'ios/Podfile.properties.json';
          const data = fs.existsSync(path) ? JSON.parse(fs.readFileSync(path, 'utf8')) : {};
          data['ios.deploymentTarget'] = '16.1';
          data['ios.useFrameworks'] = 'static';
          data['newArchEnabled'] = 'true';
          fs.writeFileSync(path, JSON.stringify(data, null, 2));
          NODE

          node - <<'NODE'
          const fs = require('fs');
          const path = 'ios/Podfile';
          let podfile = fs.readFileSync(path, 'utf8');

          if (!podfile.includes('$RNFirebaseAsStaticFramework')) {
            podfile = [
              '# Firebase Static Framework - fixes Swift module issues',
              '$RNFirebaseAsStaticFramework = true',
              '',
              podfile,
            ].join('\n');
          }

          const markerBegin = '  # BEGIN CI_IOS_POD_WORKAROUNDS';
          const markerEnd = '  # END CI_IOS_POD_WORKAROUNDS';
          const workaround = [
            markerBegin,
            '  installer.pods_project.targets.each do |target|',
            '    target.build_configurations.each do |build_config|',
            "      build_config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'",
            "      build_config.build_settings['CLANG_ENABLE_EXPLICIT_MODULES'] = 'NO'",
            '    end',
            '',
            "    if ['react-native-google-maps', 'react-native-maps'].include?(target.name)",
            '      target.build_configurations.each do |build_config|',
            "        build_config.build_settings['CLANG_ENABLE_MODULES'] = 'YES'",
            "        build_config.build_settings['CLANG_ENABLE_EXPLICIT_MODULES'] = 'NO'",
            '      end',
            '    end',
            '',
            "    if ['Google-Maps-iOS-Utils', 'GoogleMapsUtils'].include?(target.name)",
            '      target.build_configurations.each do |build_config|',
            "        build_config.build_settings['CLANG_ENABLE_MODULES'] = 'YES'",
            "        build_config.build_settings['CLANG_ENABLE_EXPLICIT_MODULES'] = 'NO'",
            '      end',
            '    end',
            '',
            "    gmu_header = File.join(installer.sandbox.root.to_s, 'Google-Maps-iOS-Utils', 'Sources', 'GoogleMapsUtilsObjC', 'include', 'GMUWeightedLatLng.h')",
            '    if File.exist?(gmu_header)',
            '      gmu_content = File.read(gmu_header)',
            "      patched = gmu_content.gsub('@import GoogleMaps;', '#import <GoogleMaps/GoogleMaps.h>')",
            '      File.write(gmu_header, patched) if patched != gmu_content',
            '    end',
            '  end',
            markerEnd,
          ].join('\n');

          const escaped = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const blockRegex = new RegExp(`${escaped(markerBegin)}[\\s\\S]*?${escaped(markerEnd)}\\n?`, 'm');
          podfile = podfile.replace(blockRegex, '');

          if (/post_install do \|installer\|[\s\S]*?\n  end/m.test(podfile)) {
            podfile = podfile.replace(
              /(post_install do \|installer\|[\s\S]*?)\n  end/m,
              `$1\n\n${workaround}\n  end`
            );
          } else {
            podfile += `\npost_install do |installer|\n${workaround}\nend\n`;
          }

          fs.writeFileSync(path, podfile);
          console.log('Applied CI Podfile workarounds for RNFirebase/react-native-maps');
          NODE

          cd ios
          echo "export NODE_BINARY=$(command -v node)" > .xcode.env.local
          pod install --repo-update --verbose
          cd ..

      - name: Create credentials.json
        env:
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          cat > credentials.json <<EOF
          {
            "ios": {
              "provisioningProfilePath": "credentials/ios/profile.mobileprovision",
              "distributionCertificate": {
                "path": "credentials/ios/dist-cert.p12",
                "password": "$IOS_DIST_P12_PASSWORD"
              }
            }
          }
          EOF

      - name: Build IPA
        run: |
          eas build --platform ios --profile adhoc --local --non-interactive --output=./RadarTinder.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RadarTinder-adhoc
          path: ./RadarTinder.ipa
