name: Build Android Release (Play Store)

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_NO_VCS: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install EAS CLI and verify login
        run: |
          npm install -g eas-cli
          eas whoami

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Ensure Expo gitignore
        run: |
          touch .gitignore
          if ! grep -qxF ".expo/" .gitignore; then
            echo ".expo/" >> .gitignore
          fi

      - name: Setup Android signing (create credentials.json)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "Missing ANDROID_KEYSTORE_BASE64 secret"; missing=1; fi
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then echo "Missing ANDROID_KEYSTORE_PASSWORD secret"; missing=1; fi
          if [ -z "$ANDROID_KEY_ALIAS" ]; then echo "Missing ANDROID_KEY_ALIAS secret"; missing=1; fi
          if [ -z "$ANDROID_KEY_PASSWORD" ]; then echo "Missing ANDROID_KEY_PASSWORD secret"; missing=1; fi
          if [ "$missing" -ne 0 ]; then
            echo "Android signing secrets are required for local EAS build."
            exit 1
          fi

          mkdir -p credentials
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > credentials/release.keystore

          cat > credentials.json <<EOF
          {
            "android": {
              "keystore": {
                "keystorePath": "credentials/release.keystore",
                "keystorePassword": "$ANDROID_KEYSTORE_PASSWORD",
                "keyAlias": "$ANDROID_KEY_ALIAS",
                "keyPassword": "$ANDROID_KEY_PASSWORD"
              }
            }
          }
          EOF

      - name: Generate Android native code
        run: |
          rm -rf android
          npx expo prebuild --platform android --clean
          if [ -f android/gradle.properties ]; then
            cat >> android/gradle.properties <<'EOF'
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dkotlin.daemon.jvm.options=-Xmx2g
android.lint.abortOnError=false
android.lint.checkReleaseBuilds=false
EOF
          fi

      - name: Build AAB for Play Store
        run: |
          eas build --platform android --profile production --local --non-interactive --output ./RadarTinder.aab

      - name: Submit to Google Play
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_JSON_BASE64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_JSON_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICE_ACCOUNT_KEY_JSON_BASE64" | base64 -d > google-service-account.json
          eas submit -p android --profile production --non-interactive --path ./RadarTinder.aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: RadarTinder-playstore
          path: ./RadarTinder.aab
