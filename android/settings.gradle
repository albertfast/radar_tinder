pluginManagement {
  def projectRoot = settingsDir.getParentFile()
  def readDependencyVersion = { String name ->
    def pkgFile = new File(projectRoot, "package.json")
    if (!pkgFile.exists()) {
      return null
    }
    try {
      def pkg = new groovy.json.JsonSlurper().parseText(pkgFile.text)
      def version = pkg?.dependencies?.get(name) ?: pkg?.devDependencies?.get(name)
      if (!(version instanceof String)) {
        return null
      }
      return version.replaceAll(/^[^0-9]*/, "")
    } catch (Exception ignored) {
      return null
    }
  }

  def resolveNodeModuleDir = { String packagePath ->
    def direct = new File(projectRoot, "node_modules/${packagePath}")
    return direct.exists() ? direct.absolutePath : null
  }

  def resolvePnpmPackageDir = { String pnpmPrefix, String packagePath, String preferredVersion ->
    def pnpmRoot = new File(projectRoot, "node_modules/.pnpm")
    if (!pnpmRoot.exists()) {
      return null
    }
    def candidates = pnpmRoot.listFiles()?.findAll { it.name.startsWith(pnpmPrefix + "@") }
    if (!candidates || candidates.isEmpty()) {
      return null
    }
    def selected = null
    if (preferredVersion) {
      selected = candidates.find { it.name.startsWith("${pnpmPrefix}@${preferredVersion}") }
    }
    if (selected == null) {
      selected = candidates.sort { a, b -> a.name <=> b.name }.last()
    }
    def resolved = new File(selected, "node_modules/${packagePath}")
    return resolved.exists() ? resolved.absolutePath : null
  }

  def reactNativeVersion = readDependencyVersion("react-native")
  def rnGradlePluginDir = resolveNodeModuleDir("@react-native/gradle-plugin")
    ?: resolvePnpmPackageDir("@react-native+gradle-plugin", "@react-native/gradle-plugin", reactNativeVersion)
  def expoAutolinkingDir = resolveNodeModuleDir("expo-modules-autolinking")
    ?: resolvePnpmPackageDir("expo-modules-autolinking", "expo-modules-autolinking", null)

  def reactNativeGradlePlugin = rnGradlePluginDir
  if (reactNativeGradlePlugin == null) {
    throw new GradleException("Could not resolve @react-native/gradle-plugin via node_modules. Run pnpm install.")
  }
  includeBuild(reactNativeGradlePlugin)
  
  def expoPluginsPath = null
  if (expoAutolinkingDir != null) {
    def candidate = new File(expoAutolinkingDir, "android/expo-gradle-plugin")
    if (candidate.exists()) {
      expoPluginsPath = candidate.absolutePath
    }
  }
  if (expoPluginsPath == null) {
    throw new GradleException("Could not resolve expo-modules-autolinking via node_modules. Run pnpm install.")
  }
  includeBuild(expoPluginsPath)
}

plugins {
  id("com.facebook.react.settings")
  id("expo-autolinking-settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  if (System.getenv('EXPO_USE_COMMUNITY_AUTOLINKING') == '1') {
    ex.autolinkLibrariesFromCommand()
  } else {
    ex.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand)
  }
}
expoAutolinking.useExpoModules()

rootProject.name = 'Radar Tinder'

expoAutolinking.useExpoVersionCatalog()

include ':app'
includeBuild(expoAutolinking.reactNativeGradlePlugin)
