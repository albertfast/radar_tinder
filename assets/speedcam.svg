<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">

  <!-- radar waves -->
  <path
    d="M22 5c3 1.5 5 4 5 7"
    stroke="#00E5FF"
    stroke-width="2"
    stroke-linecap="round"
    fill="none"
  />
  <path
    d="M20 7c2 1 3.2 2.6 3.2 4.6"
    stroke="#00E5FF"
    stroke-width="2"
    stroke-linecap="round"
    fill="none"
  />

  <!-- camera body -->
  <rect
    x="6"
    y="12"
    width="16"
    height="10"
    rx="3"
    fill="#2C2C3A"
  />

  <!-- camera lens -->
  <circle
    cx="14"
    cy="17"
    r="3.5"
    fill="#FF5A7A"
  />

  <!-- lens highlight -->
  <circle
    cx="15"
    cy="16"
    r="1.4"
    fill="#FFD6DE"
    opacity="0.8"
  />

  <!-- tripod -->
  <rect x="11" y="22" width="2" height="4" rx="1" fill="#2C2C3A"/>
  <rect x="17" y="22" width="2" height="4" rx="1" fill="#2C2C3A"/>

</svg>
