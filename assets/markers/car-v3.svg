<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="greenRingGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feFlood flood-color="#00e676" flood-opacity="0.6" result="color" />
      <feComposite in="color" in2="blur" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- Pulsing animation via animate on ring opacity -->
    <radialGradient id="suvBodyGrad" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#e0e0e0" />
      <stop offset="100%" stop-color="#bdbdbd" />
    </radialGradient>
  </defs>
  <!-- Green glow ring (pulsing) -->
  <g filter="url(#greenRingGlow)">
    <circle cx="32" cy="32" r="29" fill="none" stroke="#00e676" stroke-width="2.5">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>
  <!-- Outer ring pulse -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="#00e676" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="29;32;29" dur="2s" repeatCount="indefinite" />
    <animate attributeName="stroke-opacity" values="0.3;0;0.3" dur="2s" repeatCount="indefinite" />
  </circle>
  <!-- SUV top-down body -->
  <path d="M32 10 C27 10 23 13 23 17 L23 22 L20 24 L20 40 L23 42 L23 47 C23 52 27 55 32 55 C37 55 41 52 41 47 L41 42 L44 40 L44 24 L41 22 L41 17 C41 13 37 10 32 10 Z"
        fill="url(#suvBodyGrad)" stroke="#00e676" stroke-width="1.2" />
  <!-- Windshield -->
  <path d="M25 17 L25 22 L39 22 L39 17 C39 14 36 12 32 12 C28 12 25 14 25 17 Z"
        fill="#1b5e20" stroke="#4caf50" stroke-width="0.5" opacity="0.8" />
  <!-- Rear window -->
  <path d="M25 42 L25 46 C25 49 28 51 32 51 C36 51 39 49 39 46 L39 42 Z"
        fill="#1b5e20" stroke="#4caf50" stroke-width="0.5" opacity="0.8" />
  <!-- Side windows -->
  <rect x="21" y="26" width="3" height="13" rx="1" fill="#1b5e20" stroke="#4caf50" stroke-width="0.4" opacity="0.6" />
  <rect x="40" y="26" width="3" height="13" rx="1" fill="#1b5e20" stroke="#4caf50" stroke-width="0.4" opacity="0.6" />
  <!-- Roof rack lines -->
  <line x1="26" y1="25" x2="38" y2="25" stroke="#9e9e9e" stroke-width="0.6" opacity="0.5" />
  <line x1="26" y1="39" x2="38" y2="39" stroke="#9e9e9e" stroke-width="0.6" opacity="0.5" />
  <!-- Headlights -->
  <ellipse cx="27" cy="12" rx="2" ry="1.2" fill="#00e676" opacity="0.8" />
  <ellipse cx="37" cy="12" rx="2" ry="1.2" fill="#00e676" opacity="0.8" />
  <!-- Tail lights -->
  <rect x="25" y="53" width="5" height="1.5" rx="0.5" fill="#ff1744" opacity="0.7" />
  <rect x="34" y="53" width="5" height="1.5" rx="0.5" fill="#ff1744" opacity="0.7" />
</svg>