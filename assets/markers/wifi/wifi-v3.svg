<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#00E5FF" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="28" fill="#006064" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="25" fill="#00838F" stroke="#26C6DA" stroke-width="1.5"/>
  <!-- White signal -->
  <circle cx="32" cy="44" r="3" fill="white"/>
  <path d="M24 38 Q28 32 32 38 Q36 32 40 38" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M18 32 Q25 22 32 32 Q39 22 46 32" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M12 26 Q22 14 32 26 Q42 14 52 26" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Signal strength bars -->
  <rect x="16" y="46" width="3" height="4" rx="0.5" fill="white" opacity="0.4"/>
  <rect x="21" y="44" width="3" height="6" rx="0.5" fill="white" opacity="0.5"/>
  <rect x="42" y="44" width="3" height="6" rx="0.5" fill="white" opacity="0.5"/>
  <rect x="47" y="46" width="3" height="4" rx="0.5" fill="white" opacity="0.4"/>
</svg>