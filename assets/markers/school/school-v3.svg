<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="orangeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#FF9100" flood-opacity="0.8" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="circGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF9100"/>
      <stop offset="100%" stop-color="#BF360C"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="28" fill="url(#circGrad)" filter="url(#orangeGlow)"/>
  <!-- White book icon -->
  <!-- Open book left page -->
  <path d="M10 18 Q10 16 12 16 L30 20 L30 48 Q30 48 28 48 L12 44 Q10 44 10 42 Z" fill="#FFFFFF"/>
  <!-- Open book right page -->
  <path d="M54 18 Q54 16 52 16 L34 20 L34 48 Q34 48 36 48 L52 44 Q54 44 54 42 Z" fill="#FFFFFF" opacity="0.9"/>
  <!-- Book spine -->
  <line x1="32" y1="20" x2="32" y2="48" stroke="#BF360C" stroke-width="1.5"/>
  <!-- Page lines left -->
  <line x1="14" y1="24" x2="27" y2="26" stroke="#BF360C" stroke-width="1" opacity="0.5"/>
  <line x1="14" y1="30" x2="27" y2="32" stroke="#BF360C" stroke-width="1" opacity="0.5"/>
  <line x1="14" y1="36" x2="27" y2="38" stroke="#BF360C" stroke-width="1" opacity="0.5"/>
  <!-- Apple on top -->
  <circle cx="32" cy="13" r="5" fill="#FF1744"/>
  <path d="M32 8 Q34 6 33 4" fill="none" stroke="#76FF03" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M33 7 Q36 8 34 10" fill="#76FF03"/>
</svg>