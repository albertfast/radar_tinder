<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#4CAF50" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="28" fill="#1B5E20" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="25" fill="#2E7D32" stroke="#66BB6A" stroke-width="1.5"/>
  <!-- White trail sign -->
  <rect x="14" y="20" width="36" height="24" rx="3" fill="white"/>
  <rect x="16" y="22" width="32" height="20" rx="2" fill="#2E7D32" opacity="0.3"/>
  <!-- Arrow pointing right -->
  <path d="M22 32 L38 32 M34 26 L40 32 L34 38" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Post -->
  <rect x="30" y="44" width="4" height="12" rx="1" fill="white"/>
</svg>