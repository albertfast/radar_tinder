<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#4CAF50" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="28" fill="#1B5E20" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="26" fill="#2E7D32"/>
  <!-- White walking person -->
  <circle cx="32" cy="14" r="4" fill="white"/>
  <line x1="32" y1="18" x2="32" y2="34" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="22" x2="24" y2="30" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="22" x2="40" y2="28" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="34" x2="24" y2="48" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="34" x2="40" y2="48" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Walking stick -->
  <line x1="40" y1="28" x2="44" y2="44" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
</svg>