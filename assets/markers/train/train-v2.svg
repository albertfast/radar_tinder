<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#4CAF50" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="28" fill="#2E7D32" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="26" fill="#388E3C"/>
  <!-- White train silhouette -->
  <rect x="22" y="18" width="20" height="24" rx="6" fill="white"/>
  <rect x="24" y="21" width="7" height="6" rx="1.5" fill="#388E3C"/>
  <rect x="33" y="21" width="7" height="6" rx="1.5" fill="#388E3C"/>
  <rect x="26" y="30" width="12" height="8" rx="1" fill="#E8F5E9"/>
  <rect x="20" y="42" width="24" height="3" rx="1" fill="white"/>
  <circle cx="26" cy="44" r="2" fill="white"/>
  <circle cx="38" cy="44" r="2" fill="white"/>
</svg>