<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#4CAF50" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="28" fill="#1B5E20" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="25" fill="#2E7D32" stroke="#66BB6A" stroke-width="1.5"/>
  <!-- White rail/track -->
  <line x1="18" y1="36" x2="46" y2="36" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="18" y1="42" x2="46" y2="42" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- Ties -->
  <line x1="22" y1="34" x2="22" y2="44" stroke="white" stroke-width="2"/>
  <line x1="28" y1="34" x2="28" y2="44" stroke="white" stroke-width="2"/>
  <line x1="34" y1="34" x2="34" y2="44" stroke="white" stroke-width="2"/>
  <line x1="40" y1="34" x2="40" y2="44" stroke="white" stroke-width="2"/>
  <!-- Train on track -->
  <rect x="22" y="20" width="20" height="14" rx="4" fill="white"/>
  <rect x="24" y="23" width="7" height="5" rx="1" fill="#2E7D32"/>
  <rect x="33" y="23" width="7" height="5" rx="1" fill="#2E7D32"/>
</svg>