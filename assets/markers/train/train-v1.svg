<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feFlood flood-color="#4CAF50" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <defs>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feFlood flood-color="#FFF9C4" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Train front view -->
  <rect x="14" y="16" width="36" height="32" rx="8" fill="#4CAF50" filter="url(#glow)"/>
  <rect x="16" y="20" width="32" height="10" rx="2" fill="#2E7D32" opacity="0.5"/>
  <rect x="18" y="22" width="12" height="8" rx="2" fill="#C8E6C9" opacity="0.9"/>
  <rect x="34" y="22" width="12" height="8" rx="2" fill="#C8E6C9" opacity="0.9"/>
  <rect x="26" y="34" width="12" height="10" rx="1" fill="#2E7D32" opacity="0.4"/>
  <rect x="28" y="36" width="8" height="6" rx="1" fill="#A5D6A7" opacity="0.7"/>
  <!-- Headlight -->
  <circle cx="24" cy="46" r="2" fill="#FFF9C4" filter="url(#glow2)"/>
  <circle cx="40" cy="46" r="2" fill="#FFF9C4" filter="url(#glow2)"/>
  <!-- Pantograph -->
  <line x1="32" y1="10" x2="32" y2="16" stroke="#81C784" stroke-width="2"/>
  <line x1="26" y1="10" x2="38" y2="10" stroke="#A5D6A7" stroke-width="2.5"/>
  <!-- Wheels/rail -->
  <rect x="16" y="48" width="32" height="3" rx="1" fill="#388E3C"/>
  <circle cx="22" cy="49" r="3" fill="#1B5E20"/>
  <circle cx="42" cy="49" r="3" fill="#1B5E20"/>
</svg>