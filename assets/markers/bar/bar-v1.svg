<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#BB66FF"/>
      <stop offset="100%" stop-color="#7722CC"/>
    </linearGradient>
    <linearGradient id="liquidGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9933FF"/>
      <stop offset="100%" stop-color="#6600BB"/>
    </linearGradient>
  </defs>
  <g filter="url(#glow)">
    <!-- Cocktail glass triangle -->
    <path d="M12 12 L52 12 L32 44 Z" fill="none" stroke="url(#glassGrad)" stroke-width="3" stroke-linejoin="round"/>
    <!-- Liquid in glass -->
    <path d="M20 20 L44 20 L32 44 Z" fill="url(#liquidGrad)" opacity="0.8"/>
    <!-- Glass stem -->
    <rect x="30" y="44" width="4" height="10" fill="url(#glassGrad)"/>
    <!-- Glass base -->
    <rect x="22" y="54" width="20" height="4" rx="2" fill="url(#glassGrad)"/>
    <!-- Olive/garnish -->
    <circle cx="36" cy="18" r="3" fill="#44DD44"/>
    <circle cx="36" cy="18" r="1.5" fill="#228822"/>
    <!-- Stick for olive -->
    <line x1="36" y1="18" x2="28" y2="12" stroke="#FFDD44" stroke-width="1.5"/>
  </g>
</svg>