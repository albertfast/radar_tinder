<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="circleGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#BB66FF"/>
      <stop offset="100%" stop-color="#7722CC"/>
    </radialGradient>
  </defs>
  <!-- Purple circle background -->
  <circle cx="32" cy="32" r="28" fill="url(#circleGrad)" filter="url(#glow)"/>
  <!-- White wine glass -->
  <g fill="#FFFFFF">
    <!-- Glass bowl -->
    <path d="M20 12 Q20 10 32 10 Q44 10 44 12 Q44 28 36 32 L36 38 L28 38 L28 32 Q20 28 20 12 Z"/>
    <!-- Wine level -->
    <path d="M22 18 Q22 26 29 30 L35 30 Q42 26 42 18 Z" fill="#7722CC" opacity="0.5"/>
    <!-- Stem -->
    <rect x="30" y="38" width="4" height="8" rx="1"/>
    <!-- Base -->
    <ellipse cx="32" cy="48" rx="10" ry="3"/>
  </g>
</svg>