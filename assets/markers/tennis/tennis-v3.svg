<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#00e676" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="colorBlur"/>
      <feMerge>
        <feMergeNode in="colorBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="badgeGrad" cx="40%" cy="30%">
      <stop offset="0%" stop-color="#66bb6a"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </radialGradient>
  </defs>
  <g filter="url(#glow)">
    <!-- Badge circle -->
    <circle cx="32" cy="32" r="28" fill="url(#badgeGrad)" stroke="#00e676" stroke-width="2"/>
    <circle cx="32" cy="32" r="25" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.3"/>
    <!-- Racket -->
    <ellipse cx="26" cy="24" rx="8" ry="11" fill="none" stroke="#ffffff" stroke-width="2" transform="rotate(-20,26,24)"/>
    <!-- Strings simplified -->
    <line x1="20" y1="18" x2="32" y2="18" stroke="#ffffff" stroke-width="0.8" opacity="0.5" transform="rotate(-20,26,24)"/>
    <line x1="19" y1="24" x2="33" y2="24" stroke="#ffffff" stroke-width="0.8" opacity="0.5" transform="rotate(-20,26,24)"/>
    <line x1="20" y1="30" x2="32" y2="30" stroke="#ffffff" stroke-width="0.8" opacity="0.5" transform="rotate(-20,26,24)"/>
    <!-- Handle -->
    <line x1="32" y1="33" x2="38" y2="46" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Ball -->
    <circle cx="42" cy="30" r="6" fill="#c6ff00" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Ball seam -->
    <path d="M38,27 Q42,30 38,33" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.8"/>
    <path d="M46,27 Q42,30 46,33" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.8"/>
  </g>
</svg>