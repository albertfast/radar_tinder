<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="brakeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#FF1744" flood-opacity="0.5" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background glow -->
  <rect x="12" y="6" width="40" height="52" rx="8" fill="#B71C1C" opacity="0.12" filter="url(#glow)"/>
  <!-- Car rear body -->
  <rect x="14" y="14" width="36" height="34" rx="8" fill="#37474F" stroke="#546E7A" stroke-width="1.5" filter="url(#glow)"/>
  <!-- Rear window -->
  <rect x="20" y="18" width="24" height="14" rx="4" fill="#263238" stroke="#546E7A" stroke-width="0.8"/>
  <!-- Window glare -->
  <rect x="22" y="20" width="8" height="4" rx="2" fill="#546E7A" opacity="0.3"/>
  <!-- License plate area -->
  <rect x="22" y="36" width="20" height="8" rx="2" fill="#ECEFF1" stroke="#B0BEC5" stroke-width="0.5"/>
  <line x1="24" y1="40" x2="40" y2="40" stroke="#B0BEC5" stroke-width="0.5" opacity="0.5"/>
  <!-- Left brake light -->
  <rect x="16" y="16" width="8" height="5" rx="2.5" fill="#FF1744" filter="url(#brakeGlow)"/>
  <!-- Right brake light -->
  <rect x="40" y="16" width="8" height="5" rx="2.5" fill="#FF1744" filter="url(#brakeGlow)"/>
  <!-- Brake light inner glow -->
  <rect x="17.5" y="17.5" width="3" height="2" rx="1" fill="#FF5252" opacity="0.6"/>
  <rect x="41.5" y="17.5" width="3" height="2" rx="1" fill="#FF5252" opacity="0.6"/>
  <!-- Bumper -->
  <rect x="14" y="44" width="36" height="4" rx="2" fill="#455A64"/>
  <!-- Tailpipe -->
  <rect x="38" y="48" width="5" height="3" rx="1.5" fill="#263238"/>
  <!-- Left wheel -->
  <rect x="12" y="24" width="6" height="14" rx="3" fill="#212121" stroke="#424242" stroke-width="0.5"/>
  <!-- Right wheel -->
  <rect x="46" y="24" width="6" height="14" rx="3" fill="#212121" stroke="#424242" stroke-width="0.5"/>
</svg>