<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="carGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Clock glow background -->
  <circle cx="32" cy="28" r="24" fill="#FF8F00" opacity="0.15" filter="url(#glow)"/>
  <!-- Clock face -->
  <circle cx="32" cy="28" r="22" fill="#FF8F00" stroke="#FFB74D" stroke-width="2" filter="url(#glow)"/>
  <!-- Clock inner -->
  <circle cx="32" cy="28" r="19" fill="#FFC107" stroke="none"/>
  <circle cx="32" cy="28" r="17" fill="#FFD54F" stroke="none" opacity="0.3"/>
  <!-- Hour markers -->
  <line x1="32" y1="11" x2="32" y2="14" stroke="#E65100" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="42" x2="32" y2="45" stroke="#E65100" stroke-width="2" stroke-linecap="round"/>
  <line x1="15" y1="28" x2="18" y2="28" stroke="#E65100" stroke-width="2" stroke-linecap="round"/>
  <line x1="46" y1="28" x2="49" y2="28" stroke="#E65100" stroke-width="2" stroke-linecap="round"/>
  <!-- Small markers -->
  <line x1="43.5" y1="16.5" x2="41.5" y2="18.5" stroke="#E65100" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="20.5" y1="16.5" x2="22.5" y2="18.5" stroke="#E65100" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="43.5" y1="39.5" x2="41.5" y2="37.5" stroke="#E65100" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="20.5" y1="39.5" x2="22.5" y2="37.5" stroke="#E65100" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Hour hand -->
  <line x1="32" y1="28" x2="32" y2="17" stroke="#BF360C" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="32" y1="28" x2="42" y2="22" stroke="#BF360C" stroke-width="2" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="32" cy="28" r="2.5" fill="#E65100"/>
  <!-- Car icon overlapping at bottom -->
  <g filter="url(#carGlow)">
    <rect x="22" y="46" width="20" height="11" rx="4" fill="#FF6D00" stroke="#FFAB40" stroke-width="1"/>
    <rect x="24" y="48" width="7" height="4" rx="1.5" fill="#FFE0B2" opacity="0.4"/>
    <rect x="33" y="48" width="7" height="4" rx="1.5" fill="#FFE0B2" opacity="0.4"/>
    <rect x="19" y="49" width="4" height="6" rx="2" fill="#BF360C"/>
    <rect x="41" y="49" width="4" height="6" rx="2" fill="#BF360C"/>
  </g>
</svg>