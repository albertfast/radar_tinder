<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#009688" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="28" fill="#004D40" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="26" fill="#00695C"/>
  <!-- White crescent and star -->
  <path d="M24 18 A12 12 0 1 1 40 18 A9 9 0 1 0 24 18 Z" fill="white"/>
  <polygon points="42,16 43,20 47,20 44,22 45,26 42,24 39,26 40,22 37,20 41,20" fill="white"/>
</svg>