<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#009688" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="28" fill="#004D40" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="25" fill="#00695C" stroke="#4DB6AC" stroke-width="1.5"/>
  <!-- White dome -->
  <path d="M18 40 Q18 16 32 16 Q46 16 46 40 Z" fill="white"/>
  <!-- Dome details -->
  <path d="M22 38 Q22 20 32 20 Q42 20 42 38" fill="none" stroke="#00695C" stroke-width="0.8" opacity="0.5"/>
  <path d="M26 38 Q26 24 32 24 Q38 24 38 38" fill="none" stroke="#00695C" stroke-width="0.6" opacity="0.3"/>
  <!-- Crescent on top -->
  <path d="M30 14 A2 2 0 1 1 34 14 A1.5 1.5 0 1 0 30 14 Z" fill="white"/>
  <line x1="32" y1="16" x2="32" y2="14" stroke="white" stroke-width="1"/>
  <!-- Base -->
  <rect x="16" y="40" width="32" height="4" rx="1" fill="white" opacity="0.8"/>
</svg>