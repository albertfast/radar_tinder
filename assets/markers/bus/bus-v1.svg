<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feFlood flood-color="#2196F3" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <defs>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feFlood flood-color="#FFF9C4" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Bus front view -->
  <rect x="12" y="18" width="40" height="30" rx="6" fill="#2196F3" filter="url(#glow)"/>
  <rect x="14" y="22" width="36" height="14" rx="2" fill="#1565C0" opacity="0.6"/>
  <rect x="16" y="24" width="12" height="10" rx="1" fill="#BBDEFB" opacity="0.9"/>
  <rect x="36" y="24" width="12" height="10" rx="1" fill="#BBDEFB" opacity="0.9"/>
  <rect x="14" y="40" width="36" height="6" rx="1" fill="#1565C0" opacity="0.4"/>
  <rect x="16" y="42" width="8" height="4" rx="2" fill="#64B5F6"/>
  <rect x="40" y="42" width="8" height="4" rx="2" fill="#64B5F6"/>
  <!-- Headlights -->
  <circle cx="20" cy="46" r="2.5" fill="#FFF9C4" filter="url(#glow2)"/>
  <circle cx="44" cy="46" r="2.5" fill="#FFF9C4" filter="url(#glow2)"/>
  <!-- Wheels -->
  <circle cx="20" cy="50" r="4" fill="#263238"/>
  <circle cx="44" cy="50" r="4" fill="#263238"/>
  <circle cx="20" cy="50" r="2" fill="#546E7A"/>
  <circle cx="44" cy="50" r="2" fill="#546E7A"/>
  <!-- Destination sign -->
  <rect x="20" y="18" width="24" height="5" rx="1" fill="#0D47A1"/>
  <rect x="22" y="19" width="20" height="3" rx="0.5" fill="#64FFDA" opacity="0.8"/>
</svg>