<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#2196F3" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Blue badge circle -->
  <circle cx="32" cy="32" r="28" fill="#0D47A1" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="25" fill="#1565C0" stroke="#42A5F5" stroke-width="1.5"/>
  <!-- Bus stop sign -->
  <rect x="28" y="10" width="8" height="6" rx="1" fill="#42A5F5"/>
  <rect x="30" y="6" width="4" height="6" rx="1" fill="#64B5F6"/>
  <circle cx="32" cy="12" r="2" fill="white"/>
  <!-- White bus -->
  <rect x="18" y="26" width="28" height="16" rx="4" fill="white"/>
  <rect x="20" y="29" width="9" height="6" rx="1" fill="#1565C0"/>
  <rect x="35" y="29" width="9" height="6" rx="1" fill="#1565C0"/>
  <rect x="22" y="38" width="20" height="2" fill="#BBDEFB"/>
  <circle cx="24" cy="44" r="2" fill="white"/>
  <circle cx="40" cy="44" r="2" fill="white"/>
</svg>