<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#2196F3" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="28" fill="#1565C0" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="26" fill="#1976D2"/>
  <!-- White bus silhouette -->
  <rect x="20" y="22" width="24" height="18" rx="4" fill="white"/>
  <rect x="22" y="25" width="8" height="7" rx="1" fill="#1976D2"/>
  <rect x="34" y="25" width="8" height="7" rx="1" fill="#1976D2"/>
  <rect x="22" y="34" width="20" height="4" rx="1" fill="#E3F2FD"/>
  <circle cx="25" cy="42" r="2.5" fill="white"/>
  <circle cx="39" cy="42" r="2.5" fill="white"/>
</svg>