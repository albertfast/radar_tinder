<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#00E5FF" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="28" fill="#004D40" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="25" fill="#00695C" stroke="#26C6DA" stroke-width="1.5"/>
  <!-- White control tower -->
  <rect x="28" y="14" width="8" height="6" rx="1" fill="white"/>
  <rect x="30" y="20" width="4" height="22" fill="white"/>
  <rect x="24" y="42" width="16" height="4" rx="1" fill="white"/>
  <!-- Tower windows -->
  <rect x="29" y="15" width="2" height="3" rx="0.5" fill="#00BCD4"/>
  <rect x="33" y="15" width="2" height="3" rx="0.5" fill="#00BCD4"/>
  <!-- Radar dish -->
  <line x1="32" y1="14" x2="32" y2="10" stroke="white" stroke-width="1.5"/>
  <ellipse cx="32" cy="10" rx="6" ry="2" fill="none" stroke="white" stroke-width="1.5"/>
</svg>