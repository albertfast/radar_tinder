<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feFlood flood-color="#00E5FF" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Airplane icon -->
  <g filter="url(#glow)" transform="translate(32,32) rotate(-45) translate(-32,-32)">
    <path d="M32 8 L34 8 L34 22 L48 30 L48 33 L34 28 L34 40 L40 46 L40 49 L32 45 L24 49 L24 46 L30 40 L30 28 L16 33 L16 30 L30 22 Z" fill="#00E5FF"/>
  </g>
</svg>