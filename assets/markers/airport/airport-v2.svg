<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#00E5FF" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="28" fill="#006064" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="26" fill="#00838F"/>
  <!-- White plane -->
  <g transform="translate(32,32) rotate(-45) translate(-32,-32)">
    <path d="M32 12 L34 12 L34 24 L44 30 L44 33 L34 28 L34 38 L39 43 L39 46 L32 42 L25 46 L25 43 L30 38 L30 28 L20 33 L20 30 L30 24 Z" fill="white"/>
  </g>
</svg>