<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feFlood flood-color="#FFD600" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Yellow taxi car -->
  <rect x="10" y="28" width="44" height="18" rx="5" fill="#FFD600" filter="url(#glow)"/>
  <path d="M16 28 L22 18 L42 18 L48 28 Z" fill="#FFC107"/>
  <rect x="24" y="20" width="16" height="8" rx="2" fill="#FFF9C4" opacity="0.7"/>
  <line x1="32" y1="20" x2="32" y2="28" stroke="#FFC107" stroke-width="1.5"/>
  <!-- Taxi sign -->
  <rect x="26" y="14" width="12" height="5" rx="1.5" fill="#FF6F00"/>
  <!-- Checker pattern -->
  <rect x="12" y="32" width="4" height="4" fill="#212121" opacity="0.3"/>
  <rect x="20" y="32" width="4" height="4" fill="#212121" opacity="0.3"/>
  <rect x="40" y="32" width="4" height="4" fill="#212121" opacity="0.3"/>
  <rect x="48" y="32" width="4" height="4" fill="#212121" opacity="0.3"/>
  <rect x="16" y="36" width="4" height="4" fill="#212121" opacity="0.3"/>
  <rect x="36" y="36" width="4" height="4" fill="#212121" opacity="0.3"/>
  <rect x="44" y="36" width="4" height="4" fill="#212121" opacity="0.3"/>
  <!-- Wheels -->
  <circle cx="20" cy="48" r="4" fill="#212121"/>
  <circle cx="44" cy="48" r="4" fill="#212121"/>
  <circle cx="20" cy="48" r="2" fill="#616161"/>
  <circle cx="44" cy="48" r="2" fill="#616161"/>
</svg>