<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#FFD600" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="28" fill="#F57F17" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="26" fill="#FF8F00"/>
  <!-- White taxi -->
  <rect x="16" y="30" width="32" height="12" rx="4" fill="white"/>
  <path d="M20 30 L24 22 L40 22 L44 30 Z" fill="white"/>
  <rect x="26" y="23" width="12" height="6" rx="1.5" fill="#FF8F00" opacity="0.6"/>
  <circle cx="22" cy="44" r="2.5" fill="white"/>
  <circle cx="42" cy="44" r="2.5" fill="white"/>
</svg>