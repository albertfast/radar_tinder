<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="amberGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feFlood flood-color="#FFAB00" flood-opacity="0.7" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="circGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD740"/>
      <stop offset="100%" stop-color="#FF6F00"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="28" fill="url(#circGrad)" filter="url(#amberGlow)"/>
  <!-- White open book -->
  <!-- Left page -->
  <path d="M8 18 Q8 16 10 16 L30 20 L30 48 Q30 48 28 48 L10 44 Q8 44 8 42 Z" fill="#FFFFFF"/>
  <!-- Right page -->
  <path d="M56 18 Q56 16 54 16 L34 20 L34 48 Q34 48 36 48 L54 44 Q56 44 56 42 Z" fill="#FFFFFF" opacity="0.9"/>
  <!-- Spine -->
  <line x1="32" y1="20" x2="32" y2="48" stroke="#E65100" stroke-width="1.5"/>
  <!-- Text lines left page -->
  <line x1="13" y1="26" x2="26" y2="28" stroke="#E65100" stroke-width="1" opacity="0.4"/>
  <line x1="13" y1="32" x2="26" y2="34" stroke="#E65100" stroke-width="1" opacity="0.4"/>
  <line x1="13" y1="38" x2="26" y2="40" stroke="#E65100" stroke-width="1" opacity="0.4"/>
  <!-- Text lines right page -->
  <line x1="38" y1="28" x2="51" y2="26" stroke="#E65100" stroke-width="1" opacity="0.4"/>
  <line x1="38" y1="34" x2="51" y2="32" stroke="#E65100" stroke-width="1" opacity="0.4"/>
  <line x1="38" y1="40" x2="51" y2="38" stroke="#E65100" stroke-width="1" opacity="0.4"/>
</svg>