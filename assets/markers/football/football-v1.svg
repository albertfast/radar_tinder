<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="ballGrad" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cccccc"/>
    </radialGradient>
  </defs>
  <g filter="url(#glow)">
    <!-- Soccer ball outer circle -->
    <circle cx="32" cy="32" r="22" fill="url(#ballGrad)" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Pentagon patterns on soccer ball -->
    <polygon points="32,14 26,20 28,27 36,27 38,20" fill="#111111" stroke="#222222" stroke-width="0.5"/>
    <polygon points="32,14 26,20 18,17 20,10 28,10" fill="#111111" stroke="#222222" stroke-width="0.5"/>
    <polygon points="32,14 38,20 46,17 44,10 36,10" fill="#111111" stroke="#222222" stroke-width="0.5"/>
    <polygon points="26,20 18,17 12,24 16,30 28,27" fill="#111111" stroke="#222222" stroke-width="0.5"/>
    <polygon points="38,20 46,17 52,24 48,30 36,27" fill="#111111" stroke="#222222" stroke-width="0.5"/>
    <polygon points="28,27 16,30 18,40 26,42 32,36" fill="#111111" stroke="#222222" stroke-width="0.5"/>
    <polygon points="36,27 48,30 46,40 38,42 32,36" fill="#111111" stroke="#222222" stroke-width="0.5"/>
    <polygon points="26,42 32,36 38,42 36,50 28,50" fill="#111111" stroke="#222222" stroke-width="0.5"/>
    <!-- Center pentagon -->
    <polygon points="32,28 29,31 30,35 34,35 35,31" fill="#111111" stroke="#222222" stroke-width="0.5"/>
  </g>
</svg>