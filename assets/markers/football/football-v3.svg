<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#00e676" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="colorBlur"/>
      <feMerge>
        <feMergeNode in="colorBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="badgeGrad" cx="40%" cy="30%">
      <stop offset="0%" stop-color="#66bb6a"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </radialGradient>
  </defs>
  <g filter="url(#glow)">
    <!-- Badge circle -->
    <circle cx="32" cy="32" r="28" fill="url(#badgeGrad)" stroke="#00e676" stroke-width="2"/>
    <circle cx="32" cy="32" r="25" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.3"/>
    <!-- Goal/net icon -->
    <!-- Goal frame -->
    <rect x="16" y="20" width="32" height="22" rx="2" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <!-- Net lines horizontal -->
    <line x1="16" y1="26" x2="48" y2="26" stroke="#ffffff" stroke-width="0.8" opacity="0.7"/>
    <line x1="16" y1="32" x2="48" y2="32" stroke="#ffffff" stroke-width="0.8" opacity="0.7"/>
    <line x1="16" y1="38" x2="48" y2="38" stroke="#ffffff" stroke-width="0.8" opacity="0.7"/>
    <!-- Net lines vertical -->
    <line x1="24" y1="20" x2="24" y2="42" stroke="#ffffff" stroke-width="0.8" opacity="0.7"/>
    <line x1="32" y1="20" x2="32" y2="42" stroke="#ffffff" stroke-width="0.8" opacity="0.7"/>
    <line x1="40" y1="20" x2="40" y2="42" stroke="#ffffff" stroke-width="0.8" opacity="0.7"/>
    <!-- Goal posts -->
    <line x1="16" y1="20" x2="16" y2="44" stroke="#ffffff" stroke-width="3"/>
    <line x1="48" y1="20" x2="48" y2="44" stroke="#ffffff" stroke-width="3"/>
    <line x1="14" y1="20" x2="50" y2="20" stroke="#ffffff" stroke-width="3"/>
  </g>
</svg>