<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Yellow-white flash glow -->
    <filter id="flashGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#ffffaa" flood-opacity="0.7" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="glow"/>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Radial gradient for flash center -->
    <radialGradient id="flashCenter" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ffffaa"/>
      <stop offset="100%" stop-color="#ffdd44"/>
    </radialGradient>
    <!-- Camera shadow -->
    <filter id="camShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Flash burst rays -->
  <g filter="url(#flashGlow)">
    <!-- Central bright burst -->
    <circle cx="32" cy="24" r="8" fill="url(#flashCenter)" opacity="0.95"/>

    <!-- Burst rays - 8 pointed star pattern -->
    <!-- Up -->
    <polygon points="30,24 32,6 34,24" fill="#ffff88" opacity="0.9"/>
    <!-- Down -->
    <polygon points="30,24 32,38 34,24" fill="#ffff88" opacity="0.7"/>
    <!-- Left -->
    <polygon points="32,22 12,24 32,26" fill="#ffff88" opacity="0.9"/>
    <!-- Right -->
    <polygon points="32,22 52,24 32,26" fill="#ffff88" opacity="0.9"/>
    <!-- Diagonal up-left -->
    <polygon points="31,23 16,10 33,25" fill="#ffee55" opacity="0.75"/>
    <!-- Diagonal up-right -->
    <polygon points="33,23 48,10 31,25" fill="#ffee55" opacity="0.75"/>
    <!-- Diagonal down-left -->
    <polygon points="31,25 18,38 33,23" fill="#ffee55" opacity="0.55"/>
    <!-- Diagonal down-right -->
    <polygon points="33,25 46,38 31,23" fill="#ffee55" opacity="0.55"/>

    <!-- Bright core -->
    <circle cx="32" cy="24" r="4" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Small camera at bottom -->
  <g filter="url(#camShadow)">
    <!-- Camera body -->
    <rect x="22" y="44" width="20" height="14" rx="3" fill="#e8e8f0"/>
    <!-- Camera top bump -->
    <rect x="28" y="41" width="8" height="4" rx="1.5" fill="#d0d0dd"/>
    <!-- Lens -->
    <circle cx="32" cy="51" r="4" fill="#333344"/>
    <circle cx="32" cy="51" r="2.5" fill="#555566"/>
    <!-- Lens highlight -->
    <circle cx="30.5" cy="49.5" r="1" fill="#ffffff" opacity="0.6"/>
  </g>
</svg>