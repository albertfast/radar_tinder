<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4488FF"/>
      <stop offset="100%" stop-color="#2255CC"/>
    </linearGradient>
  </defs>
  <!-- Blue badge circle -->
  <circle cx="32" cy="32" r="28" fill="url(#badgeGrad)" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="25" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.3"/>
  <!-- White safe/vault -->
  <g fill="#FFFFFF">
    <!-- Safe body -->
    <rect x="14" y="14" width="36" height="36" rx="3"/>
    <!-- Safe door frame -->
    <rect x="18" y="18" width="28" height="28" rx="2" fill="none" stroke="#2255CC" stroke-width="2" opacity="0.4"/>
    <!-- Vault dial -->
    <circle cx="32" cy="32" r="8" fill="none" stroke="#2255CC" stroke-width="2" opacity="0.5"/>
    <circle cx="32" cy="32" r="3" fill="#2255CC" opacity="0.4"/>
    <!-- Dial tick marks -->
    <line x1="32" y1="24" x2="32" y2="26" stroke="#2255CC" stroke-width="1.5" opacity="0.4"/>
    <line x1="32" y1="38" x2="32" y2="40" stroke="#2255CC" stroke-width="1.5" opacity="0.4"/>
    <line x1="24" y1="32" x2="26" y2="32" stroke="#2255CC" stroke-width="1.5" opacity="0.4"/>
    <line x1="38" y1="32" x2="40" y2="32" stroke="#2255CC" stroke-width="1.5" opacity="0.4"/>
    <!-- Handle -->
    <rect x="42" y="28" width="6" height="8" rx="2" fill="#FFFFFF"/>
  </g>
</svg>