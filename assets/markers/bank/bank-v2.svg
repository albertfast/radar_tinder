<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="circleGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4488FF"/>
      <stop offset="100%" stop-color="#2255CC"/>
    </radialGradient>
  </defs>
  <!-- Blue circle background -->
  <circle cx="32" cy="32" r="28" fill="url(#circleGrad)" filter="url(#glow)"/>
  <!-- White bank icon -->
  <g fill="#FFFFFF">
    <!-- Roof/pediment -->
    <path d="M12 24 L32 12 L52 24 Z"/>
    <!-- Building base -->
    <rect x="14" y="24" width="36" height="4" rx="1"/>
    <!-- Columns -->
    <rect x="18" y="28" width="4" height="16" rx="1"/>
    <rect x="28" y="28" width="4" height="16" rx="1"/>
    <rect x="38" y="28" width="4" height="16" rx="1"/>
    <rect x="48" y="28" width="4" height="16" rx="1"/>
    <!-- Base -->
    <rect x="12" y="44" width="40" height="4" rx="1"/>
    <!-- Door -->
    <rect x="28" y="34" width="8" height="10" rx="1" fill="#2255CC" opacity="0.4"/>
  </g>
</svg>