<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="redGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#FF1744" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="blueGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#2979FF" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="baseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Light bar base -->
  <rect x="10" y="28" width="44" height="14" rx="4" ry="4" fill="#37474F" stroke="#546E7A" stroke-width="1.5" filter="url(#baseGlow)"/>
  <!-- Base shine line -->
  <rect x="12" y="29.5" width="40" height="2" rx="1" fill="#546E7A" opacity="0.5"/>
  <!-- Red light (left) -->
  <rect x="13" y="31" width="16" height="8" rx="3" ry="3" fill="#FF1744" filter="url(#redGlow)"/>
  <!-- Red light highlight -->
  <rect x="15" y="32.5" width="6" height="3" rx="1.5" fill="#FF5252" opacity="0.7"/>
  <!-- Blue light (right) -->
  <rect x="35" y="31" width="16" height="8" rx="3" ry="3" fill="#2979FF" filter="url(#blueGlow)"/>
  <!-- Blue light highlight -->
  <rect x="37" y="32.5" width="6" height="3" rx="1.5" fill="#64B5F6" opacity="0.7"/>
  <!-- Red light rays -->
  <line x1="21" y1="22" x2="21" y2="28" stroke="#FF1744" stroke-width="1.5" opacity="0.5" filter="url(#redGlow)"/>
  <line x1="16" y1="24" x2="16" y2="28" stroke="#FF1744" stroke-width="1" opacity="0.35"/>
  <line x1="26" y1="24" x2="26" y2="28" stroke="#FF1744" stroke-width="1" opacity="0.35"/>
  <!-- Blue light rays -->
  <line x1="43" y1="22" x2="43" y2="28" stroke="#2979FF" stroke-width="1.5" opacity="0.5" filter="url(#blueGlow)"/>
  <line x1="38" y1="24" x2="38" y2="28" stroke="#2979FF" stroke-width="1" opacity="0.35"/>
  <line x1="48" y1="24" x2="48" y2="28" stroke="#2979FF" stroke-width="1" opacity="0.35"/>
  <!-- Mounting bracket -->
  <rect x="14" y="42" width="6" height="6" rx="1" fill="#455A64"/>
  <rect x="44" y="42" width="6" height="6" rx="1" fill="#455A64"/>
  <rect x="16" y="46" width="2" height="8" rx="1" fill="#546E7A"/>
  <rect x="46" y="46" width="2" height="8" rx="1" fill="#546E7A"/>
</svg>