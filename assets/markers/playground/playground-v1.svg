<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#ff4081" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="colorBlur"/>
      <feMerge>
        <feMergeNode in="colorBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <!-- Swing set frame - top bar -->
    <line x1="12" y1="16" x2="52" y2="16" stroke="#ff4081" stroke-width="3" stroke-linecap="round"/>
    <!-- Left A-frame leg outer -->
    <line x1="12" y1="16" x2="8" y2="52" stroke="#ff4081" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Left A-frame leg inner -->
    <line x1="12" y1="16" x2="18" y2="52" stroke="#ff4081" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Right A-frame leg outer -->
    <line x1="52" y1="16" x2="46" y2="52" stroke="#ff4081" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Right A-frame leg inner -->
    <line x1="52" y1="16" x2="56" y2="52" stroke="#ff4081" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Left swing chains -->
    <line x1="22" y1="16" x2="20" y2="36" stroke="#ffeb3b" stroke-width="1.8"/>
    <line x1="26" y1="16" x2="28" y2="36" stroke="#ffeb3b" stroke-width="1.8"/>
    <!-- Left swing seat -->
    <rect x="19" y="35" width="10" height="3" rx="1.5" fill="#ffeb3b"/>
    <!-- Right swing chains -->
    <line x1="38" y1="16" x2="36" y2="36" stroke="#ffeb3b" stroke-width="1.8"/>
    <line x1="42" y1="16" x2="44" y2="36" stroke="#ffeb3b" stroke-width="1.8"/>
    <!-- Right swing seat -->
    <rect x="35" y="35" width="10" height="3" rx="1.5" fill="#ffeb3b"/>
    <!-- Cross braces -->
    <line x1="10" y1="40" x2="16" y2="40" stroke="#ff4081" stroke-width="1.5" opacity="0.6"/>
    <line x1="48" y1="40" x2="54" y2="40" stroke="#ff4081" stroke-width="1.5" opacity="0.6"/>
  </g>
</svg>