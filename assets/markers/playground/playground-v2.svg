<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#ff4081" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="colorBlur"/>
      <feMerge>
        <feMergeNode in="colorBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="bgGrad" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#ec407a"/>
      <stop offset="100%" stop-color="#880e4f"/>
    </radialGradient>
  </defs>
  <g filter="url(#glow)">
    <circle cx="32" cy="32" r="26" fill="url(#bgGrad)"/>
    <circle cx="32" cy="32" r="24" fill="none" stroke="#ff4081" stroke-width="1" opacity="0.4"/>
    <!-- White seesaw -->
    <!-- Fulcrum/triangle -->
    <polygon points="32,42 26,52 38,52" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Seesaw beam -->
    <line x1="12" y1="36" x2="52" y2="48" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Left seat (higher) -->
    <circle cx="14" cy="36" r="3" fill="#ffffff" opacity="0.6"/>
    <!-- Right seat (lower) -->
    <circle cx="50" cy="48" r="3" fill="#ffffff" opacity="0.6"/>
  </g>
</svg>