<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#ff4081" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="colorBlur"/>
      <feMerge>
        <feMergeNode in="colorBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="badgeGrad" cx="40%" cy="30%">
      <stop offset="0%" stop-color="#f06292"/>
      <stop offset="100%" stop-color="#ad1457"/>
    </radialGradient>
  </defs>
  <g filter="url(#glow)">
    <!-- Badge circle -->
    <circle cx="32" cy="32" r="28" fill="url(#badgeGrad)" stroke="#ff4081" stroke-width="2"/>
    <circle cx="32" cy="32" r="25" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.3"/>
    <!-- Slide icon -->
    <!-- Slide platform -->
    <rect x="18" y="14" width="14" height="3" rx="1" fill="#ffffff"/>
    <!-- Ladder -->
    <line x1="20" y1="17" x2="20" y2="36" stroke="#ffffff" stroke-width="2"/>
    <line x1="28" y1="17" x2="28" y2="36" stroke="#ffffff" stroke-width="2"/>
    <!-- Ladder rungs -->
    <line x1="20" y1="22" x2="28" y2="22" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="20" y1="27" x2="28" y2="27" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="20" y1="32" x2="28" y2="32" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Slide surface -->
    <path d="M32,17 Q40,30 46,46" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Slide side rail -->
    <path d="M32,17 Q42,30 48,46" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <!-- Ground -->
    <line x1="14" y1="48" x2="50" y2="48" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
  </g>
</svg>