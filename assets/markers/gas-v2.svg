<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dropGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#4CAF50" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Glow background -->
  <circle cx="28" cy="30" r="20" fill="#1B5E20" opacity="0.15" filter="url(#glow)"/>
  <!-- Fuel droplet -->
  <path d="M28,8 Q28,8 42,30 Q42,44 28,48 Q14,44 14,30 Q14,8 28,8 Z"
        fill="#4CAF50" stroke="#81C784" stroke-width="1.5" filter="url(#dropGlow)"/>
  <!-- Droplet highlight -->
  <path d="M22,24 Q22,16 28,14 Q24,20 24,28 Z" fill="#81C784" opacity="0.4"/>
  <!-- Inner droplet shade -->
  <path d="M28,18 Q34,28 34,34 Q34,42 28,44 Q22,42 22,34 Q22,28 28,18 Z"
        fill="#388E3C" stroke="none" opacity="0.4"/>
  <!-- Nozzle icon inside droplet -->
  <path d="M24,30 L32,30 L34,26 L38,26 L38,29 L35,29 L33,33 L24,33"
        fill="none" stroke="#E8F5E9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <!-- Small nozzle detail -->
  <circle cx="38" cy="27.5" r="1" fill="#E8F5E9" opacity="0.7"/>
  <!-- Nozzle handle -->
  <path d="M24,30 L22,30 Q20,30 20,32 L20,33 Q20,35 22,35 L24,35"
        fill="none" stroke="#E8F5E9" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
</svg>