<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#00e5ff" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="colorBlur"/>
      <feMerge>
        <feMergeNode in="colorBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="badgeGrad" cx="40%" cy="30%">
      <stop offset="0%" stop-color="#26c6da"/>
      <stop offset="100%" stop-color="#00838f"/>
    </radialGradient>
  </defs>
  <g filter="url(#glow)">
    <!-- Badge circle -->
    <circle cx="32" cy="32" r="28" fill="url(#badgeGrad)" stroke="#00e5ff" stroke-width="2"/>
    <circle cx="32" cy="32" r="25" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.3"/>
    <!-- Pool/waves icon -->
    <!-- Pool edge top -->
    <rect x="14" y="18" width="36" height="3" rx="1.5" fill="#ffffff"/>
    <!-- Pool edge bottom -->
    <rect x="14" y="43" width="36" height="3" rx="1.5" fill="#ffffff"/>
    <!-- Lane line left -->
    <line x1="22" y1="21" x2="22" y2="43" stroke="#ffffff" stroke-width="1.2" opacity="0.4" stroke-dasharray="3,3"/>
    <!-- Lane line right -->
    <line x1="42" y1="21" x2="42" y2="43" stroke="#ffffff" stroke-width="1.2" opacity="0.4" stroke-dasharray="3,3"/>
    <!-- Lane line center -->
    <line x1="32" y1="21" x2="32" y2="43" stroke="#ffffff" stroke-width="1.2" opacity="0.4" stroke-dasharray="3,3"/>
    <!-- Waves -->
    <path d="M16,28 Q20,24 24,28 Q28,32 32,28 Q36,24 40,28 Q44,32 48,28" fill="none" stroke="#ffffff" stroke-width="2.2"/>
    <path d="M16,36 Q20,32 24,36 Q28,40 32,36 Q36,32 40,36 Q44,40 48,36" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  </g>
</svg>