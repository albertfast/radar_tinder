<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#33CCCC"/>
      <stop offset="100%" stop-color="#008888"/>
    </linearGradient>
  </defs>
  <!-- Teal badge circle -->
  <circle cx="32" cy="32" r="28" fill="url(#badgeGrad)" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="25" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.3"/>
  <!-- White key fob -->
  <g fill="#FFFFFF">
    <!-- Fob body -->
    <rect x="22" y="16" width="20" height="32" rx="6"/>
    <!-- Fob screen area -->
    <rect x="26" y="20" width="12" height="8" rx="2" fill="#008888" opacity="0.4"/>
    <!-- Fob buttons -->
    <circle cx="28" cy="34" r="2.5" fill="#008888" opacity="0.4"/>
    <circle cx="36" cy="34" r="2.5" fill="#008888" opacity="0.4"/>
    <circle cx="32" cy="40" r="2.5" fill="#008888" opacity="0.4"/>
    <!-- Key ring hole -->
    <circle cx="32" cy="12" r="3" fill="#008888"/>
  </g>
</svg>