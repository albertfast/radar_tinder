<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="circleGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#33CCCC"/>
      <stop offset="100%" stop-color="#008888"/>
    </radialGradient>
  </defs>
  <!-- Teal circle background -->
  <circle cx="32" cy="32" r="28" fill="url(#circleGrad)" filter="url(#glow)"/>
  <!-- White car -->
  <g fill="#FFFFFF">
    <!-- Car body -->
    <path d="M8 36 L8 44 Q8 48 12 48 L48 48 Q52 48 52 44 L52 36 Q52 32 46 32 L42 26 Q40 22 36 22 L24 22 Q20 22 18 26 L14 32 Q8 32 8 36 Z"/>
    <!-- Windows -->
    <path d="M22 24 L18 32 L28 32 L26 24 Z" fill="#008888" opacity="0.4"/>
    <path d="M38 24 L42 32 L32 32 L34 24 Z" fill="#008888" opacity="0.4"/>
  </g>
  <!-- Wheels -->
  <circle cx="18" cy="46" r="4.5" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="42" cy="46" r="4.5" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
  <!-- Key icon -->
  <g fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round">
    <circle cx="48" cy="16" r="4"/>
    <line x1="52" y1="16" x2="56" y2="16"/>
    <line x1="54" y1="16" x2="54" y2="19"/>
    <line x1="56" y1="16" x2="56" y2="19"/>
  </g>
</svg>