<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="carGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#33CCCC"/>
      <stop offset="100%" stop-color="#008888"/>
    </linearGradient>
  </defs>
  <g filter="url(#glow)">
    <!-- Car body -->
    <path d="M8 36 L8 44 Q8 48 12 48 L52 48 Q56 48 56 44 L56 36 Q56 32 48 32 L44 24 Q42 20 38 20 L26 20 Q22 20 20 24 L16 32 Q8 32 8 36 Z" fill="url(#carGrad)"/>
    <!-- Car roof line -->
    <path d="M22 24 L42 24" fill="none" stroke="#66EEEE" stroke-width="1.5" opacity="0.5"/>
    <!-- Windshield -->
    <path d="M22 24 L18 32 L28 32 L26 24 Z" fill="#1A5555" opacity="0.6"/>
    <!-- Rear window -->
    <path d="M42 24 L46 32 L36 32 L38 24 Z" fill="#1A5555" opacity="0.6"/>
    <!-- Wheels -->
    <circle cx="20" cy="48" r="6" fill="#333333"/>
    <circle cx="20" cy="48" r="3" fill="#555555"/>
    <circle cx="44" cy="48" r="6" fill="#333333"/>
    <circle cx="44" cy="48" r="3" fill="#555555"/>
    <!-- Key icon above car -->
    <g fill="#33CCCC">
      <!-- Key head -->
      <circle cx="32" cy="10" r="5" fill="none" stroke="#33CCCC" stroke-width="2.5"/>
      <!-- Key shaft -->
      <rect x="32" y="12" width="2.5" height="8" fill="#33CCCC"/>
      <!-- Key teeth -->
      <rect x="34" y="17" width="3" height="2" rx="0.5" fill="#33CCCC"/>
      <rect x="34" y="14" width="2" height="2" rx="0.5" fill="#33CCCC"/>
    </g>
  </g>
</svg>