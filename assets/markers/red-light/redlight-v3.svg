<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Red glow ring filter -->
    <filter id="redRingGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur"/>
      <feFlood flood-color="#ff2222" flood-opacity="0.55" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer glow ring -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="#ff2222" stroke-width="1" opacity="0.15" filter="url(#redRingGlow)"/>

  <!-- Badge - red filled circle -->
  <g filter="url(#shadow)">
    <circle cx="32" cy="32" r="26" fill="#dd1111"/>
    <!-- Subtle gradient overlay -->
    <circle cx="32" cy="30" r="24" fill="#ff3333" opacity="0.3"/>
  </g>

  <!-- Bright red border ring with glow -->
  <g filter="url(#redRingGlow)">
    <circle cx="32" cy="32" r="26" fill="none" stroke="#ff4444" stroke-width="3"/>
  </g>

  <!-- White traffic light silhouette inside -->
  <g>
    <!-- Housing outline -->
    <rect x="25" y="12" width="14" height="38" rx="4" fill="#ffffff"/>
    <!-- Inner dark area -->
    <rect x="27" y="14" width="10" height="34" rx="3" fill="#dd1111"/>

    <!-- Red light circle (bright white to stand out) -->
    <circle cx="32" cy="21" r="4" fill="#ffffff"/>
    <circle cx="32" cy="21" r="2.5" fill="#ffcccc"/>

    <!-- Yellow light -->
    <circle cx="32" cy="31" r="3.5" fill="#ffffff" opacity="0.6"/>
    <circle cx="32" cy="31" r="2.2" fill="#ffdddd" opacity="0.5"/>

    <!-- Green light -->
    <circle cx="32" cy="41" r="3.5" fill="#ffffff" opacity="0.4"/>
    <circle cx="32" cy="41" r="2.2" fill="#ffeeee" opacity="0.3"/>
  </g>
</svg>