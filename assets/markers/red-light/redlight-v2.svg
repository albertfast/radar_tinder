<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Bright red glow filter for compact light -->
    <filter id="redGlowBright" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feFlood flood-color="#ff1111" flood-opacity="0.7" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="glow"/>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <!-- Housing gradient -->
    <linearGradient id="housingGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#444458"/>
      <stop offset="100%" stop-color="#28283a"/>
    </linearGradient>
  </defs>

  <!-- Compact horizontal traffic light housing -->
  <g filter="url(#shadow)">
    <!-- Housing body - wider, shorter, rounded -->
    <rect x="8" y="22" width="48" height="24" rx="6" fill="url(#housingGrad)" stroke="#555568" stroke-width="1"/>
    <!-- Inner panel -->
    <rect x="10" y="24" width="44" height="20" rx="5" fill="#1a1a28"/>
  </g>

  <!-- Red light - PROMINENT with intense glow -->
  <g filter="url(#redGlowBright)">
    <!-- Outer glow halo -->
    <circle cx="20" cy="34" r="12" fill="#ff1111" opacity="0.1"/>
    <!-- Main red light -->
    <circle cx="20" cy="34" r="7" fill="#ff2222"/>
    <!-- Bright center -->
    <circle cx="20" cy="34" r="4" fill="#ff4444"/>
    <!-- Specular highlight -->
    <circle cx="18" cy="32" r="2" fill="#ff8888" opacity="0.7"/>
  </g>

  <!-- Yellow light - DIM -->
  <circle cx="32" cy="34" r="5" fill="#2a2a20" stroke="#3a3a30" stroke-width="0.5"/>
  <circle cx="32" cy="34" r="3" fill="#333328" opacity="0.4"/>

  <!-- Green light - DIM -->
  <circle cx="44" cy="34" r="5" fill="#1a2a1a" stroke="#2a3a2a" stroke-width="0.5"/>
  <circle cx="44" cy="34" r="3" fill="#1e2e1e" opacity="0.4"/>

  <!-- Pole/support -->
  <rect x="29" y="44" width="6" height="16" rx="1" fill="#3a3a4e"/>
  <rect x="24" y="57" width="16" height="4" rx="2" fill="#2a2a3a"/>
</svg>