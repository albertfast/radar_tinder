<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Red glow filter -->
    <filter id="redGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#ff2222" flood-opacity="0.65" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <!-- Housing gradient -->
    <linearGradient id="housingGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a3a4e"/>
      <stop offset="100%" stop-color="#22222e"/>
    </linearGradient>
  </defs>

  <!-- Pole -->
  <g filter="url(#shadow)">
    <rect x="29" y="48" width="6" height="14" rx="1" fill="#3a3a4e"/>
    <!-- Base plate -->
    <rect x="22" y="58" width="20" height="4" rx="2" fill="#2a2a3a"/>
  </g>

  <!-- Traffic light housing -->
  <g filter="url(#shadow)">
    <rect x="20" y="6" width="24" height="44" rx="5" fill="url(#housingGrad)" stroke="#4a4a5e" stroke-width="1"/>
    <!-- Inner panel -->
    <rect x="22" y="8" width="20" height="40" rx="4" fill="#1a1a28"/>
  </g>

  <!-- Red light - ACTIVE and GLOWING -->
  <g filter="url(#redGlow)">
    <circle cx="32" cy="16" r="6" fill="#ff2222"/>
    <!-- Red light highlight -->
    <circle cx="30" cy="14" r="2" fill="#ff6666" opacity="0.6"/>
    <circle cx="32" cy="16" r="8" fill="#ff2222" opacity="0.15"/>
  </g>

  <!-- Yellow light - DIM -->
  <circle cx="32" cy="28" r="6" fill="#2a2a20" stroke="#3a3a30" stroke-width="0.5"/>
  <circle cx="32" cy="28" r="4" fill="#333328" opacity="0.5"/>

  <!-- Green light - DIM -->
  <circle cx="32" cy="40" r="6" fill="#1a2a1a" stroke="#2a3a2a" stroke-width="0.5"/>
  <circle cx="32" cy="40" r="4" fill="#1e2e1e" opacity="0.5"/>
</svg>