<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="circleGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FF4444"/>
      <stop offset="100%" stop-color="#AA0000"/>
    </radialGradient>
  </defs>
  <!-- Red circle background -->
  <circle cx="32" cy="32" r="28" fill="url(#circleGrad)" filter="url(#glow)"/>
  <!-- White plate -->
  <ellipse cx="32" cy="34" rx="16" ry="12" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
  <ellipse cx="32" cy="34" rx="10" ry="7" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
  <!-- Fork (left of plate) -->
  <g fill="#FFFFFF">
    <rect x="12" y="18" width="2.5" height="16" rx="1.2"/>
    <rect x="9" y="10" width="2" height="12" rx="1"/>
    <rect x="14.5" y="10" width="2" height="12" rx="1"/>
    <rect x="10" y="20" width="7" height="3" rx="1"/>
  </g>
  <!-- Knife (right of plate) -->
  <g fill="#FFFFFF">
    <path d="M50 10 Q54 10 54 26 L51 26 L51 10 Z"/>
    <rect x="50.5" y="26" width="2.5" height="10" rx="1.2"/>
  </g>
</svg>