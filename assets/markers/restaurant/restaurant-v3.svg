<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF3333"/>
      <stop offset="100%" stop-color="#BB0000"/>
    </linearGradient>
  </defs>
  <!-- Red badge circle -->
  <circle cx="32" cy="32" r="28" fill="url(#badgeGrad)" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="25" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.3"/>
  <!-- White chef hat -->
  <g fill="#FFFFFF">
    <!-- Hat base/band -->
    <rect x="20" y="38" width="24" height="6" rx="2"/>
    <!-- Hat puffy top -->
    <path d="M22 38 Q22 18 32 16 Q42 18 42 38 Z" fill="#FFFFFF"/>
    <!-- Puffy details -->
    <circle cx="27" cy="24" r="5" fill="#FFFFFF"/>
    <circle cx="37" cy="24" r="5" fill="#FFFFFF"/>
    <circle cx="32" cy="20" r="5" fill="#FFFFFF"/>
  </g>
</svg>