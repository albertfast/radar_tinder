<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#E91E63" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="28" fill="#880E4F" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="26" fill="#AD1457"/>
  <!-- White microphone -->
  <rect x="30" y="12" width="4" height="2" rx="1" fill="white"/>
  <rect x="29" y="14" width="6" height="16" rx="3" fill="white"/>
  <line x1="32" y1="30" x2="32" y2="46" stroke="white" stroke-width="2.5"/>
  <line x1="26" y1="46" x2="38" y2="46" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Mic grille lines -->
  <line x1="29" y1="20" x2="35" y2="20" stroke="#AD1457" stroke-width="0.8"/>
  <line x1="29" y1="23" x2="35" y2="23" stroke="#AD1457" stroke-width="0.8"/>
  <line x1="29" y1="26" x2="35" y2="26" stroke="#AD1457" stroke-width="0.8"/>
</svg>