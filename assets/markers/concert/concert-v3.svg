<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#E91E63" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="28" fill="#880E4F" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="25" fill="#AD1457" stroke="#F06292" stroke-width="1.5"/>
  <!-- White guitar -->
  <ellipse cx="28" cy="38" rx="10" ry="12" fill="white"/>
  <ellipse cx="28" cy="34" rx="6" ry="7" fill="#AD1457" opacity="0.4"/>
  <circle cx="28" cy="34" r="2.5" fill="#AD1457"/>
  <rect x="26" y="12" width="4" height="24" rx="1" fill="white"/>
  <rect x="24" y="10" width="8" height="4" rx="1" fill="white"/>
  <!-- Strings -->
  <line x1="27" y1="14" x2="27" y2="44" stroke="#AD1457" stroke-width="0.5"/>
  <line x1="29" y1="14" x2="29" y2="44" stroke="#AD1457" stroke-width="0.5"/>
  <!-- Tuning pegs -->
  <rect x="22" y="12" width="2" height="2" rx="0.5" fill="white"/>
  <rect x="22" y="16" width="2" height="2" rx="0.5" fill="white"/>
  <rect x="32" y="12" width="2" height="2" rx="0.5" fill="white"/>
  <rect x="32" y="16" width="2" height="2" rx="0.5" fill="white"/>
</svg>