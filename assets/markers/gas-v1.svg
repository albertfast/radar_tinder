<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background glow -->
  <rect x="14" y="4" width="36" height="56" rx="4" fill="#1B5E20" opacity="0.15" filter="url(#glow)"/>
  <!-- Pump body -->
  <rect x="16" y="10" width="26" height="42" rx="3" fill="#4CAF50" stroke="#81C784" stroke-width="1.5" filter="url(#glow)"/>
  <!-- Pump display -->
  <rect x="20" y="14" width="18" height="12" rx="2" fill="#1B5E20" stroke="#66BB6A" stroke-width="0.8"/>
  <!-- Display digits -->
  <text x="29" y="24" font-family="monospace" font-size="8" fill="#69F0AE" text-anchor="middle" font-weight="bold">8.9</text>
  <!-- Pump base -->
  <rect x="18" y="48" width="22" height="4" rx="1" fill="#388E3C"/>
  <!-- Nozzle holder -->
  <rect x="44" y="14" width="4" height="16" rx="2" fill="#2E7D32" stroke="#66BB6A" stroke-width="0.8"/>
  <!-- Nozzle -->
  <path d="M44,18 L48,18 L50,14 L54,14 L54,17 L51,17 L49,21 L44,21"
        fill="none" stroke="#81C784" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Nozzle tip -->
  <circle cx="54" cy="15.5" r="1.5" fill="#A5D6A7"/>
  <!-- Hose -->
  <path d="M44,28 Q50,28 50,34 Q50,40 46,42"
        fill="none" stroke="#66BB6A" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Price label area -->
  <rect x="20" y="30" width="18" height="6" rx="1" fill="#2E7D32"/>
  <text x="29" y="35" font-family="monospace" font-size="5" fill="#A5D6A7" text-anchor="middle">$/GAL</text>
</svg>