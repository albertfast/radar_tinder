<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="greenGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feFlood flood-color="#00ff88" flood-opacity="0.6" result="color" />
      <feComposite in="color" in2="blur" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Pole -->
  <rect x="14" y="8" width="3" height="50" rx="1.5" fill="#e0e0e0" filter="url(#shadow)" />
  <rect x="14" y="8" width="3" height="50" rx="1.5" fill="url(#poleGrad)" />
  <defs>
    <linearGradient id="poleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c0c0c0" />
      <stop offset="40%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a0a0a0" />
    </linearGradient>
  </defs>
  <!-- Flag base shape -->
  <g filter="url(#greenGlow)">
    <path d="M17 10 L17 34 L47 28 L47 10 Z" fill="#00e676" />
  </g>
  <!-- Checkered pattern on flag -->
  <g opacity="0.85">
    <!-- Row 1 -->
    <rect x="17" y="10" width="6" height="6" fill="#ffffff" />
    <rect x="23" y="10" width="6" height="6" fill="#00e676" />
    <rect x="29" y="10" width="6" height="6" fill="#ffffff" />
    <rect x="35" y="10" width="6" height="6" fill="#00e676" />
    <rect x="41" y="10" width="6" height="6" fill="#ffffff" />
    <!-- Row 2 -->
    <rect x="17" y="16" width="6" height="6" fill="#00e676" />
    <rect x="23" y="16" width="6" height="6" fill="#ffffff" />
    <rect x="29" y="16" width="6" height="6" fill="#00e676" />
    <rect x="35" y="16" width="6" height="6" fill="#ffffff" />
    <rect x="41" y="16" width="6" height="6" fill="#00e676" />
    <!-- Row 3 -->
    <rect x="17" y="22" width="6" height="6" fill="#ffffff" />
    <rect x="23" y="22" width="6" height="6" fill="#00e676" />
    <rect x="29" y="22" width="6" height="6" fill="#ffffff" />
    <rect x="35" y="22" width="6" height="6" fill="#00e676" />
    <rect x="41" y="22" width="6" height="6" fill="#ffffff" />
    <!-- Row 4 (partial) -->
    <rect x="17" y="28" width="6" height="6" fill="#00e676" />
    <rect x="23" y="28" width="6" height="6" fill="#ffffff" />
    <rect x="29" y="28" width="6" height="6" fill="#00e676" />
    <rect x="35" y="28" width="6" height="6" fill="#ffffff" />
  </g>
  <!-- Pole base cap -->
  <circle cx="15.5" cy="58" r="3" fill="#c0c0c0" stroke="#a0a0a0" stroke-width="0.5" />
</svg>