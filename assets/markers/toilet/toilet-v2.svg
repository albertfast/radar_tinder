<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#009688" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="28" fill="#004D40" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="26" fill="#00695C"/>
  <!-- White WC symbols -->
  <!-- Male figure -->
  <circle cx="22" cy="18" r="3" fill="white"/>
  <rect x="20" y="22" width="4" height="10" rx="1" fill="white"/>
  <line x1="18" y1="26" x2="26" y2="26" stroke="white" stroke-width="2"/>
  <line x1="20" y1="32" x2="17" y2="40" stroke="white" stroke-width="2"/>
  <line x1="24" y1="32" x2="27" y2="40" stroke="white" stroke-width="2"/>
  <!-- Female figure -->
  <circle cx="42" cy="18" r="3" fill="white"/>
  <rect x="40" y="22" width="4" height="6" rx="1" fill="white"/>
  <path d="M38 28 L40 38 L42 38 L44 38 L46 28 Z" fill="white"/>
  <line x1="40" y1="38" x2="38" y2="44" stroke="white" stroke-width="2"/>
  <line x1="44" y1="38" x2="46" y2="44" stroke="white" stroke-width="2"/>
  <!-- Divider -->
  <line x1="32" y1="14" x2="32" y2="46" stroke="white" stroke-width="1.5" opacity="0.4"/>
</svg>