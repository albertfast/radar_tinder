  <path d="M36 26 L36 32 L34 38 L36 38 L38 38 L40 38 L42 32 L42 26 M36 38 L34 44 L36 44 L38 44 L40 44 L42 38" stroke="white" stroke-width="1.8" fill="none" stroke-linecap="round"/>
