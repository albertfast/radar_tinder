<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Orange glow filter -->
    <filter id="orangeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feFlood flood-color="#ff8800" flood-opacity="0.5" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Wave glow -->
    <filter id="waveGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <!-- Dish gradient -->
    <linearGradient id="dishGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffaa33"/>
      <stop offset="100%" stop-color="#ff7700"/>
    </linearGradient>
    <linearGradient id="dishInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffcc66"/>
      <stop offset="100%" stop-color="#ff9922"/>
    </linearGradient>
  </defs>

  <!-- Pole -->
  <g filter="url(#shadow)">
    <rect x="30" y="40" width="4" height="18" rx="1" fill="#4a4a5e"/>
    <!-- Base -->
    <ellipse cx="32" cy="57" rx="8" ry="3" fill="#3a3a4e"/>
  </g>

  <!-- Radar dish -->
  <g filter="url(#orangeGlow)">
    <!-- Dish back (parabolic shape) -->
    <path d="M12,18 Q32,6 52,18 L48,22 Q32,12 16,22 Z" fill="url(#dishGrad)"/>
    <!-- Dish inner surface -->
    <path d="M16,20 Q32,10 48,20 L46,23 Q32,14 18,23 Z" fill="url(#dishInner)"/>
    <!-- Dish rim highlight -->
    <path d="M12,18 Q32,6 52,18" fill="none" stroke="#ffdd88" stroke-width="1.5" opacity="0.7"/>
  </g>

  <!-- Dish feed arm -->
  <line x1="32" y1="16" x2="32" y2="28" stroke="#cc6600" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Feed point -->
  <circle cx="32" cy="28" r="2.5" fill="#ffaa33" stroke="#cc7700" stroke-width="1"/>

  <!-- Emitted wave arcs -->
  <g filter="url(#waveGlow)">
    <path d="M18,8 Q14,2 10,8" fill="none" stroke="#ff9933" stroke-width="1.5" opacity="0.8"/>
    <path d="M14,4 Q8,-4 2,4" fill="none" stroke="#ff9933" stroke-width="1.5" opacity="0.55"/>
    <path d="M10,0 Q2,-8 -4,0" fill="none" stroke="#ff9933" stroke-width="1.5" opacity="0.3"/>
  </g>

  <!-- Small signal dots -->
  <circle cx="8" cy="4" r="1" fill="#ffbb55" opacity="0.6"/>
  <circle cx="3" cy="-1" r="1" fill="#ffbb55" opacity="0.35"/>
</svg>