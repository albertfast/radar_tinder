<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#ff1744" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="colorBlur"/>
      <feMerge>
        <feMergeNode in="colorBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="bgGrad" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#7f0000"/>
    </radialGradient>
  </defs>
  <g filter="url(#glow)">
    <circle cx="32" cy="32" r="26" fill="url(#bgGrad)"/>
    <circle cx="32" cy="32" r="24" fill="none" stroke="#ff1744" stroke-width="1" opacity="0.4"/>
    <!-- White dumbbell -->
    <!-- Left weight -->
    <rect x="12" y="26" width="8" height="12" rx="2" fill="#ffffff"/>
    <rect x="18" y="28" width="4" height="8" rx="1" fill="#ffffff" opacity="0.7"/>
    <!-- Right weight -->
    <rect x="44" y="26" width="8" height="12" rx="2" fill="#ffffff"/>
    <rect x="42" y="28" width="4" height="8" rx="1" fill="#ffffff" opacity="0.7"/>
    <!-- Bar -->
    <rect x="14" y="30" width="36" height="4" rx="2" fill="#ffffff"/>
  </g>
</svg>