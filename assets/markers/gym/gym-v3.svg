<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#ff1744" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="colorBlur"/>
      <feMerge>
        <feMergeNode in="colorBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="badgeGrad" cx="40%" cy="30%">
      <stop offset="0%" stop-color="#ef5350"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </radialGradient>
  </defs>
  <g filter="url(#glow)">
    <!-- Badge circle -->
    <circle cx="32" cy="32" r="28" fill="url(#badgeGrad)" stroke="#ff1744" stroke-width="2"/>
    <circle cx="32" cy="32" r="25" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.3"/>
    <!-- Flexed arm / muscle icon -->
    <!-- Shoulder -->
    <circle cx="24" cy="28" r="6" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <!-- Upper arm -->
    <path d="M30,28 Q36,24 38,30" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Bicep bulge -->
    <path d="M32,30 Q34,22 38,26" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Forearm -->
    <path d="M38,30 L44,40" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Fist -->
    <circle cx="45" cy="41" r="3" fill="none" stroke="#ffffff" stroke-width="2"/>
    <!-- Wrist line -->
    <line x1="42" y1="38" x2="48" y2="38" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>