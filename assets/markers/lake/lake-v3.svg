<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#448aff" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="colorBlur"/>
      <feMerge>
        <feMergeNode in="colorBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="badgeGrad" cx="40%" cy="30%">
      <stop offset="0%" stop-color="#42a5f5"/>
      <stop offset="100%" stop-color="#0d47a1"/>
    </radialGradient>
  </defs>
  <g filter="url(#glow)">
    <!-- Badge circle -->
    <circle cx="32" cy="32" r="28" fill="url(#badgeGrad)" stroke="#448aff" stroke-width="2"/>
    <circle cx="32" cy="32" r="25" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.3"/>
    <!-- Fish icon -->
    <!-- Fish body -->
    <ellipse cx="28" cy="30" rx="12" ry="7" fill="none" stroke="#ffffff" stroke-width="2.2"/>
    <!-- Fish tail -->
    <polygon points="40,30 48,22 48,38" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
    <!-- Fish eye -->
    <circle cx="22" cy="28" r="2" fill="#ffffff"/>
    <!-- Fish fin -->
    <path d="M28,23 Q30,18 32,23" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Scales hint -->
    <path d="M26,30 Q28,28 30,30" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
    <path d="M30,30 Q32,28 34,30" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
    <!-- Wave below fish -->
    <path d="M12,42 Q18,38 24,42 Q30,46 36,42 Q42,38 48,42 Q54,46 56,42" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
  </g>
</svg>