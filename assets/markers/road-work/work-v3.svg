<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feFlood flood-color="#FFD700" flood-opacity="0.7" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="colorBlur"/>
      <feMerge>
        <feMergeNode in="colorBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Diamond shape -->
  <g filter="url(#glow)">
    <polygon points="32,4 60,32 32,60 4,32" fill="#FFD700" stroke="#FFA500" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="32,9 55,32 32,55 9,32" fill="#1a1a1a" stroke="none"/>
  </g>
  <!-- Worker silhouette inside diamond -->
  <g fill="#FFD700">
    <!-- Head -->
    <circle cx="28" cy="22" r="4"/>
    <!-- Hard hat -->
    <path d="M23,21 Q23,17 28,16 Q33,17 33,21 Z" fill="#FF8C00"/>
    <rect x="22" y="20" width="12" height="2" rx="0.5" fill="#FF8C00"/>
    <!-- Body -->
    <rect x="26" y="27" width="5" height="12" rx="1"/>
    <!-- Arms -->
    <rect x="21" y="28" width="5" height="2.5" rx="1" transform="rotate(-15, 23.5, 29)"/>
    <rect x="31" y="28" width="5" height="2.5" rx="1" transform="rotate(25, 33.5, 29)"/>
    <!-- Legs -->
    <rect x="26" y="39" width="2.5" height="10" rx="1" transform="rotate(-8, 27, 44)"/>
    <rect x="29" y="39" width="2.5" height="10" rx="1" transform="rotate(8, 30, 44)"/>
  </g>
  <!-- Shovel in hand -->
  <g stroke="#FFD700" fill="none" stroke-linecap="round">
    <line x1="35" y1="29" x2="44" y2="42" stroke-width="2"/>
    <path d="M42,40 Q46,44 44,48 Q42,50 40,46" stroke-width="1.5" fill="#FFD700"/>
  </g>
</svg>