<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feFlood flood-color="#FFD700" flood-opacity="0.7" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="colorBlur"/>
      <feMerge>
        <feMergeNode in="colorBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="detailGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feFlood flood-color="#111111" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="colorBlur"/>
      <feMerge>
        <feMergeNode in="colorBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <!-- Tracks/treads -->
    <rect x="4" y="40" width="30" height="14" rx="7" fill="#444444" stroke="#666666" stroke-width="1"/>
    <rect x="6" y="42" width="26" height="10" rx="5" fill="#333333" stroke="#555555" stroke-width="0.5"/>
    <!-- Track tread lines -->
    <g stroke="#555555" stroke-width="0.8" opacity="0.6">
      <line x1="10" y1="42" x2="10" y2="52"/>
      <line x1="14" y1="42" x2="14" y2="52"/>
      <line x1="18" y1="42" x2="18" y2="52"/>
      <line x1="22" y1="42" x2="22" y2="52"/>
      <line x1="26" y1="42" x2="26" y2="52"/>
      <line x1="28" y1="42" x2="28" y2="52"/>
    </g>
    <!-- Cab/body -->
    <rect x="10" y="24" width="24" height="18" rx="2" fill="#FFD700" stroke="#FFA500" stroke-width="1"/>
    <!-- Cab window -->
    <rect x="12" y="26" width="10" height="8" rx="1.5" fill="#1a3a5c" stroke="#FFA500" stroke-width="0.5"/>
    <!-- Window shine -->
    <rect x="13" y="27" width="3" height="6" rx="0.5" fill="#2a5a8c" opacity="0.5"/>
    <!-- Engine compartment -->
    <rect x="10" y="36" width="24" height="6" rx="1" fill="#E6B800" stroke="#CC9900" stroke-width="0.5"/>
    <!-- Exhaust pipe -->
    <rect x="30" y="18" width="3" height="14" rx="1" fill="#888888" stroke="#AAAAAA" stroke-width="0.5"/>
    <ellipse cx="31.5" cy="17" rx="2.5" ry="1.5" fill="#999999"/>
  </g>
  <!-- Boom/arm -->
  <g filter="url(#glow)">
    <!-- Boom base pivot -->
    <circle cx="34" cy="30" r="3" fill="#E6B800" stroke="#FFA500" stroke-width="1"/>
    <!-- Boom arm segment 1 -->
    <rect x="32" y="14" width="5" height="20" rx="1.5" fill="#FFD700" stroke="#FFA500" stroke-width="0.8" transform="rotate(-30, 34, 30)"/>
    <!-- Boom arm segment 2 -->
    <line x1="26" y1="14" x2="48" y2="8" stroke="#FFD700" stroke-width="4" stroke-linecap="round"/>
    <!-- Hydraulic cylinders -->
    <line x1="28" y1="22" x2="22" y2="12" stroke="#999999" stroke-width="2" stroke-linecap="round"/>
    <line x1="22" y1="12" x2="20" y2="8" stroke="#AAAAAA" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Bucket -->
    <path d="M46,6 L52,6 L54,14 L48,16 L44,12 Z" fill="#E6B800" stroke="#FFA500" stroke-width="1" stroke-linejoin="round"/>
    <!-- Bucket teeth -->
    <g fill="#CCCCCC">
      <rect x="47" y="14" width="1.5" height="3" rx="0.3"/>
      <rect x="49.5" y="14" width="1.5" height="3" rx="0.3"/>
      <rect x="52" y="12" width="1.5" height="3" rx="0.3"/>
    </g>
  </g>
</svg>