<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feFlood flood-color="#FF8C00" flood-opacity="0.7" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="colorBlur"/>
      <feMerge>
        <feMergeNode in="colorBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="innerGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feFlood flood-color="#FFD700" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="colorBlur"/>
      <feMerge>
        <feMergeNode in="colorBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Traffic cone (left side, tilted) -->
  <g filter="url(#glow)" transform="translate(8,8) rotate(-25, 20, 28)">
    <!-- Cone base -->
    <ellipse cx="20" cy="50" rx="14" ry="3.5" fill="#CC5500"/>
    <!-- Cone body -->
    <polygon points="10,50 30,50 26,18 14,18" fill="#FF7700" stroke="#FF9933" stroke-width="0.5"/>
    <!-- White stripes -->
    <polygon points="12,44 28,44 27.5,39 12.5,39" fill="#FFFFFF" opacity="0.85"/>
    <polygon points="14.5,33 25.5,33 25,28 15,28" fill="#FFFFFF" opacity="0.85"/>
    <!-- Top -->
    <circle cx="20" cy="17" r="2" fill="#FF9933"/>
  </g>
  <!-- Wrench (crossed over cone, right side) -->
  <g filter="url(#glow)" transform="translate(4,0) rotate(30, 38, 32)">
    <!-- Wrench handle -->
    <rect x="36" y="12" width="4" height="36" rx="2" fill="#FFB300" stroke="#FFD54F" stroke-width="0.5"/>
    <!-- Wrench head (open end) -->
    <path d="M34,10 L34,6 Q38,2 42,6 L42,10 L40,10 L40,7 Q38,5 36,7 L36,10 Z" fill="#FFB300" stroke="#FFD54F" stroke-width="0.5"/>
    <!-- Wrench head (box end) -->
    <rect x="35" y="46" width="6" height="8" rx="1" fill="#FFB300" stroke="#FFD54F" stroke-width="0.5"/>
    <circle cx="38" cy="50" r="2" fill="#1a1a1a"/>
  </g>
  <!-- Accent highlight at crossing point -->
  <g filter="url(#innerGlow)">
    <circle cx="30" cy="30" r="4" fill="#FFD700" opacity="0.3"/>
  </g>
</svg>