<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#00e676" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="colorBlur"/>
      <feMerge>
        <feMergeNode in="colorBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="bgGrad" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </radialGradient>
  </defs>
  <g filter="url(#glow)">
    <circle cx="32" cy="32" r="26" fill="url(#bgGrad)"/>
    <circle cx="32" cy="32" r="24" fill="none" stroke="#00e676" stroke-width="1" opacity="0.4"/>
    <!-- White tree -->
    <!-- Trunk -->
    <rect x="30" y="34" width="4" height="16" rx="1" fill="#ffffff"/>
    <!-- Foliage layers -->
    <polygon points="32,10 20,24 44,24" fill="#ffffff"/>
    <polygon points="32,16 22,30 42,30" fill="#ffffff" opacity="0.85"/>
    <polygon points="32,22 24,34 40,34" fill="#ffffff" opacity="0.7"/>
  </g>
</svg>