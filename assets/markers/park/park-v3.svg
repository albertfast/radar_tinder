<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#00e676" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="colorBlur"/>
      <feMerge>
        <feMergeNode in="colorBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="badgeGrad" cx="40%" cy="30%">
      <stop offset="0%" stop-color="#66bb6a"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </radialGradient>
  </defs>
  <g filter="url(#glow)">
    <!-- Badge circle -->
    <circle cx="32" cy="32" r="28" fill="url(#badgeGrad)" stroke="#00e676" stroke-width="2"/>
    <circle cx="32" cy="32" r="25" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.3"/>
    <!-- Leaf icon -->
    <path d="M20,44 Q18,28 32,16 Q46,28 44,44" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Leaf center vein -->
    <line x1="32" y1="16" x2="32" y2="44" stroke="#ffffff" stroke-width="1.8"/>
    <!-- Leaf side veins -->
    <line x1="32" y1="22" x2="24" y2="28" stroke="#ffffff" stroke-width="1.2" opacity="0.7"/>
    <line x1="32" y1="22" x2="40" y2="28" stroke="#ffffff" stroke-width="1.2" opacity="0.7"/>
    <line x1="32" y1="30" x2="22" y2="36" stroke="#ffffff" stroke-width="1.2" opacity="0.7"/>
    <line x1="32" y1="30" x2="42" y2="36" stroke="#ffffff" stroke-width="1.2" opacity="0.7"/>
    <line x1="32" y1="37" x2="25" y2="42" stroke="#ffffff" stroke-width="1.2" opacity="0.7"/>
    <line x1="32" y1="37" x2="39" y2="42" stroke="#ffffff" stroke-width="1.2" opacity="0.7"/>
    <!-- Stem -->
    <line x1="32" y1="44" x2="32" y2="50" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>