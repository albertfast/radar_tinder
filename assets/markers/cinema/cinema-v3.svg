<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#F44336" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="28" fill="#B71C1C" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="25" fill="#C62828" stroke="#EF5350" stroke-width="1.5"/>
  <!-- White film reel -->
  <circle cx="32" cy="32" r="14" fill="none" stroke="white" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="4" fill="white"/>
  <!-- Sprocket holes -->
  <circle cx="32" cy="20" r="3" fill="white"/>
  <circle cx="32" cy="44" r="3" fill="white"/>
  <circle cx="20" cy="32" r="3" fill="white"/>
  <circle cx="44" cy="32" r="3" fill="white"/>
  <circle cx="23.5" cy="23.5" r="2.5" fill="#C62828"/>
  <circle cx="40.5" cy="23.5" r="2.5" fill="#C62828"/>
  <circle cx="23.5" cy="40.5" r="2.5" fill="#C62828"/>
  <circle cx="40.5" cy="40.5" r="2.5" fill="#C62828"/>
  <!-- Film strip -->
  <rect x="46" y="30" width="10" height="4" fill="white"/>
  <rect x="48" y="28" width="2" height="2" fill="#C62828"/>
  <rect x="52" y="28" width="2" height="2" fill="#C62828"/>
  <rect x="48" y="34" width="2" height="2" fill="#C62828"/>
  <rect x="52" y="34" width="2" height="2" fill="#C62828"/>
</svg>