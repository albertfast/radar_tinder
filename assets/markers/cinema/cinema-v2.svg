<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#F44336" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="28" fill="#B71C1C" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="26" fill="#C62828"/>
  <!-- White popcorn -->
  <path d="M20 44 Q20 28 32 24 Q44 28 44 44 Z" fill="white"/>
  <ellipse cx="32" cy="24" rx="10" ry="6" fill="white"/>
  <!-- Popcorn kernels -->
  <circle cx="26" cy="20" r="3" fill="white"/>
  <circle cx="32" cy="17" r="3" fill="white"/>
  <circle cx="38" cy="20" r="3" fill="white"/>
  <circle cx="29" cy="18" r="2.5" fill="#C62828"/>
  <circle cx="35" cy="18" r="2.5" fill="#C62828"/>
  <!-- Stripes on bucket -->
  <line x1="24" y1="30" x2="26" y2="44" stroke="#C62828" stroke-width="2"/>
  <line x1="40" y1="30" x2="38" y2="44" stroke="#C62828" stroke-width="2"/>
</svg>