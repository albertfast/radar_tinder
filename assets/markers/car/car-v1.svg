<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feFlood flood-color="#00e5ff" flood-opacity="0.55" result="color" />
      <feComposite in="color" in2="blur" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="carBodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#18ffff" />
      <stop offset="50%" stop-color="#00bcd4" />
      <stop offset="100%" stop-color="#00838f" />
    </linearGradient>
  </defs>
  <!-- Car top-down view -->
  <g filter="url(#cyanGlow)">
    <!-- Main body -->
    <path d="M32 6 C28 6 24 10 24 16 L24 22 L20 24 L20 40 L24 42 L24 48 C24 54 28 58 32 58 C36 58 40 54 40 48 L40 42 L44 40 L44 24 L40 22 L40 16 C40 10 36 6 32 6 Z"
          fill="url(#carBodyGrad)" stroke="#84ffff" stroke-width="1" />
  </g>
  <!-- Windshield -->
  <path d="M26 18 L26 22 L38 22 L38 18 C38 14 35 11 32 11 C29 11 26 14 26 18 Z"
        fill="#0e4d5e" stroke="#00e5ff" stroke-width="0.5" opacity="0.8" />
  <!-- Rear window -->
  <path d="M26 42 L26 46 C26 50 29 53 32 53 C35 53 38 50 38 46 L38 42 Z"
        fill="#0e4d5e" stroke="#00e5ff" stroke-width="0.5" opacity="0.8" />
  <!-- Left side windows -->
  <rect x="22" y="26" width="3" height="12" rx="1" fill="#0e4d5e" stroke="#00e5ff" stroke-width="0.5" opacity="0.7" />
  <!-- Right side windows -->
  <rect x="39" y="26" width="3" height="12" rx="1" fill="#0e4d5e" stroke="#00e5ff" stroke-width="0.5" opacity="0.7" />
  <!-- Center line (roof line) -->
  <line x1="32" y1="11" x2="32" y2="53" stroke="#84ffff" stroke-width="0.5" opacity="0.4" />
  <!-- Headlights -->
  <ellipse cx="27" cy="8" rx="2" ry="1.5" fill="#ffffff" opacity="0.7" />
  <ellipse cx="37" cy="8" rx="2" ry="1.5" fill="#ffffff" opacity="0.7" />
  <!-- Tail lights -->
  <ellipse cx="27" cy="57" rx="2.5" ry="1" fill="#ff1744" opacity="0.8" />
  <ellipse cx="37" cy="57" rx="2.5" ry="1" fill="#ff1744" opacity="0.8" />
</svg>