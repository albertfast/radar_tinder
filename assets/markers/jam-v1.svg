<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background glow -->
  <rect x="14" y="4" width="36" height="56" rx="4" fill="#E65100" opacity="0.15" filter="url(#glow)"/>
  <!-- Car 1 (front, top) -->
  <g filter="url(#glow)">
    <rect x="20" y="6" width="24" height="14" rx="5" fill="#FF6D00" stroke="#FFAB40" stroke-width="1"/>
    <rect x="22" y="8" width="9" height="5" rx="2" fill="#FFE0B2" opacity="0.4"/>
    <rect x="33" y="8" width="9" height="5" rx="2" fill="#FFE0B2" opacity="0.4"/>
    <rect x="16" y="9" width="5" height="8" rx="2.5" fill="#BF360C"/>
    <rect x="43" y="9" width="5" height="8" rx="2.5" fill="#BF360C"/>
  </g>
  <!-- Car 2 (middle) -->
  <g filter="url(#glow)">
    <rect x="20" y="24" width="24" height="14" rx="5" fill="#FF8F00" stroke="#FFB74D" stroke-width="1"/>
    <rect x="22" y="26" width="9" height="5" rx="2" fill="#FFE0B2" opacity="0.4"/>
    <rect x="33" y="26" width="9" height="5" rx="2" fill="#FFE0B2" opacity="0.4"/>
    <rect x="16" y="27" width="5" height="8" rx="2.5" fill="#BF360C"/>
    <rect x="43" y="27" width="5" height="8" rx="2.5" fill="#BF360C"/>
  </g>
  <!-- Car 3 (back, bottom) -->
  <g filter="url(#glow)">
    <rect x="20" y="42" width="24" height="14" rx="5" fill="#FFA000" stroke="#FFCC80" stroke-width="1"/>
    <rect x="22" y="44" width="9" height="5" rx="2" fill="#FFE0B2" opacity="0.4"/>
    <rect x="33" y="44" width="9" height="5" rx="2" fill="#FFE0B2" opacity="0.4"/>
    <rect x="16" y="45" width="5" height="8" rx="2.5" fill="#BF360C"/>
    <rect x="43" y="45" width="5" height="8" rx="2.5" fill="#BF360C"/>
  </g>
  <!-- Brake lights on car 2 (from car 1 perspective) -->
  <rect x="21" y="17" width="4" height="2" rx="1" fill="#FF1744" opacity="0.8"/>
  <rect x="39" y="17" width="4" height="2" rx="1" fill="#FF1744" opacity="0.8"/>
  <!-- Brake lights on car 3 -->
  <rect x="21" y="35" width="4" height="2" rx="1" fill="#FF1744" opacity="0.8"/>
  <rect x="39" y="35" width="4" height="2" rx="1" fill="#FF1744" opacity="0.8"/>
</svg>