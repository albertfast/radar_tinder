<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="pinkGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#FF4081" flood-opacity="0.8" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="circGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF80AB"/>
      <stop offset="100%" stop-color="#880E4F"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="28" fill="url(#circGrad)" filter="url(#pinkGlow)"/>
  <!-- White building blocks/toys -->
  <!-- Large cube -->
  <rect x="10" y="26" width="18" height="18" rx="2" fill="#FFFFFF"/>
  <polygon points="10,26 16,20 34,20 28,26" fill="#FFFFFF" opacity="0.8"/>
  <polygon points="28,26 34,20 34,38 28,44" fill="#FFFFFF" opacity="0.6"/>
  <!-- Letter A on cube -->
  <path d="M17 40 L19 32 L21 40 M18 37 L20 37" stroke="#AD1457" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Smaller block on top -->
  <rect x="32" y="16" width="14" height="14" rx="2" fill="#FFFFFF" opacity="0.9"/>
  <polygon points="32,16 36,12 50,12 46,16" fill="#FFFFFF" opacity="0.7"/>
  <polygon points="46,16 50,12 50,26 46,30" fill="#FFFFFF" opacity="0.5"/>
  <!-- Star on small block -->
  <polygon points="39,20 40,23 43,23 41,25 42,28 39,26 36,28 37,25 35,23 38,23" fill="#AD1457" opacity="0.7"/>
  <!-- Ball -->
  <circle cx="42" cy="42" r="8" fill="#FFFFFF"/>
  <path d="M36 38 Q42 36 48 38" fill="none" stroke="#AD1457" stroke-width="1" opacity="0.5"/>
  <path d="M36 44 Q42 42 48 44" fill="none" stroke="#AD1457" stroke-width="1" opacity="0.5"/>
  <!-- Ball shine -->
  <circle cx="40" cy="39" r="2" fill="#FFFFFF" opacity="0.3"/>
</svg>