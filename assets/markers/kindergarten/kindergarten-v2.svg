<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="pinkGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feFlood flood-color="#FF4081" flood-opacity="0.7" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="circGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF80AB"/>
      <stop offset="100%" stop-color="#AD1457"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="28" fill="url(#circGrad)" filter="url(#pinkGlow)"/>
  <!-- White teddy bear -->
  <!-- Head -->
  <circle cx="32" cy="22" r="10" fill="#FFFFFF"/>
  <!-- Ears -->
  <circle cx="22" cy="16" r="5" fill="#FFFFFF"/>
  <circle cx="42" cy="16" r="5" fill="#FFFFFF"/>
  <circle cx="22" cy="16" r="3" fill="#F8BBD0"/>
  <circle cx="42" cy="16" r="3" fill="#F8BBD0"/>
  <!-- Eyes -->
  <circle cx="28" cy="20" r="2" fill="#AD1457"/>
  <circle cx="36" cy="20" r="2" fill="#AD1457"/>
  <!-- Nose -->
  <ellipse cx="32" cy="25" rx="3" ry="2" fill="#AD1457"/>
  <!-- Body -->
  <ellipse cx="32" cy="42" rx="12" ry="11" fill="#FFFFFF"/>
  <!-- Belly -->
  <ellipse cx="32" cy="42" rx="7" ry="7" fill="#F8BBD0"/>
  <!-- Arms -->
  <ellipse cx="18" cy="38" rx="5" ry="8" fill="#FFFFFF" transform="rotate(15 18 38)"/>
  <ellipse cx="46" cy="38" rx="5" ry="8" fill="#FFFFFF" transform="rotate(-15 46 38)"/>
  <!-- Legs -->
  <ellipse cx="26" cy="52" rx="5" ry="6" fill="#FFFFFF"/>
  <ellipse cx="38" cy="52" rx="5" ry="6" fill="#FFFFFF"/>
</svg>