<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#009688" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="28" fill="#004D40" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="26" fill="#00695C"/>
  <!-- White bed -->
  <rect x="14" y="28" width="24" height="10" rx="2" fill="white"/>
  <rect x="16" y="24" width="8" height="5" rx="2" fill="white"/>
  <rect x="14" y="38" width="24" height="2" rx="1" fill="white"/>
  <!-- White car -->
  <rect x="36" y="34" width="16" height="8" rx="3" fill="white"/>
  <path d="M38 34 L40 30 L50 30 L52 34 Z" fill="white"/>
  <circle cx="40" cy="44" r="2" fill="white"/>
  <circle cx="50" cy="44" r="2" fill="white"/>
</svg>