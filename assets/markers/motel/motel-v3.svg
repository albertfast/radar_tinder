<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#009688" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="28" fill="#004D40" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="25" fill="#00695C" stroke="#4DB6AC" stroke-width="1.5"/>
  <!-- White room icon -->
  <rect x="16" y="20" width="32" height="26" rx="2" fill="white"/>
  <rect x="18" y="22" width="28" height="22" rx="1" fill="#00695C"/>
  <!-- Window -->
  <rect x="22" y="24" width="8" height="8" rx="1" fill="white" opacity="0.8"/>
  <line x1="26" y1="24" x2="26" y2="32" stroke="#00695C" stroke-width="0.8"/>
  <line x1="22" y1="28" x2="30" y2="28" stroke="#00695C" stroke-width="0.8"/>
  <!-- Door -->
  <rect x="34" y="30" width="8" height="14" rx="1" fill="white" opacity="0.8"/>
  <circle cx="40" cy="38" r="1" fill="#00695C"/>
  <!-- Bed inside -->
  <rect x="20" y="35" width="10" height="6" rx="1" fill="white" opacity="0.6"/>
</svg>