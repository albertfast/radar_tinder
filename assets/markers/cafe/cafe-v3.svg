<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8A855"/>
      <stop offset="100%" stop-color="#8B4513"/>
    </linearGradient>
  </defs>
  <!-- Amber badge circle -->
  <circle cx="32" cy="32" r="28" fill="url(#badgeGrad)" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="25" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.3"/>
  <!-- White coffee bean -->
  <g fill="#FFFFFF" transform="translate(32,32) rotate(-30)">
    <ellipse cx="0" cy="0" rx="12" ry="8"/>
    <!-- Bean line/crease -->
    <path d="M-2 -8 Q4 -2 -2 8" fill="none" stroke="#8B4513" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>