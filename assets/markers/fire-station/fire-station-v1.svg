<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feFlood flood-color="#F44336" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <defs>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feFlood flood-color="#FF6D00" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Red fire truck -->
  <g filter="url(#glow)">
    <rect x="6" y="26" width="52" height="20" rx="3" fill="#D32F2F"/>
    <path d="M6 26 L12 18 L48 18 L52 26 Z" fill="#E53935"/>
  </g>
  <!-- Cab -->
  <rect x="38" y="18" width="16" height="20" rx="2" fill="#F44336"/>
  <rect x="42" y="20" width="10" height="8" rx="1" fill="#FFCDD2" opacity="0.8"/>
  <!-- Ladder -->
  <rect x="10" y="22" width="26" height="2" rx="1" fill="#FF8A65"/>
  <line x1="12" y1="22" x2="12" y2="24" stroke="#FFAB91" stroke-width="1"/>
  <line x1="18" y1="22" x2="18" y2="24" stroke="#FFAB91" stroke-width="1"/>
  <line x1="24" y1="22" x2="24" y2="24" stroke="#FFAB91" stroke-width="1"/>
  <line x1="30" y1="22" x2="30" y2="24" stroke="#FFAB91" stroke-width="1"/>
  <!-- Wheels -->
  <circle cx="18" cy="48" r="5" fill="#212121"/>
  <circle cx="46" cy="48" r="5" fill="#212121"/>
  <circle cx="18" cy="48" r="2.5" fill="#616161"/>
  <circle cx="46" cy="48" r="2.5" fill="#616161"/>
  <!-- Siren -->
  <rect x="44" y="14" width="6" height="4" rx="2" fill="#FF6D00" filter="url(#glow2)"/>
</svg>