<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#F44336" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="28" fill="#B71C1C" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="25" fill="#C62828" stroke="#EF5350" stroke-width="1.5"/>
  <!-- White fire hat -->
  <path d="M16 36 Q16 18 32 16 Q48 18 48 36 Z" fill="white"/>
  <rect x="12" y="36" width="40" height="6" rx="2" fill="white"/>
  <rect x="14" y="38" width="36" height="2" fill="#C62828" opacity="0.4"/>
  <!-- Hat badge -->
  <circle cx="32" cy="28" r="4" fill="#C62828" opacity="0.5"/>
  <path d="M30 28 L32 25 L34 28 L32 31 Z" fill="white"/>
  <!-- Brim detail -->
  <rect x="14" y="42" width="36" height="2" rx="1" fill="white" opacity="0.6"/>
</svg>