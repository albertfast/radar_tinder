<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#F44336" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="28" fill="#B71C1C" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="26" fill="#C62828"/>
  <!-- White flame -->
  <path d="M32 12 Q40 20 38 30 Q42 28 40 36 Q38 44 32 50 Q26 44 24 36 Q22 28 26 30 Q24 20 32 12 Z" fill="white"/>
  <path d="M32 20 Q36 26 34 32 Q36 30 36 36 Q34 42 32 44 Q30 42 28 36 Q28 30 30 32 Q28 26 32 20 Z" fill="#C62828" opacity="0.3"/>
</svg>