<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Yellow glow filter -->
    <filter id="yellowGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feFlood flood-color="#ffdd00" flood-opacity="0.5" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Inner shadow -->
    <filter id="innerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer glow ring -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#ffdd00" stroke-width="1" opacity="0.15" filter="url(#yellowGlow)"/>

  <!-- Badge background -->
  <g filter="url(#innerShadow)">
    <circle cx="32" cy="32" r="26" fill="#0d1b3e"/>
    <!-- Bright yellow border ring -->
    <circle cx="32" cy="32" r="26" fill="none" stroke="#ffdd00" stroke-width="3"/>
    <!-- Inner ring accent -->
    <circle cx="32" cy="32" r="22" fill="none" stroke="#ffdd00" stroke-width="0.5" opacity="0.4"/>
  </g>

  <!-- Camera silhouette in center -->
  <g filter="url(#yellowGlow)">
    <!-- Camera body -->
    <rect x="20" y="28" width="24" height="16" rx="3" fill="#ffffff"/>
    <!-- Camera top bump (flash housing) -->
    <rect x="28" y="24" width="8" height="5" rx="1.5" fill="#ffffff"/>
    <!-- Lens circle -->
    <circle cx="32" cy="36" r="5" fill="#0d1b3e"/>
    <!-- Lens inner ring -->
    <circle cx="32" cy="36" r="3.5" fill="#1a2d5e"/>
    <!-- Lens highlight -->
    <circle cx="30.5" cy="34.5" r="1.2" fill="#ffffff" opacity="0.7"/>
  </g>
</svg>