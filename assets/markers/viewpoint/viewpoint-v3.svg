<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#FFB300" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="28" fill="#E65100" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="25" fill="#EF6C00" stroke="#FFB74D" stroke-width="1.5"/>
  <!-- White camera -->
  <rect x="16" y="24" width="32" height="22" rx="4" fill="white"/>
  <circle cx="32" cy="35" r="8" fill="#EF6C00"/>
  <circle cx="32" cy="35" r="5" fill="white" opacity="0.8"/>
  <circle cx="32" cy="35" r="2.5" fill="#EF6C00"/>
  <!-- Lens reflection -->
  <circle cx="30" cy="33" r="1" fill="white" opacity="0.6"/>
  <!-- Flash -->
  <rect x="38" y="20" width="6" height="4" rx="1" fill="white" opacity="0.8"/>
  <!-- Landscape at bottom -->
  <path d="M16 44 L24 36 L32 40 L40 34 L48 42 L48 46 L16 46 Z" fill="white" opacity="0.3"/>
</svg>