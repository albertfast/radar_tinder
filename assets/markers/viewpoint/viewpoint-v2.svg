<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#FFB300" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="28" fill="#E65100" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="26" fill="#EF6C00"/>
  <!-- White mountain -->
  <path d="M8 48 L24 18 L40 48 Z" fill="white"/>
  <path d="M24 48 L40 22 L56 48 Z" fill="white" opacity="0.7"/>
  <!-- Snow caps -->
  <path d="M20 24 L24 18 L28 24 Z" fill="#EF6C00" opacity="0.3"/>
  <path d="M36 28 L40 22 L44 28 Z" fill="#EF6C00" opacity="0.3"/>
  <!-- Eye -->
  <ellipse cx="32" cy="18" rx="6" ry="4" fill="white" opacity="0.8"/>
  <circle cx="32" cy="18" r="2" fill="#EF6C00"/>
</svg>