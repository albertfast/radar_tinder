<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer glow -->
  <circle cx="32" cy="32" r="28" fill="#0D47A1" opacity="0.15" filter="url(#glow)"/>
  <!-- Circle sign -->
  <circle cx="32" cy="32" r="24" fill="#1565C0" stroke="#42A5F5" stroke-width="2" filter="url(#glow)"/>
  <!-- Inner ring -->
  <circle cx="32" cy="32" r="20" fill="#1976D2" stroke="#64B5F6" stroke-width="1" opacity="0.5"/>
  <!-- P letter as path -->
  <g filter="url(#textGlow)">
    <!-- P stem -->
    <rect x="22" y="20" width="5" height="28" rx="1" fill="#FFFFFF"/>
    <!-- P top curve (bowl) -->
    <path d="M27,20 L36,20 Q44,20 44,27 Q44,34 36,34 L27,34 Z" fill="#FFFFFF"/>
    <!-- P inner cutout -->
    <path d="M27,25 L34,25 Q38,25 38,27 Q38,29 34,29 L27,29 Z" fill="#1565C0"/>
  </g>
</svg>