<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="blueGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#448AFF" flood-opacity="0.8" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="circGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#448AFF"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="28" fill="url(#circGrad)" filter="url(#blueGlow)"/>
  <!-- White smile with tooth -->
  <path d="M14 30 Q14 50 32 50 Q50 50 50 30" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <!-- Teeth row -->
  <rect x="24" y="30" width="5" height="7" rx="1" fill="#FFFFFF"/>
  <rect x="30" y="30" width="5" height="8" rx="1" fill="#FFFFFF"/>
  <rect x="36" y="30" width="5" height="7" rx="1" fill="#FFFFFF"/>
  <!-- Sparkle -->
  <circle cx="48" cy="20" r="2" fill="#82B1FF"/>
  <circle cx="52" cy="16" r="1.5" fill="#82B1FF" opacity="0.7"/>
</svg>