<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#9C27B0" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="28" fill="#4A148C" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="25" fill="#6A1B9A" stroke="#BA68C8" stroke-width="1.5"/>
  <!-- White key -->
  <circle cx="26" cy="26" r="6" fill="none" stroke="white" stroke-width="2.5"/>
  <line x1="32" y1="26" x2="44" y2="26" stroke="white" stroke-width="2.5"/>
  <line x1="40" y1="26" x2="40" y2="32" stroke="white" stroke-width="2"/>
  <line x1="44" y1="26" x2="44" y2="32" stroke="white" stroke-width="2"/>
  <!-- White door -->
  <rect x="22" y="36" width="20" height="16" rx="2" fill="white"/>
  <rect x="24" y="38" width="16" height="12" rx="1" fill="#6A1B9A"/>
  <circle cx="37" cy="45" r="1.5" fill="white"/>
</svg>