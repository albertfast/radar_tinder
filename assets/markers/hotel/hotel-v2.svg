<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#9C27B0" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="28" fill="#6A1B9A" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="26" fill="#7B1FA2"/>
  <!-- White bed icon -->
  <rect x="16" y="30" width="32" height="12" rx="2" fill="white"/>
  <rect x="18" y="26" width="10" height="6" rx="2" fill="white"/>
  <rect x="34" y="26" width="10" height="6" rx="1" fill="white" opacity="0.7"/>
  <rect x="16" y="42" width="32" height="2" rx="1" fill="white"/>
  <!-- Bed posts -->
  <rect x="16" y="24" width="3" height="20" rx="1" fill="white"/>
  <rect x="45" y="28" width="3" height="16" rx="1" fill="white"/>
</svg>