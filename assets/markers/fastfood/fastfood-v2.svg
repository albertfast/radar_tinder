<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="circleGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#E89010"/>
    </radialGradient>
  </defs>
  <!-- Yellow circle background -->
  <circle cx="32" cy="32" r="28" fill="url(#circleGrad)" filter="url(#glow)"/>
  <!-- White fries container -->
  <g fill="#FFFFFF">
    <!-- Container -->
    <path d="M18 28 L20 52 L38 52 L40 28 Z"/>
    <!-- Container stripe -->
    <rect x="22" y="34" width="14" height="2" rx="1" fill="#E89010" opacity="0.5"/>
  </g>
  <!-- French fry sticks -->
  <g fill="#FFFFFF">
    <rect x="22" y="10" width="3" height="20" rx="1.5" transform="rotate(-8,23,20)"/>
    <rect x="27" y="8" width="3" height="22" rx="1.5" transform="rotate(5,28,18)"/>
    <rect x="32" y="9" width="3" height="21" rx="1.5" transform="rotate(-3,33,19)"/>
    <rect x="36" y="11" width="3" height="19" rx="1.5" transform="rotate(10,37,20)"/>
  </g>
</svg>