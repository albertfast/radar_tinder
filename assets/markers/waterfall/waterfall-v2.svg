<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#2196F3" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="28" fill="#0D47A1" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="26" fill="#1565C0"/>
  <!-- White waterfall -->
  <path d="M22 12 L26 12 L26 38 Q26 44 32 44 Q38 44 38 38 L38 12 L42 12 L42 38 Q42 48 32 48 Q22 48 22 38 Z" fill="white"/>
  <!-- Water lines -->
  <line x1="28" y1="16" x2="28" y2="36" stroke="#1565C0" stroke-width="1" opacity="0.4"/>
  <line x1="32" y1="16" x2="32" y2="38" stroke="#1565C0" stroke-width="1" opacity="0.4"/>
  <line x1="36" y1="16" x2="36" y2="36" stroke="#1565C0" stroke-width="1" opacity="0.4"/>
  <!-- Rocks -->
  <path d="M16 40 L22 36 L22 44 L16 44 Z" fill="white" opacity="0.6"/>
  <path d="M48 40 L42 36 L42 44 L48 44 Z" fill="white" opacity="0.6"/>
  <!-- Pool -->
  <ellipse cx="32" cy="50" rx="12" ry="4" fill="white" opacity="0.4"/>
</svg>