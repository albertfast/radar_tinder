<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feFlood flood-color="#2196F3" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Blue water cascade on rocks -->
  <g filter="url(#glow)">
    <!-- Rocks -->
    <path d="M8 40 L20 30 L26 40 Z" fill="#546E7A"/>
    <path d="M38 40 L44 28 L56 40 Z" fill="#546E7A"/>
    <rect x="8" y="40" width="48" height="12" rx="2" fill="#455A64"/>
  </g>
  <!-- Waterfall -->
  <rect x="22" y="14" width="20" height="28" rx="2" fill="#42A5F5" filter="url(#glow)"/>
  <rect x="24" y="16" width="16" height="24" rx="1" fill="#64B5F6" opacity="0.7"/>
  <!-- Water lines -->
  <line x1="26" y1="18" x2="26" y2="38" stroke="#BBDEFB" stroke-width="1" opacity="0.6"/>
  <line x1="30" y1="18" x2="30" y2="38" stroke="#BBDEFB" stroke-width="1" opacity="0.6"/>
  <line x1="34" y1="18" x2="34" y2="38" stroke="#BBDEFB" stroke-width="1" opacity="0.6"/>
  <line x1="38" y1="18" x2="38" y2="38" stroke="#BBDEFB" stroke-width="1" opacity="0.6"/>
  <!-- Splash -->
  <ellipse cx="32" cy="42" rx="14" ry="3" fill="#90CAF9" opacity="0.6"/>
  <!-- Cliff top -->
  <rect x="18" y="12" width="28" height="4" rx="1" fill="#607D8B"/>
  <!-- Pool -->
  <path d="M10 48 Q20 44 32 48 Q44 44 54 48 L54 54 L10 54 Z" fill="#1E88E5" opacity="0.5"/>
</svg>