<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#2196F3" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="28" fill="#0D47A1" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="25" fill="#1565C0" stroke="#42A5F5" stroke-width="1.5"/>
  <!-- White water and rocks -->
  <!-- Cliff -->
  <rect x="16" y="10" width="32" height="4" rx="1" fill="white"/>
  <!-- Falls -->
  <path d="M20 14 L24 14 Q24 30 28 36 Q30 38 32 38 Q34 38 36 36 Q40 30 40 14 L44 14 Q44 34 38 40 Q36 44 32 44 Q28 44 26 40 Q20 34 20 14 Z" fill="white"/>
  <!-- Water texture -->
  <line x1="26" y1="18" x2="26" y2="32" stroke="#1565C0" stroke-width="0.8" opacity="0.3"/>
  <line x1="30" y1="18" x2="30" y2="36" stroke="#1565C0" stroke-width="0.8" opacity="0.3"/>
  <line x1="34" y1="18" x2="34" y2="36" stroke="#1565C0" stroke-width="0.8" opacity="0.3"/>
  <line x1="38" y1="18" x2="38" y2="32" stroke="#1565C0" stroke-width="0.8" opacity="0.3"/>
  <!-- Rocks -->
  <path d="M14 38 L20 30 L20 44 L14 44 Z" fill="white" opacity="0.6"/>
  <path d="M50 38 L44 30 L44 44 L50 44 Z" fill="white" opacity="0.6"/>
  <!-- Pool -->
  <ellipse cx="32" cy="48" rx="16" ry="5" fill="white" opacity="0.4"/>
</svg>