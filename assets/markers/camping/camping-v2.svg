<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#4CAF50" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="28" fill="#1B5E20" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="26" fill="#2E7D32"/>
  <!-- White tent -->
  <path d="M14 44 L32 16 L50 44 Z" fill="white"/>
  <path d="M24 44 L32 28 L40 44 Z" fill="#2E7D32" opacity="0.5"/>
  <!-- Flag -->
  <line x1="32" y1="16" x2="32" y2="12" stroke="white" stroke-width="1.5"/>
  <rect x="32" y="12" width="6" height="4" rx="0.5" fill="#81C784"/>
</svg>