<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feFlood flood-color="#4CAF50" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Green tent with campfire -->
  <path d="M8 44 L32 14 L56 44 Z" fill="#4CAF50" filter="url(#glow)"/>
  <path d="M20 44 L32 24 L44 44 Z" fill="#2E7D32" opacity="0.6"/>
  <path d="M32 14 L32 44" stroke="#388E3C" stroke-width="1"/>
  <!-- Campfire -->
  <path d="M28 54 Q32 44 36 54" fill="#FF6D00"/>
  <path d="M30 54 Q32 48 34 54" fill="#FFD600"/>
  <path d="M31 54 Q32 50 33 54" fill="#FFF9C4"/>
  <!-- Logs -->
  <line x1="26" y1="56" x2="38" y2="54" stroke="#795548" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="56" x2="26" y2="54" stroke="#795548" stroke-width="2" stroke-linecap="round"/>
</svg>