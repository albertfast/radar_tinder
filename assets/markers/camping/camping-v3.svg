<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#4CAF50" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="28" fill="#1B5E20" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="25" fill="#2E7D32" stroke="#66BB6A" stroke-width="1.5"/>
  <!-- White caravan -->
  <rect x="12" y="26" width="34" height="18" rx="3" fill="white"/>
  <rect x="14" y="28" width="30" height="10" rx="1" fill="#2E7D32" opacity="0.3"/>
  <rect x="16" y="30" width="10" height="6" rx="1" fill="white" opacity="0.7"/>
  <rect x="30" y="30" width="10" height="6" rx="1" fill="white" opacity="0.7"/>
  <circle cx="20" cy="46" r="3" fill="white"/>
  <circle cx="38" cy="46" r="3" fill="white"/>
  <!-- Hitch -->
  <line x1="46" y1="36" x2="52" y2="36" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <circle cx="52" cy="36" r="2" fill="white"/>
</svg>