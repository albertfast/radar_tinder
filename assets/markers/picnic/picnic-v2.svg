<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#ffab00" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="colorBlur"/>
      <feMerge>
        <feMergeNode in="colorBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="bgGrad" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#ffa000"/>
      <stop offset="100%" stop-color="#e65100"/>
    </radialGradient>
  </defs>
  <g filter="url(#glow)">
    <circle cx="32" cy="32" r="26" fill="url(#bgGrad)"/>
    <circle cx="32" cy="32" r="24" fill="none" stroke="#ffab00" stroke-width="1" opacity="0.4"/>
    <!-- White picnic basket -->
    <!-- Basket body -->
    <path d="M16,28 L18,46 L46,46 L48,28 Z" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Basket handle -->
    <path d="M20,28 Q20,14 32,14 Q44,14 44,28" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Basket weave lines -->
    <line x1="24" y1="28" x2="25" y2="46" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
    <line x1="32" y1="28" x2="32" y2="46" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
    <line x1="40" y1="28" x2="39" y2="46" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
    <line x1="16" y1="34" x2="48" y2="34" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
    <line x1="17" y1="40" x2="47" y2="40" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
    <!-- Basket lid flap -->
    <line x1="16" y1="28" x2="48" y2="28" stroke="#ffffff" stroke-width="2.2"/>
  </g>
</svg>