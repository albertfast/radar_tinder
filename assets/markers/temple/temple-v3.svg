<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#FF6D00" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="28" fill="#BF360C" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="25" fill="#D84315" stroke="#FF8A65" stroke-width="1.5"/>
  <!-- White lotus -->
  <path d="M32 18 Q26 26 20 36 Q26 32 32 38 Q38 32 44 36 Q38 26 32 18 Z" fill="white"/>
  <path d="M32 24 Q28 30 24 36 Q28 34 32 38 Q36 34 40 36 Q36 30 32 24 Z" fill="white" opacity="0.7"/>
  <!-- Center petal -->
  <path d="M32 16 Q30 26 32 38 Q34 26 32 16 Z" fill="white" opacity="0.9"/>
  <!-- Base -->
  <ellipse cx="32" cy="42" rx="14" ry="4" fill="white" opacity="0.5"/>
  <!-- Inner detail -->
  <circle cx="32" cy="30" r="2" fill="#D84315" opacity="0.6"/>
</svg>