<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#FF6D00" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="28" fill="#BF360C" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="26" fill="#D84315"/>
  <!-- White temple -->
  <path d="M24 14 L32 8 L40 14 L40 20 L24 20 Z" fill="white"/>
  <path d="M20 20 L32 14 L44 20 L44 30 L20 30 Z" fill="white"/>
  <path d="M16 30 L32 22 L48 30 L48 42 L16 42 Z" fill="white"/>
  <rect x="14" y="42" width="36" height="4" rx="1" fill="white"/>
  <!-- Door -->
  <rect x="28" y="42" width="8" height="4" rx="4" fill="#D84315"/>
</svg>