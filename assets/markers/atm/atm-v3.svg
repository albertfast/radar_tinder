<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#44DD66"/>
      <stop offset="100%" stop-color="#228844"/>
    </linearGradient>
  </defs>
  <!-- Green badge circle -->
  <circle cx="32" cy="32" r="28" fill="url(#badgeGrad)" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="25" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.3"/>
  <!-- White ATM machine -->
  <g fill="#FFFFFF">
    <!-- ATM body -->
    <rect x="16" y="12" width="32" height="40" rx="3"/>
    <!-- Screen -->
    <rect x="20" y="16" width="24" height="10" rx="2" fill="#228844" opacity="0.5"/>
    <!-- Keypad -->
    <g fill="#228844" opacity="0.4">
      <rect x="20" y="30" width="5" height="4" rx="1"/>
      <rect x="27" y="30" width="5" height="4" rx="1"/>
      <rect x="34" y="30" width="5" height="4" rx="1"/>
      <rect x="20" y="36" width="5" height="4" rx="1"/>
      <rect x="27" y="36" width="5" height="4" rx="1"/>
      <rect x="34" y="36" width="5" height="4" rx="1"/>
    </g>
    <!-- Card slot -->
    <rect x="22" y="44" width="20" height="4" rx="2" fill="#228844" opacity="0.4"/>
    <!-- Cash dispenser -->
    <rect x="26" y="28" width="12" height="2" rx="1" fill="#228844" opacity="0.3"/>
  </g>
</svg>