<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="greenGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feFlood flood-color="#76FF03" flood-opacity="0.7" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="circGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#76FF03"/>
      <stop offset="100%" stop-color="#33691E"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="28" fill="url(#circGrad)" filter="url(#greenGlow)"/>
  <!-- White paw icon inside circle -->
  <ellipse cx="32" cy="40" rx="8" ry="6" fill="#FFFFFF"/>
  <circle cx="21" cy="28" r="5" fill="#FFFFFF"/>
  <circle cx="29" cy="23" r="5" fill="#FFFFFF"/>
  <circle cx="37" cy="23" r="5" fill="#FFFFFF"/>
  <circle cx="43" cy="28" r="5" fill="#FFFFFF"/>
</svg>