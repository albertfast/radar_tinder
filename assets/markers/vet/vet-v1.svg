<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="greenGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feFlood flood-color="#76FF03" flood-opacity="0.7" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#76FF03"/>
      <stop offset="100%" stop-color="#64DD17"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="52" height="52" rx="8" ry="8" fill="url(#bgGrad)" filter="url(#greenGlow)"/>
  <!-- White paw print -->
  <!-- Main pad -->
  <ellipse cx="32" cy="40" rx="10" ry="8" fill="#FFFFFF"/>
  <!-- Toes -->
  <circle cx="18" cy="26" r="6" fill="#FFFFFF"/>
  <circle cx="28" cy="20" r="6" fill="#FFFFFF"/>
  <circle cx="38" cy="20" r="6" fill="#FFFFFF"/>
  <circle cx="46" cy="26" r="6" fill="#FFFFFF"/>
</svg>