<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="purpleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feFlood flood-color="#D500F9" flood-opacity="0.7" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="capGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E040FB"/>
      <stop offset="100%" stop-color="#AA00FF"/>
    </linearGradient>
  </defs>
  <!-- Mortarboard cap -->
  <!-- Top flat board -->
  <polygon points="8,26 32,14 56,26 32,34" fill="url(#capGrad)" filter="url(#purpleGlow)"/>
  <!-- Cap base/crown -->
  <path d="M16 28 L16 38 Q16 44 32 44 Q48 44 48 38 L48 28 L32 36 Z" fill="url(#capGrad)" filter="url(#purpleGlow)"/>
  <!-- Tassel -->
  <line x1="56" y1="26" x2="56" y2="46" stroke="#E040FB" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="53" y="46" width="6" height="8" rx="1" fill="#E040FB"/>
  <!-- Button on top -->
  <circle cx="32" cy="24" r="2" fill="#FFFFFF"/>
  <!-- Highlight on board -->
  <polygon points="32,16 52,26 32,32 12,26" fill="#FFFFFF" opacity="0.1"/>
</svg>