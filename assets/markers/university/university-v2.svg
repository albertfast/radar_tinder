<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="purpleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feFlood flood-color="#D500F9" flood-opacity="0.7" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="circGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E040FB"/>
      <stop offset="100%" stop-color="#6A1B9A"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="28" fill="url(#circGrad)" filter="url(#purpleGlow)"/>
  <!-- White building with columns (classical university) -->
  <!-- Pediment/triangle roof -->
  <polygon points="14,22 32,12 50,22" fill="#FFFFFF"/>
  <!-- Entablature -->
  <rect x="14" y="22" width="36" height="4" fill="#FFFFFF"/>
  <!-- Columns -->
  <rect x="18" y="26" width="4" height="22" rx="1" fill="#FFFFFF"/>
  <rect x="27" y="26" width="4" height="22" rx="1" fill="#FFFFFF"/>
  <rect x="36" y="26" width="4" height="22" rx="1" fill="#FFFFFF"/>
  <rect x="45" y="26" width="4" height="22" rx="1" fill="#FFFFFF"/>
  <!-- Base -->
  <rect x="14" y="48" width="36" height="4" fill="#FFFFFF"/>
</svg>