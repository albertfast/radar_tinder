<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="carGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background glow -->
  <rect x="4" y="8" width="56" height="48" rx="4" fill="#0D47A1" opacity="0.12" filter="url(#glow)"/>
  <!-- Left parking line -->
  <rect x="8" y="12" width="3" height="40" rx="1" fill="#42A5F5" opacity="0.7" filter="url(#glow)"/>
  <!-- Right parking line -->
  <rect x="53" y="12" width="3" height="40" rx="1" fill="#42A5F5" opacity="0.7" filter="url(#glow)"/>
  <!-- Front line -->
  <rect x="8" y="12" width="48" height="3" rx="1" fill="#42A5F5" opacity="0.5"/>
  <!-- Car body -->
  <g filter="url(#carGlow)">
    <rect x="16" y="18" width="32" height="28" rx="8" fill="#1E88E5" stroke="#64B5F6" stroke-width="1.5"/>
    <!-- Car roof -->
    <rect x="22" y="22" width="20" height="14" rx="4" fill="#1565C0" stroke="#42A5F5" stroke-width="0.5"/>
    <!-- Windshield -->
    <rect x="24" y="24" width="7" height="8" rx="2" fill="#0D47A1" opacity="0.6"/>
    <!-- Rear window -->
    <rect x="33" y="24" width="7" height="8" rx="2" fill="#0D47A1" opacity="0.6"/>
    <!-- Left headlight -->
    <rect x="18" y="20" width="4" height="3" rx="1" fill="#BBDEFB" opacity="0.6"/>
    <!-- Right headlight -->
    <rect x="42" y="20" width="4" height="3" rx="1" fill="#BBDEFB" opacity="0.6"/>
    <!-- Left wheel -->
    <rect x="14" y="28" width="4" height="12" rx="2" fill="#0D47A1"/>
    <!-- Right wheel -->
    <rect x="46" y="28" width="4" height="12" rx="2" fill="#0D47A1"/>
  </g>
  <!-- P label on car -->
  <text x="32" y="50" font-family="Arial, sans-serif" font-size="10" fill="#42A5F5" text-anchor="middle" font-weight="bold" opacity="0.8">P</text>
</svg>