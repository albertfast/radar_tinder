<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#E040FB" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="28" fill="#7B1FA2" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="26" fill="#8E24AA"/>
  <!-- White disco ball -->
  <line x1="32" y1="8" x2="32" y2="18" stroke="white" stroke-width="1.5"/>
  <circle cx="32" cy="28" r="12" fill="white"/>
  <!-- Grid lines -->
  <line x1="20" y1="28" x2="44" y2="28" stroke="#8E24AA" stroke-width="1"/>
  <line x1="22" y1="22" x2="42" y2="34" stroke="#8E24AA" stroke-width="0.8"/>
  <line x1="42" y1="22" x2="22" y2="34" stroke="#8E24AA" stroke-width="0.8"/>
  <ellipse cx="32" cy="28" rx="12" ry="3" fill="none" stroke="#8E24AA" stroke-width="0.8"/>
  <!-- Sparkles -->
  <line x1="16" y1="20" x2="14" y2="16" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="48" y1="20" x2="50" y2="16" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="18" y1="42" x2="14" y2="46" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="46" y1="42" x2="50" y2="46" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
</svg>