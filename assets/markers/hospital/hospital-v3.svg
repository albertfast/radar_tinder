<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="redGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#FF1744" flood-opacity="0.8" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="circGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF1744"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="28" fill="url(#circGrad)" filter="url(#redGlow)"/>
  <!-- White hospital icon: cross + building base -->
  <rect x="21" y="14" width="4" height="36" rx="1" fill="#FFFFFF"/>
  <rect x="11" y="24" width="24" height="4" rx="1" fill="#FFFFFF"/>
  <rect x="39" y="28" width="14" height="22" rx="2" fill="#FFFFFF" opacity="0.9"/>
  <rect x="42" y="32" width="3" height="3" rx="0.5" fill="#D50000"/>
  <rect x="48" y="32" width="3" height="3" rx="0.5" fill="#D50000"/>
  <rect x="42" y="38" width="3" height="3" rx="0.5" fill="#D50000"/>
  <rect x="48" y="38" width="3" height="3" rx="0.5" fill="#D50000"/>
  <rect x="44" y="43" width="5" height="7" rx="0.5" fill="#D50000"/>
</svg>