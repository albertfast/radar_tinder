<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="redGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feFlood flood-color="#FF1744" flood-opacity="0.5" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="blueGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feFlood flood-color="#2979FF" flood-opacity="0.5" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Car body (top-down view) -->
  <rect x="18" y="12" width="28" height="42" rx="10" ry="10" fill="#1A237E" stroke="#42A5F5" stroke-width="1.5" filter="url(#glow)"/>
  <!-- Car roof / white stripe -->
  <rect x="20" y="24" width="24" height="18" rx="4" fill="#E3F2FD" opacity="0.15"/>
  <!-- Windshield (top) -->
  <rect x="21" y="15" width="22" height="10" rx="4" fill="#263238" stroke="#546E7A" stroke-width="0.5"/>
  <!-- Windshield glare -->
  <rect x="23" y="17" width="8" height="3" rx="1.5" fill="#546E7A" opacity="0.4"/>
  <!-- Rear window -->
  <rect x="23" y="40" width="18" height="8" rx="3" fill="#263238" stroke="#546E7A" stroke-width="0.5"/>
  <!-- Left headlight -->
  <rect x="20" y="13" width="5" height="3" rx="1" fill="#FFE082" opacity="0.7"/>
  <!-- Right headlight -->
  <rect x="39" y="13" width="5" height="3" rx="1" fill="#FFE082" opacity="0.7"/>
  <!-- Light bar - red (left) -->
  <rect x="20" y="26" width="8" height="4" rx="2" fill="#FF1744" filter="url(#redGlow)"/>
  <!-- Light bar - blue (right) -->
  <rect x="36" y="26" width="8" height="4" rx="2" fill="#2979FF" filter="url(#blueGlow)"/>
  <!-- Light bar center -->
  <rect x="28" y="27" width="8" height="2" rx="1" fill="#546E7A"/>
  <!-- Side stripe -->
  <rect x="18" y="28" width="2" height="14" rx="1" fill="#42A5F5" opacity="0.4"/>
  <rect x="44" y="28" width="2" height="14" rx="1" fill="#42A5F5" opacity="0.4"/>
  <!-- Wheels -->
  <rect x="14" y="16" width="6" height="12" rx="3" fill="#263238"/>
  <rect x="44" y="16" width="6" height="12" rx="3" fill="#263238"/>
  <rect x="14" y="36" width="6" height="12" rx="3" fill="#263238"/>
  <rect x="44" y="36" width="6" height="12" rx="3" fill="#263238"/>
</svg>