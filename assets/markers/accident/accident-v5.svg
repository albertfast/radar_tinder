<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feFlood flood-color="#FFB300" flood-opacity="0.7" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="colorBlur"/>
      <feMerge>
        <feMergeNode in="colorBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="crackGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feFlood flood-color="#FF6600" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="colorBlur"/>
      <feMerge>
        <feMergeNode in="colorBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Top-down car body -->
  <g filter="url(#glow)">
    <!-- Car body outline -->
    <rect x="20" y="14" width="24" height="36" rx="8" fill="#FFB300" stroke="#FFD54F" stroke-width="1"/>
    <!-- Windshield -->
    <rect x="23" y="16" width="18" height="9" rx="3" fill="#332200" stroke="#FFD54F" stroke-width="0.5"/>
    <!-- Rear window -->
    <rect x="23" y="39" width="18" height="8" rx="3" fill="#332200" stroke="#FFD54F" stroke-width="0.5"/>
    <!-- Roof/cabin -->
    <rect x="23" y="27" width="18" height="10" rx="2" fill="#FF8F00" stroke="#FFD54F" stroke-width="0.5"/>
    <!-- Left mirror -->
    <rect x="16" y="22" width="4" height="5" rx="1.5" fill="#FFB300" stroke="#FFD54F" stroke-width="0.5"/>
    <!-- Right mirror -->
    <rect x="44" y="22" width="4" height="5" rx="1.5" fill="#FFB300" stroke="#FFD54F" stroke-width="0.5"/>
  </g>
  <!-- Damage/crack lines radiating out -->
  <g filter="url(#crackGlow)" stroke="#FF5500" stroke-width="1.8" stroke-linecap="round" fill="none">
    <!-- Top cracks -->
    <polyline points="32,14 32,6 28,3"/>
    <polyline points="30,14 26,7 22,4"/>
    <polyline points="34,14 38,7 42,4"/>
    <!-- Left cracks -->
    <polyline points="20,24 12,22 8,18"/>
    <polyline points="20,32 10,32 5,28"/>
    <polyline points="20,40 12,42 8,46"/>
    <!-- Right cracks -->
    <polyline points="44,24 52,22 56,18"/>
    <polyline points="44,32 54,32 59,28"/>
    <polyline points="44,40 52,42 56,46"/>
    <!-- Bottom cracks -->
    <polyline points="32,50 32,58 28,61"/>
    <polyline points="30,50 26,57 22,60"/>
    <polyline points="34,50 38,57 42,60"/>
  </g>
  <!-- Impact dots at crack tips -->
  <g fill="#FF7700">
    <circle cx="28" cy="3" r="1.5"/>
    <circle cx="22" cy="4" r="1.2"/>
    <circle cx="42" cy="4" r="1.2"/>
    <circle cx="8" cy="18" r="1.2"/>
    <circle cx="5" cy="28" r="1.2"/>
    <circle cx="8" cy="46" r="1.2"/>
    <circle cx="56" cy="18" r="1.2"/>
    <circle cx="59" cy="28" r="1.2"/>
    <circle cx="56" cy="46" r="1.2"/>
    <circle cx="28" cy="61" r="1.5"/>
    <circle cx="22" cy="60" r="1.2"/>
    <circle cx="42" cy="60" r="1.2"/>
  </g>
</svg>