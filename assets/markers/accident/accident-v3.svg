<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#FF4500" flood-opacity="0.8" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="colorBlur"/>
      <feMerge>
        <feMergeNode in="colorBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feFlood flood-color="#FFAA00" flood-opacity="0.9" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="colorBlur"/>
      <feMerge>
        <feMergeNode in="colorBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer starburst - large spikes -->
  <g filter="url(#glow)">
    <polygon points="32,4 35,18 44,8 38,22 54,14 41,26 58,24 43,30 60,32 43,34 58,40 41,38 54,50 38,42 44,56 35,46 32,60 29,46 20,56 26,42 10,50 23,38 4,40 21,34 4,32 21,30 4,24 23,26 10,14 26,22 20,8 29,18" fill="#FF4500" stroke="#FF6B00" stroke-width="0.5"/>
  </g>
  <!-- Middle starburst -->
  <g filter="url(#coreGlow)">
    <polygon points="32,12 34,22 40,16 37,25 47,20 39,28 49,28 40,32 49,36 39,36 47,44 37,39 40,48 34,42 32,52 30,42 24,48 27,39 17,44 25,36 15,36 24,32 15,28 25,28 17,20 27,25 24,16 30,22" fill="#FF8C00"/>
  </g>
  <!-- Inner bright core -->
  <circle cx="32" cy="32" r="8" fill="#FFD700" opacity="0.9"/>
  <circle cx="32" cy="32" r="5" fill="#FFEE44"/>
</svg>