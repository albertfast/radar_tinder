<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#FF4500" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="colorBlur"/>
      <feMerge>
        <feMergeNode in="colorBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="burstGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#FF6B00" flood-opacity="0.8" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="colorBlur"/>
      <feMerge>
        <feMergeNode in="colorBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Impact burst at center -->
  <g filter="url(#burstGlow)">
    <polygon points="32,18 34,26 40,20 36,28 44,28 37,32 44,36 36,34 40,42 34,36 32,44 30,36 24,42 28,34 20,36 27,32 20,28 28,28 24,20 30,26" fill="#FF6B00" stroke="#FFAA00" stroke-width="0.5"/>
    <polygon points="32,22 33.5,27 37,23.5 35,29 40,29 35.5,32 40,35 35,33 37,38.5 33.5,35 32,40 30.5,35 27,38.5 29,33 24,35 28.5,32 24,29 29,29 27,23.5 30.5,27" fill="#FFD700"/>
  </g>
  <!-- Car 1 (angled from bottom-left) -->
  <g filter="url(#glow)" transform="translate(8,28) rotate(-30)">
    <rect x="0" y="4" width="18" height="8" rx="2" fill="#FF3333" stroke="#FF6666" stroke-width="0.5"/>
    <rect x="2" y="5" width="5" height="6" rx="1" fill="#FF5555" opacity="0.7"/>
    <rect x="11" y="5" width="5" height="6" rx="1" fill="#FF5555" opacity="0.7"/>
    <rect x="-1" y="5" width="3" height="2" rx="0.5" fill="#FFD700"/>
    <rect x="-1" y="9" width="3" height="2" rx="0.5" fill="#FFD700"/>
    <rect x="16" y="5" width="3" height="2" rx="0.5" fill="#FF2222"/>
    <rect x="16" y="9" width="3" height="2" rx="0.5" fill="#FF2222"/>
  </g>
  <!-- Car 2 (angled from top-right) -->
  <g filter="url(#glow)" transform="translate(38,12) rotate(30)">
    <rect x="0" y="4" width="18" height="8" rx="2" fill="#FF4444" stroke="#FF7777" stroke-width="0.5"/>
    <rect x="2" y="5" width="5" height="6" rx="1" fill="#FF6666" opacity="0.7"/>
    <rect x="11" y="5" width="5" height="6" rx="1" fill="#FF6666" opacity="0.7"/>
    <rect x="-1" y="5" width="3" height="2" rx="0.5" fill="#FFD700"/>
    <rect x="-1" y="9" width="3" height="2" rx="0.5" fill="#FFD700"/>
    <rect x="16" y="5" width="3" height="2" rx="0.5" fill="#FF2222"/>
    <rect x="16" y="9" width="3" height="2" rx="0.5" fill="#FF2222"/>
  </g>
</svg>