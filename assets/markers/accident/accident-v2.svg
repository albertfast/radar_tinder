<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feFlood flood-color="#FFD700" flood-opacity="0.7" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="colorBlur"/>
      <feMerge>
        <feMergeNode in="colorBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="innerGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feFlood flood-color="#FFEE00" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="colorBlur"/>
      <feMerge>
        <feMergeNode in="colorBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Warning triangle -->
  <g filter="url(#glow)">
    <polygon points="32,6 58,52 6,52" fill="#FFD700" stroke="#FFA500" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="32,12 53,49 11,49" fill="#111111" stroke="none"/>
  </g>
  <!-- Exclamation mark -->
  <g filter="url(#innerGlow)">
    <rect x="29.5" y="20" width="5" height="16" rx="2" fill="#FFD700"/>
    <circle cx="32" cy="43" r="3" fill="#FFD700"/>
  </g>
  <!-- Small car silhouette at bottom -->
  <g transform="translate(22,46)">
    <rect x="0" y="3" width="20" height="7" rx="2.5" fill="#FF8C00"/>
    <rect x="3" y="0" width="14" height="6" rx="2" fill="#FF6B00"/>
    <rect x="1" y="4" width="3" height="2.5" rx="0.5" fill="#FFD700"/>
    <rect x="16" y="4" width="3" height="2.5" rx="0.5" fill="#FF2200"/>
  </g>
</svg>