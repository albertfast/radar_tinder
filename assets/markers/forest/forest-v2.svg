<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#00e676" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="colorBlur"/>
      <feMerge>
        <feMergeNode in="colorBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="bgGrad" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </radialGradient>
  </defs>
  <g filter="url(#glow)">
    <circle cx="32" cy="32" r="26" fill="url(#bgGrad)"/>
    <circle cx="32" cy="32" r="24" fill="none" stroke="#00e676" stroke-width="1" opacity="0.4"/>
    <!-- White tree trio -->
    <!-- Left tree -->
    <rect x="14" y="36" width="3" height="14" rx="0.5" fill="#ffffff"/>
    <polygon points="15.5,16 8,28 23,28" fill="#ffffff"/>
    <polygon points="15.5,22 10,30 21,30" fill="#ffffff" opacity="0.7"/>

    <!-- Center tree (tallest) -->
    <rect x="29" y="34" width="4" height="16" rx="0.5" fill="#ffffff"/>
    <polygon points="31,10 20,26 42,26" fill="#ffffff"/>
    <polygon points="31,18 22,30 40,30" fill="#ffffff" opacity="0.7"/>
    <polygon points="31,24 24,34 38,34" fill="#ffffff" opacity="0.5"/>

    <!-- Right tree -->
    <rect x="46" y="38" width="3" height="12" rx="0.5" fill="#ffffff"/>
    <polygon points="47.5,20 40,30 55,30" fill="#ffffff"/>
    <polygon points="47.5,26 42,32 53,32" fill="#ffffff" opacity="0.7"/>
  </g>
</svg>