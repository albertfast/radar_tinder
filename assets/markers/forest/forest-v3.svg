<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#00e676" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="colorBlur"/>
      <feMerge>
        <feMergeNode in="colorBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="badgeGrad" cx="40%" cy="30%">
      <stop offset="0%" stop-color="#66bb6a"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </radialGradient>
  </defs>
  <g filter="url(#glow)">
    <!-- Badge circle -->
    <circle cx="32" cy="32" r="28" fill="url(#badgeGrad)" stroke="#00e676" stroke-width="2"/>
    <circle cx="32" cy="32" r="25" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.3"/>
    <!-- Leaf cluster -->
    <!-- Center leaf -->
    <path d="M32,10 Q26,20 28,30 Q30,34 32,36 Q34,34 36,30 Q38,20 32,10" fill="none" stroke="#ffffff" stroke-width="2"/>
    <line x1="32" y1="10" x2="32" y2="36" stroke="#ffffff" stroke-width="1.2" opacity="0.6"/>
    <!-- Left leaf -->
    <path d="M22,18 Q14,24 16,32 Q18,36 22,38 Q22,34 20,28 Q18,22 22,18" fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.8"/>
    <line x1="22" y1="18" x2="18" y2="36" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
    <!-- Right leaf -->
    <path d="M42,18 Q50,24 48,32 Q46,36 42,38 Q42,34 44,28 Q46,22 42,18" fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.8"/>
    <line x1="42" y1="18" x2="46" y2="36" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
    <!-- Small left leaf -->
    <path d="M18,28 Q10,32 12,38 Q14,42 18,42 Q17,38 16,34 Q15,30 18,28" fill="none" stroke="#ffffff" stroke-width="1.4" opacity="0.6"/>
    <!-- Small right leaf -->
    <path d="M46,28 Q54,32 52,38 Q50,42 46,42 Q47,38 48,34 Q49,30 46,28" fill="none" stroke="#ffffff" stroke-width="1.4" opacity="0.6"/>
    <!-- Stem base -->
    <line x1="32" y1="36" x2="32" y2="50" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="22" y1="38" x2="24" y2="50" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <line x1="42" y1="38" x2="40" y2="50" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>