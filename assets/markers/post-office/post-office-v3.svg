<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#F44336" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="28" fill="#B71C1C" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="25" fill="#C62828" stroke="#EF5350" stroke-width="1.5"/>
  <!-- White mailbox -->
  <rect x="20" y="16" width="24" height="28" rx="3" fill="white"/>
  <rect x="22" y="18" width="20" height="10" rx="2" fill="#C62828" opacity="0.4"/>
  <rect x="24" y="20" width="16" height="6" rx="1" fill="white" opacity="0.8"/>
  <!-- Slot -->
  <rect x="26" y="34" width="12" height="2" rx="1" fill="#C62828" opacity="0.5"/>
  <!-- Post -->
  <rect x="30" y="44" width="4" height="10" rx="1" fill="white"/>
  <!-- Flag -->
  <rect x="44" y="22" width="3" height="14" rx="0.5" fill="white"/>
  <rect x="44" y="22" width="8" height="5" rx="1" fill="white"/>
</svg>