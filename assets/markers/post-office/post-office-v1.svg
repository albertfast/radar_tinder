<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feFlood flood-color="#F44336" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Red envelope -->
  <g filter="url(#glow)">
    <rect x="10" y="18" width="44" height="32" rx="3" fill="#D32F2F"/>
    <path d="M10 18 L32 36 L54 18" fill="none" stroke="#EF5350" stroke-width="2.5"/>
    <path d="M10 50 L26 34" fill="none" stroke="#EF5350" stroke-width="1.5" opacity="0.5"/>
    <path d="M54 50 L38 34" fill="none" stroke="#EF5350" stroke-width="1.5" opacity="0.5"/>
  </g>
  <!-- Stamp -->
  <rect x="40" y="22" width="8" height="8" rx="1" fill="#FFCDD2" opacity="0.7"/>
  <rect x="42" y="24" width="4" height="4" rx="0.5" fill="#EF9A9A" opacity="0.8"/>
  <!-- Address lines -->
  <line x1="16" y1="38" x2="32" y2="38" stroke="#FFCDD2" stroke-width="1" opacity="0.5"/>
  <line x1="16" y1="42" x2="28" y2="42" stroke="#FFCDD2" stroke-width="1" opacity="0.5"/>
</svg>