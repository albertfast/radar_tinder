<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#F44336" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="28" fill="#B71C1C" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="26" fill="#C62828"/>
  <!-- White envelope -->
  <rect x="14" y="20" width="36" height="26" rx="3" fill="white"/>
  <path d="M14 20 L32 36 L50 20" fill="none" stroke="#C62828" stroke-width="2"/>
  <path d="M14 46 L26 34" fill="none" stroke="#C62828" stroke-width="1.5" opacity="0.4"/>
  <path d="M50 46 L38 34" fill="none" stroke="#C62828" stroke-width="1.5" opacity="0.4"/>
</svg>