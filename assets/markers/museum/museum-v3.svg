<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#FFB300" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="28" fill="#E65100" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="25" fill="#EF6C00" stroke="#FFB74D" stroke-width="1.5"/>
  <!-- White statue/bust -->
  <ellipse cx="32" cy="20" rx="6" ry="8" fill="white"/>
  <rect x="28" y="26" width="8" height="4" rx="1" fill="white"/>
  <rect x="24" y="30" width="16" height="4" rx="1" fill="white"/>
  <rect x="22" y="34" width="20" height="8" rx="2" fill="white"/>
  <!-- Face features -->
  <circle cx="30" cy="18" r="1" fill="#EF6C00"/>
  <circle cx="34" cy="18" r="1" fill="#EF6C00"/>
  <path d="M30 22 Q32 24 34 22" fill="none" stroke="#EF6C00" stroke-width="0.8"/>
  <!-- Base -->
  <rect x="20" y="42" width="24" height="4" rx="1" fill="white" opacity="0.7"/>
</svg>