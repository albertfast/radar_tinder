<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feFlood flood-color="#FFB300" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Amber building with columns -->
  <g filter="url(#glow)">
    <rect x="10" y="22" width="44" height="34" rx="1" fill="#FF8F00"/>
    <path d="M8 22 L32 8 L56 22 Z" fill="#FFB300"/>
  </g>
  <!-- Pediment -->
  <path d="M14 22 L32 12 L50 22 Z" fill="#FFC107" opacity="0.6"/>
  <!-- Columns -->
  <rect x="16" y="22" width="4" height="28" rx="1" fill="#FFE082"/>
  <rect x="26" y="22" width="4" height="28" rx="1" fill="#FFE082"/>
  <rect x="34" y="22" width="4" height="28" rx="1" fill="#FFE082"/>
  <rect x="44" y="22" width="4" height="28" rx="1" fill="#FFE082"/>
  <!-- Base -->
  <rect x="10" y="50" width="44" height="4" rx="1" fill="#F57F17"/>
  <!-- Top beam -->
  <rect x="10" y="20" width="44" height="4" rx="1" fill="#F57F17"/>
</svg>