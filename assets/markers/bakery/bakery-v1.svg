<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="croissantGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB347"/>
      <stop offset="50%" stop-color="#E8941E"/>
      <stop offset="100%" stop-color="#CC7700"/>
    </linearGradient>
  </defs>
  <g filter="url(#glow)">
    <!-- Croissant - curved crescent shape -->
    <path d="M10 40 Q8 24 20 16 Q28 10 36 14 Q30 18 26 26 Q22 34 24 40 Q18 46 10 40 Z" fill="url(#croissantGrad)"/>
    <path d="M54 40 Q56 24 44 16 Q36 10 28 14 Q34 18 38 26 Q42 34 40 40 Q46 46 54 40 Z" fill="url(#croissantGrad)"/>
    <!-- Center connection -->
    <ellipse cx="32" cy="38" rx="10" ry="6" fill="url(#croissantGrad)"/>
    <!-- Score lines on croissant -->
    <path d="M18 28 Q22 24 26 28" fill="none" stroke="#CC7700" stroke-width="1.5" opacity="0.5"/>
    <path d="M38 28 Q42 24 46 28" fill="none" stroke="#CC7700" stroke-width="1.5" opacity="0.5"/>
    <!-- Highlight -->
    <path d="M16 30 Q18 22 26 18" fill="none" stroke="#FFD080" stroke-width="1.5" opacity="0.6"/>
    <path d="M48 30 Q46 22 38 18" fill="none" stroke="#FFD080" stroke-width="1.5" opacity="0.6"/>
  </g>
</svg>