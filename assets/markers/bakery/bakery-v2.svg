<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="circleGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFB347"/>
      <stop offset="100%" stop-color="#E88020"/>
    </radialGradient>
  </defs>
  <!-- Orange circle background -->
  <circle cx="32" cy="32" r="28" fill="url(#circleGrad)" filter="url(#glow)"/>
  <!-- White cupcake -->
  <g fill="#FFFFFF">
    <!-- Cupcake base/wrapper -->
    <path d="M20 36 L22 52 L42 52 L44 36 Z"/>
    <!-- Wrapper lines -->
    <line x1="26" y1="36" x2="27" y2="52" stroke="#E88020" stroke-width="1.5" opacity="0.4"/>
    <line x1="32" y1="36" x2="32" y2="52" stroke="#E88020" stroke-width="1.5" opacity="0.4"/>
    <line x1="38" y1="36" x2="37" y2="52" stroke="#E88020" stroke-width="1.5" opacity="0.4"/>
    <!-- Frosting swirl -->
    <path d="M18 36 Q18 28 24 26 Q28 24 32 26 Q36 24 40 26 Q46 28 46 36 Z"/>
    <!-- Cherry on top -->
    <circle cx="32" cy="20" r="4"/>
    <!-- Cherry stem -->
    <path d="M32 16 Q34 12 36 14" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>