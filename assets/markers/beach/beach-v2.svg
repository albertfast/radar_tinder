<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#00e5ff" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="colorBlur"/>
      <feMerge>
        <feMergeNode in="colorBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="bgGrad" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#00acc1"/>
      <stop offset="100%" stop-color="#006064"/>
    </radialGradient>
  </defs>
  <g filter="url(#glow)">
    <circle cx="32" cy="32" r="26" fill="url(#bgGrad)"/>
    <circle cx="32" cy="32" r="24" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.4"/>
    <!-- White palm tree -->
    <!-- Trunk -->
    <path d="M28,52 Q26,40 30,24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <!-- Trunk curve segments -->
    <path d="M29,46 Q28,42 30,38" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
    <path d="M29,38 Q28,34 30,30" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
    <!-- Palm fronds -->
    <path d="M30,24 Q18,14 8,18" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M30,24 Q16,20 10,28" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M30,24 Q20,10 28,8" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M30,24 Q40,10 48,12" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M30,24 Q44,16 52,22" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M30,24 Q44,22 50,30" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Coconuts -->
    <circle cx="28" cy="26" r="2" fill="#ffffff" opacity="0.5"/>
    <circle cx="32" cy="26" r="2" fill="#ffffff" opacity="0.5"/>
  </g>
</svg>