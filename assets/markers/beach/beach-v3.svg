<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#00e5ff" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="colorBlur"/>
      <feMerge>
        <feMergeNode in="colorBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="badgeGrad" cx="40%" cy="30%">
      <stop offset="0%" stop-color="#26c6da"/>
      <stop offset="100%" stop-color="#00838f"/>
    </radialGradient>
  </defs>
  <g filter="url(#glow)">
    <!-- Badge circle -->
    <circle cx="32" cy="32" r="28" fill="url(#badgeGrad)" stroke="#00e5ff" stroke-width="2"/>
    <circle cx="32" cy="32" r="25" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.3"/>
    <!-- Sun -->
    <circle cx="42" cy="18" r="7" fill="#ffffff"/>
    <!-- Sun rays -->
    <line x1="42" y1="8" x2="42" y2="5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="50" y1="12" x2="53" y2="10" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="52" y1="18" x2="55" y2="18" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="50" y1="24" x2="52" y2="26" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="34" y1="12" x2="32" y2="10" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <!-- Waves -->
    <path d="M10,38 Q16,34 22,38 Q28,42 34,38 Q40,34 46,38 Q52,42 56,38" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <path d="M10,46 Q16,42 22,46 Q28,50 34,46 Q40,42 46,46 Q52,50 56,46" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <path d="M14,53 Q20,49 26,53 Q32,57 38,53 Q44,49 50,53" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.35"/>
  </g>
</svg>