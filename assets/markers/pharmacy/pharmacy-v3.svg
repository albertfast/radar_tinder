<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="greenGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#00E676" flood-opacity="0.8" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="circGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#00873E"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="28" fill="url(#circGrad)" filter="url(#greenGlow)"/>
  <!-- White capsule/pill icon -->
  <rect x="20" y="24" width="24" height="16" rx="8" fill="#FFFFFF" transform="rotate(-45 32 32)"/>
  <!-- Capsule divide line -->
  <line x1="24" y1="32" x2="40" y2="32" stroke="#00C853" stroke-width="2" transform="rotate(-45 32 32)"/>
  <!-- Left half tint -->
  <rect x="20" y="24" width="12" height="16" rx="8" fill="#FFFFFF" opacity="0.7" transform="rotate(-45 32 32)"/>
</svg>