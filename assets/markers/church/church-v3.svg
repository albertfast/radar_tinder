<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feFlood flood-color="#FFFFFF" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="28" fill="#37474F" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="25" fill="#455A64" stroke="#B0BEC5" stroke-width="1.5"/>
  <!-- White church steeple -->
  <rect x="28" y="12" width="8" height="4" rx="1" fill="white"/>
  <path d="M26 16 L32 8 L38 16 Z" fill="white"/>
  <!-- Cross on top -->
  <rect x="31" y="4" width="2" height="6" rx="0.5" fill="white"/>
  <rect x="29" y="6" width="6" height="2" rx="0.5" fill="white"/>
  <!-- Church body -->
  <rect x="22" y="16" width="20" height="26" rx="1" fill="white"/>
  <path d="M26 42 Q26 34 32 34 Q38 34 38 42 L38 48 L26 48 Z" fill="#455A64"/>
  <!-- Windows -->
  <rect x="24" y="20" width="5" height="6" rx="2.5" fill="#455A64"/>
  <rect x="35" y="20" width="5" height="6" rx="2.5" fill="#455A64"/>
</svg>