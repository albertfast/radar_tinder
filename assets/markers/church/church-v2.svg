<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feFlood flood-color="#FFFFFF" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="28" fill="#424242" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="26" fill="#616161"/>
  <!-- White cross -->
  <rect x="29" y="14" width="6" height="28" rx="1.5" fill="white"/>
  <rect x="22" y="22" width="20" height="6" rx="1.5" fill="white"/>
</svg>