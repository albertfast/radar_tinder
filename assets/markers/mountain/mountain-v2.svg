<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#B0BEC5" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="28" fill="#37474F" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="26" fill="#455A64"/>
  <!-- White mountain -->
  <path d="M6 48 L26 14 L46 48 Z" fill="white"/>
  <!-- Snow cap -->
  <path d="M20 24 L26 14 L32 24 Z" fill="#455A64" opacity="0.3"/>
  <!-- Second peak -->
  <path d="M30 48 L42 22 L54 48 Z" fill="white" opacity="0.7"/>
  <path d="M38 30 L42 22 L46 30 Z" fill="#455A64" opacity="0.2"/>
</svg>