<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#ff9100" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="colorBlur"/>
      <feMerge>
        <feMergeNode in="colorBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="badgeGrad" cx="40%" cy="30%">
      <stop offset="0%" stop-color="#ffa726"/>
      <stop offset="100%" stop-color="#e65100"/>
    </radialGradient>
  </defs>
  <g filter="url(#glow)">
    <!-- Badge circle -->
    <circle cx="32" cy="32" r="28" fill="url(#badgeGrad)" stroke="#ff9100" stroke-width="2"/>
    <circle cx="32" cy="32" r="25" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.3"/>
    <!-- Hoop rim -->
    <ellipse cx="32" cy="24" rx="14" ry="4" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <!-- Net lines -->
    <line x1="20" y1="26" x2="26" y2="44" stroke="#ffffff" stroke-width="1.2" opacity="0.8"/>
    <line x1="26" y1="26" x2="28" y2="44" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
    <line x1="32" y1="28" x2="32" y2="44" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
    <line x1="38" y1="26" x2="36" y2="44" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
    <line x1="44" y1="26" x2="38" y2="44" stroke="#ffffff" stroke-width="1.2" opacity="0.8"/>
    <!-- Net bottom -->
    <path d="M26,44 Q32,48 38,44" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Backboard -->
    <line x1="24" y1="14" x2="40" y2="14" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Backboard support -->
    <line x1="32" y1="10" x2="32" y2="14" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>