<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#ff9100" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="colorBlur"/>
      <feMerge>
        <feMergeNode in="colorBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="ballGrad" cx="38%" cy="32%">
      <stop offset="0%" stop-color="#ffb74d"/>
      <stop offset="70%" stop-color="#ff6d00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </radialGradient>
  </defs>
  <g filter="url(#glow)">
    <!-- Basketball -->
    <circle cx="32" cy="32" r="22" fill="url(#ballGrad)" stroke="#ff9100" stroke-width="1.5"/>
    <!-- Vertical seam -->
    <line x1="32" y1="10" x2="32" y2="54" stroke="#4e2600" stroke-width="2" opacity="0.7"/>
    <!-- Horizontal seam -->
    <line x1="10" y1="32" x2="54" y2="32" stroke="#4e2600" stroke-width="2" opacity="0.7"/>
    <!-- Curved seams -->
    <path d="M14,18 Q32,28 14,46" fill="none" stroke="#4e2600" stroke-width="2" opacity="0.7"/>
    <path d="M50,18 Q32,28 50,46" fill="none" stroke="#4e2600" stroke-width="2" opacity="0.7"/>
    <!-- Highlight -->
    <ellipse cx="26" cy="24" rx="6" ry="8" fill="#ffffff" opacity="0.15"/>
  </g>
</svg>