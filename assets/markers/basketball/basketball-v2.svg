<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#ff9100" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="colorBlur"/>
      <feMerge>
        <feMergeNode in="colorBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="bgGrad" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#ff9100"/>
      <stop offset="100%" stop-color="#e65100"/>
    </radialGradient>
  </defs>
  <g filter="url(#glow)">
    <circle cx="32" cy="32" r="26" fill="url(#bgGrad)"/>
    <circle cx="32" cy="32" r="24" fill="none" stroke="#ffcc80" stroke-width="1" opacity="0.4"/>
    <!-- White basketball silhouette -->
    <circle cx="32" cy="32" r="13" fill="none" stroke="#ffffff" stroke-width="2.2"/>
    <!-- Vertical line -->
    <line x1="32" y1="19" x2="32" y2="45" stroke="#ffffff" stroke-width="2"/>
    <!-- Horizontal line -->
    <line x1="19" y1="32" x2="45" y2="32" stroke="#ffffff" stroke-width="2"/>
    <!-- Curved lines -->
    <path d="M22,23 Q32,30 22,41" fill="none" stroke="#ffffff" stroke-width="1.8"/>
    <path d="M42,23 Q32,30 42,41" fill="none" stroke="#ffffff" stroke-width="1.8"/>
  </g>
</svg>