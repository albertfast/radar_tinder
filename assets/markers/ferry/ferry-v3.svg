<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#2196F3" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="28" fill="#0D47A1" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="25" fill="#1565C0" stroke="#42A5F5" stroke-width="1.5"/>
  <!-- White ship -->
  <path d="M18 38 L22 30 L42 30 L46 38 L42 42 L22 42 Z" fill="white"/>
  <rect x="28" y="22" width="8" height="8" rx="1.5" fill="#1565C0"/>
  <rect x="30" y="24" width="4" height="4" rx="0.5" fill="white" opacity="0.8"/>
  <rect x="31" y="16" width="2" height="8" rx="0.5" fill="white"/>
  <!-- Waves -->
  <path d="M16 44 Q22 40 28 44 Q34 48 40 44 Q46 40 52 44" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
</svg>