<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#2196F3" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="28" fill="#0D47A1" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="26" fill="#1565C0"/>
  <!-- White anchor -->
  <circle cx="32" cy="18" r="3" fill="none" stroke="white" stroke-width="2.5"/>
  <line x1="32" y1="21" x2="32" y2="44" stroke="white" stroke-width="2.5"/>
  <line x1="26" y1="24" x2="38" y2="24" stroke="white" stroke-width="2.5"/>
  <path d="M22 40 Q27 48 32 44 Q37 48 42 40" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
</svg>