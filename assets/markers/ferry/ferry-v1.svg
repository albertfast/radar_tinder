<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feFlood flood-color="#2196F3" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Boat on waves -->
  <path d="M10 38 L16 28 L48 28 L54 38 L48 42 L16 42 Z" fill="#2196F3" filter="url(#glow)"/>
  <rect x="26" y="18" width="12" height="10" rx="2" fill="#1565C0"/>
  <rect x="28" y="20" width="4" height="6" rx="1" fill="#BBDEFB" opacity="0.8"/>
  <rect x="34" y="20" width="2" height="6" rx="0.5" fill="#BBDEFB" opacity="0.6"/>
  <!-- Smoke stack -->
  <rect x="30" y="12" width="4" height="8" rx="1" fill="#42A5F5"/>
  <!-- Waves -->
  <path d="M6 44 Q14 40 22 44 Q30 48 38 44 Q46 40 54 44 Q58 46 58 44" fill="none" stroke="#64B5F6" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M4 50 Q12 46 20 50 Q28 54 36 50 Q44 46 52 50 Q58 54 60 50" fill="none" stroke="#42A5F5" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
</svg>